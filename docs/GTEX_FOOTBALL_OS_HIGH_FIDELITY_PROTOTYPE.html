<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101316">
  <title>GTEX Football OS Alternative Prototype</title>
  <style>
    :root {
      --bg: #101316;
      --bg-deep: #0b0d10;
      --surface-1: #171b20;
      --surface-2: #1e242b;
      --surface-3: #252c35;
      --surface-4: #2d333b;
      --line: #343c46;
      --line-soft: #252b33;
      --text: #f2f4f6;
      --muted: #a9b1ba;
      --dim: #717b86;
      --blue: #2f6fed;
      --blue-soft: #8fb3ff;
      --green: #19a974;
      --amber: #d99a24;
      --red: #d34d4d;
      --gold: #c7a24a;
      --pitch: #2f7d4a;
      --home: #edf3f8;
      --away: #d7b56d;
      --shadow: rgba(0, 0, 0, 0.34);
      --radius: 6px;
      --font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      --fs-xs: 11px;
      --fs-sm: 12px;
      --fs-md: 13px;
      --fs-base: 14px;
      --fs-lg: 16px;
      --fs-xl: 20px;
      --fs-xxl: 28px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-variant-numeric: tabular-nums;
    }

    body {
      overflow: hidden;
    }

    button,
    input,
    select {
      font: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
    }

    .app-shell {
      display: grid;
      grid-template-columns: 236px minmax(0, 1fr) 362px;
      grid-template-rows: 56px minmax(0, 1fr) 34px;
      grid-template-areas:
        "sidebar topbar rail"
        "sidebar main rail"
        "ticker ticker ticker";
      height: 100vh;
      background:
        linear-gradient(90deg, rgba(199, 162, 74, 0.03), transparent 34%),
        linear-gradient(180deg, #13171c 0%, #0e1115 100%);
    }

    .sidebar {
      grid-area: sidebar;
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-width: 0;
      border-right: 1px solid var(--line);
      background: #11151a;
    }

    .brand-block {
      padding: 14px 14px 12px;
      border-bottom: 1px solid var(--line-soft);
    }

    .brand-lockup {
      display: grid;
      grid-template-columns: 38px 1fr;
      gap: 10px;
      align-items: center;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(199, 162, 74, 0.72);
      border-radius: var(--radius);
      color: var(--gold);
      font-family: var(--mono);
      font-size: var(--fs-sm);
      font-weight: 800;
      background:
        linear-gradient(135deg, rgba(199, 162, 74, 0.16), transparent 52%),
        #141a20;
    }

    .brand-kicker {
      margin: 0;
      color: var(--muted);
      font-size: var(--fs-xs);
      line-height: 1.3;
    }

    .brand-title {
      margin: 0 0 2px;
      font-size: var(--fs-lg);
      font-weight: 800;
      line-height: 1;
    }

    .club-strip {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      margin-top: 12px;
      padding: 8px;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      background: var(--surface-1);
    }

    .club-strip strong {
      display: block;
      font-size: var(--fs-sm);
    }

    .club-strip span {
      display: block;
      color: var(--dim);
      font-size: var(--fs-xs);
    }

    .crest {
      width: 24px;
      height: 28px;
      border-radius: 5px 5px 9px 9px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background:
        linear-gradient(90deg, var(--gold) 0 33%, #161b20 33% 66%, var(--green) 66%),
        var(--surface-3);
      box-shadow: inset 0 0 0 2px rgba(0, 0, 0, 0.18);
    }

    .module-nav {
      padding: 10px 8px;
      overflow-y: auto;
    }

    .nav-button {
      width: 100%;
      display: grid;
      grid-template-columns: 32px 1fr auto;
      gap: 8px;
      align-items: center;
      min-height: 42px;
      margin-bottom: 4px;
      padding: 6px 8px;
      border: 1px solid transparent;
      border-radius: var(--radius);
      background: transparent;
      text-align: left;
      transition: background 120ms ease, border-color 120ms ease;
    }

    .nav-button:hover {
      background: rgba(255, 255, 255, 0.04);
      border-color: var(--line-soft);
    }

    .nav-button.is-active {
      border-color: rgba(199, 162, 74, 0.52);
      background: rgba(199, 162, 74, 0.12);
    }

    .nav-code {
      width: 30px;
      height: 28px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      color: var(--muted);
      font-family: var(--mono);
      font-size: var(--fs-xs);
      background: var(--bg-deep);
    }

    .is-active .nav-code {
      color: var(--gold);
      border-color: rgba(199, 162, 74, 0.7);
    }

    .nav-label strong {
      display: block;
      font-size: var(--fs-sm);
      line-height: 1.2;
    }

    .nav-label span {
      display: block;
      color: var(--dim);
      font-size: var(--fs-xs);
      line-height: 1.2;
    }

    .nav-count {
      min-width: 22px;
      padding: 2px 5px;
      border-radius: 99px;
      color: var(--muted);
      background: var(--surface-2);
      font-family: var(--mono);
      font-size: 10px;
      text-align: center;
    }

    .sidebar-footer {
      padding: 10px 12px 12px;
      border-top: 1px solid var(--line-soft);
    }

    .operator-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .topbar {
      grid-area: topbar;
      display: grid;
      grid-template-columns: minmax(170px, 0.75fr) minmax(190px, 1fr) auto;
      gap: 10px;
      align-items: center;
      min-width: 0;
      padding: 8px 12px;
      border-bottom: 1px solid var(--line);
      background: #151a20;
    }

    .topbar-section {
      min-width: 0;
    }

    .market-window {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .live-dot {
      width: 9px;
      height: 9px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 0 rgba(25, 169, 116, 0.5);
      animation: livePulse 1800ms ease-out infinite;
    }

    @keyframes livePulse {
      0% { box-shadow: 0 0 0 0 rgba(25, 169, 116, 0.5); }
      70% { box-shadow: 0 0 0 7px rgba(25, 169, 116, 0); }
      100% { box-shadow: 0 0 0 0 rgba(25, 169, 116, 0); }
    }

    .market-window strong {
      overflow: hidden;
      font-size: var(--fs-sm);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .market-window span {
      color: var(--dim);
      font-family: var(--mono);
      font-size: var(--fs-xs);
      white-space: nowrap;
    }

    .search-box {
      display: grid;
      grid-template-columns: 28px 1fr auto;
      align-items: center;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--bg-deep);
    }

    .search-box span {
      color: var(--dim);
      text-align: center;
      font-family: var(--mono);
      font-size: var(--fs-sm);
    }

    .search-box input {
      width: 100%;
      min-width: 0;
      height: 34px;
      border: 0;
      outline: 0;
      color: var(--text);
      background: transparent;
      font-size: var(--fs-sm);
    }

    .search-box kbd {
      margin-right: 7px;
      padding: 2px 5px;
      border: 1px solid var(--line-soft);
      border-radius: 4px;
      color: var(--dim);
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 600;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      min-width: 0;
    }

    .main {
      grid-area: main;
      min-width: 0;
      overflow-x: hidden;
      overflow-y: auto;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.018), transparent 180px),
        var(--bg);
    }

    .workspace {
      min-height: 100%;
      min-width: 0;
      overflow-x: hidden;
      padding: 12px;
    }

    .context-rail {
      grid-area: rail;
      min-width: 0;
      overflow: auto;
      border-left: 1px solid var(--line);
      background: #12171d;
    }

    .rail-inner {
      padding: 12px;
    }

    .ticker {
      grid-area: ticker;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      min-width: 0;
      height: 34px;
      border-top: 1px solid var(--line);
      background: #090b0e;
    }

    .ticker-label {
      align-self: stretch;
      display: grid;
      place-items: center;
      padding: 0 12px;
      color: #101316;
      background: var(--gold);
      font-size: var(--fs-xs);
      font-weight: 900;
    }

    .ticker-track {
      display: flex;
      gap: 14px;
      align-items: center;
      min-width: 0;
      overflow: hidden;
      padding: 0 12px;
      color: var(--muted);
      font-size: var(--fs-xs);
      white-space: nowrap;
    }

    .ticker-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      border: 0;
      color: var(--muted);
      background: transparent;
      font-size: var(--fs-xs);
      white-space: nowrap;
    }

    .ticker-item:hover {
      color: var(--text);
    }

    .ticker-time {
      color: var(--gold);
      font-family: var(--mono);
    }

    .ticker-channel {
      color: var(--blue-soft);
      font-family: var(--mono);
    }

    .ticker-control {
      height: 100%;
      padding: 0 10px;
      border: 0;
      border-left: 1px solid var(--line-soft);
      color: var(--muted);
      background: transparent;
      font-size: var(--fs-xs);
    }

    .view-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: end;
      margin-bottom: 12px;
    }

    .eyebrow {
      margin: 0 0 4px;
      color: var(--gold);
      font-size: var(--fs-xs);
      font-weight: 800;
      line-height: 1.2;
    }

    .view-title {
      margin: 0;
      font-size: var(--fs-xxl);
      line-height: 1;
    }

    .view-subtitle {
      max-width: 820px;
      margin: 6px 0 0;
      color: var(--muted);
      font-size: var(--fs-sm);
      line-height: 1.45;
    }

    .header-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 6px;
    }

    .signal-band {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }

    .metric {
      min-width: 0;
      padding: 10px;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      background: var(--surface-1);
    }

    .metric span {
      display: block;
      overflow: hidden;
      color: var(--dim);
      font-size: var(--fs-xs);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .metric strong {
      display: block;
      margin-top: 4px;
      overflow: hidden;
      font-family: var(--mono);
      font-size: var(--fs-xl);
      line-height: 1;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .metric em {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-style: normal;
      font-size: var(--fs-xs);
    }

    .work-grid {
      display: grid;
      gap: 10px;
    }

    .grid-two {
      grid-template-columns: minmax(0, 1.25fr) minmax(320px, 0.75fr);
    }

    .grid-three {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .grid-wide {
      grid-column: 1 / -1;
    }

    .panel {
      min-width: 0;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      background: var(--surface-1);
      box-shadow: 0 12px 30px var(--shadow);
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 36px;
      padding: 8px 10px;
      border-bottom: 1px solid var(--line-soft);
      background: rgba(255, 255, 255, 0.018);
    }

    .panel-header h2,
    .panel-header h3 {
      margin: 0;
      overflow: hidden;
      font-size: var(--fs-sm);
      line-height: 1.2;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .panel-header span {
      color: var(--dim);
      font-family: var(--mono);
      font-size: var(--fs-xs);
      white-space: nowrap;
    }

    .panel-body {
      min-width: 0;
      padding: 10px;
    }

    .panel-scroll {
      max-height: 360px;
      overflow: auto;
    }

    .broadcast-panel {
      border-color: rgba(199, 162, 74, 0.38);
      background:
        linear-gradient(135deg, rgba(199, 162, 74, 0.08), transparent 44%),
        var(--surface-1);
    }

    .row-list {
      display: grid;
      gap: 6px;
    }

    .info-row,
    .list-row {
      display: grid;
      gap: 8px;
      align-items: center;
      min-width: 0;
      padding: 8px;
      border: 1px solid transparent;
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.02);
      transition: background 120ms ease, border-color 120ms ease;
    }

    .list-row {
      grid-template-columns: minmax(0, 1fr) auto;
    }

    .list-row:hover,
    .info-row:hover {
      border-color: var(--line);
      background: rgba(255, 255, 255, 0.045);
    }

    .list-row.is-selected,
    .info-row.is-selected {
      border-color: rgba(47, 111, 237, 0.58);
      background: rgba(47, 111, 237, 0.1);
    }

    .row-main {
      min-width: 0;
    }

    .row-title {
      display: flex;
      gap: 8px;
      align-items: center;
      min-width: 0;
      margin: 0;
      font-size: var(--fs-sm);
      font-weight: 800;
      line-height: 1.2;
    }

    .row-title span:first-child {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .row-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 4px;
      color: var(--dim);
      font-size: var(--fs-xs);
      line-height: 1.3;
    }

    .row-meta b {
      color: var(--muted);
      font-family: var(--mono);
      font-weight: 700;
    }

    .row-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 5px;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: var(--fs-xs);
    }

    .table-wrap {
      max-width: 100%;
      min-width: 0;
      overflow-x: auto;
    }

    .data-table th,
    .data-table td {
      padding: 7px 8px;
      border-bottom: 1px solid var(--line-soft);
      text-align: left;
      vertical-align: middle;
      white-space: nowrap;
    }

    .data-table th {
      position: sticky;
      top: 0;
      z-index: 1;
      color: var(--dim);
      background: var(--surface-1);
      font-weight: 700;
    }

    .data-table tbody tr {
      transition: background 120ms ease;
    }

    .data-table tbody tr:hover {
      background: rgba(255, 255, 255, 0.04);
    }

    .data-table tbody tr.is-selected {
      background: rgba(47, 111, 237, 0.11);
      box-shadow: inset 2px 0 0 var(--blue);
    }

    .mono {
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
    }

    .muted {
      color: var(--dim);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 18px;
      padding: 2px 6px;
      border: 1px solid currentColor;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 800;
      line-height: 1;
      white-space: nowrap;
    }

    .badge.live,
    .status-positive {
      color: var(--green);
    }

    .badge.info,
    .status-info {
      color: var(--blue-soft);
    }

    .badge.warn,
    .status-warning {
      color: var(--amber);
    }

    .badge.danger,
    .status-danger {
      color: var(--red);
    }

    .badge.gold,
    .status-gold {
      color: var(--gold);
    }

    .badge.neutral {
      color: var(--muted);
    }

    .btn {
      min-height: 28px;
      padding: 5px 8px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      color: var(--muted);
      background: var(--surface-2);
      font-size: var(--fs-xs);
      font-weight: 700;
      transition: background 120ms ease, color 120ms ease, border-color 120ms ease;
    }

    .btn:hover {
      color: var(--text);
      border-color: var(--muted);
      background: var(--surface-3);
    }

    .btn.primary {
      color: #f5f8ff;
      border-color: rgba(47, 111, 237, 0.8);
      background: var(--blue);
    }

    .btn.gold {
      color: #15120a;
      border-color: var(--gold);
      background: var(--gold);
    }

    .btn.danger {
      color: #fff6f6;
      border-color: rgba(211, 77, 77, 0.8);
      background: rgba(211, 77, 77, 0.25);
    }

    .btn.ghost {
      background: transparent;
    }

    .segmented {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: center;
    }

    .segmented .btn.is-active {
      color: var(--gold);
      border-color: rgba(199, 162, 74, 0.7);
      background: rgba(199, 162, 74, 0.12);
    }

    .spark {
      display: grid;
      grid-template-columns: repeat(16, 1fr);
      gap: 2px;
      align-items: end;
      height: 30px;
      margin-top: 7px;
    }

    .spark i {
      display: block;
      min-height: 4px;
      border-radius: 2px 2px 0 0;
      background: var(--blue-soft);
      opacity: 0.72;
    }

    .bar-track {
      height: 7px;
      overflow: hidden;
      border-radius: 99px;
      background: var(--bg-deep);
    }

    .bar-fill {
      height: 100%;
      border-radius: inherit;
      background: var(--green);
    }

    .split-bars {
      display: grid;
      gap: 8px;
    }

    .split-line {
      display: grid;
      grid-template-columns: 100px 1fr auto;
      gap: 8px;
      align-items: center;
      color: var(--muted);
      font-size: var(--fs-xs);
    }

    .mini-board {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(92px, 1fr));
      gap: 6px;
    }

    .mini-cell {
      min-width: 0;
      padding: 8px;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.018);
    }

    .mini-cell span {
      display: block;
      color: var(--dim);
      font-size: var(--fs-xs);
    }

    .mini-cell strong {
      display: block;
      margin-top: 3px;
      font-family: var(--mono);
      font-size: var(--fs-md);
    }

    .rail-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .rail-title h2 {
      margin: 0;
      font-size: var(--fs-lg);
    }

    .rail-stack {
      display: grid;
      gap: 10px;
    }

    .rail-section {
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      background: var(--surface-1);
    }

    .rail-section h3 {
      margin: 0;
      padding: 9px 10px;
      border-bottom: 1px solid var(--line-soft);
      font-size: var(--fs-sm);
    }

    .rail-section .rail-body {
      padding: 10px;
    }

    .key-value {
      display: grid;
      grid-template-columns: minmax(110px, 1fr) auto;
      gap: 8px;
      padding: 6px 0;
      border-bottom: 1px solid var(--line-soft);
      color: var(--muted);
      font-size: var(--fs-xs);
    }

    .key-value:last-child {
      border-bottom: 0;
    }

    .key-value strong {
      color: var(--text);
      font-family: var(--mono);
      font-size: var(--fs-xs);
      text-align: right;
    }

    .match-layout {
      display: grid;
      grid-template-columns: minmax(150px, 0.55fr) minmax(320px, 1.4fr) minmax(190px, 0.75fr);
      gap: 10px;
    }

    .scorebug {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 10px;
      align-items: center;
      padding: 10px;
      border: 1px solid rgba(199, 162, 74, 0.42);
      border-radius: var(--radius);
      background: #161b22;
    }

    .team-score {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .team-score.away {

      if (["watch", "tracked", "info", "approvals", "scheduled", "pending", "review"].includes(v)) cls = "info";
      if (["urgent", "counter", "medium", "rival bid", "work permit", "warn", "held", "investigating", "monitoring"].includes(v)) cls = "warn";
      if (["high", "danger", "critical", "rejected", "limited"].includes(v)) cls = "danger";
      if (["goal", "gold", "elite", "premium"].includes(v)) cls = "gold";
      return `<span class="badge ${cls}">${value}</span>`;

    function pulse() {
      const transferVolume = state.deals.reduce((sum, deal) => sum + deal.fee, 0) + state.transferOrders.reduce((sum, order) => sum + order.maxFee, 0);
      const walletTotal = state.wallets.reduce((sum, wallet) => sum + wallet.balance, 0);
      const creatorRevenue = state.creators.reduce((sum, creator) => sum + creator.revenue, 0);
      const adminBacklog = state.adminOps.filter(op => !["resolved", "rejected"].includes(op.status)).length;
      return {
        activeFixtures: state.fixtures.filter(fx => fx.status === "LIVE").length,
        transferVolume,
        walletSettlement: 98.4 - state.ledger.filter(entry => entry.status !== "settled").length * 1.7,
        liquidity: state.assets.reduce((sum, asset) => sum + asset.liquidity, 0),
        creatorRevenue,
        adminBacklog,
        integrityRisk: 10 + state.adminOps.filter(op => op.severity === "high").length * 7 + state.ledger.filter(entry => entry.risk).length * 4,
        walletTotal
      };
    }

    function renderPitch() {

      const pressure = overlay === "pressure" || overlay === "territory" ? `
        <rect x="50" y="0" width="25" height="64" fill="rgba(217,154,36,0.18)" class="pitch-zone" data-select-type="zone" data-select-id="middle-press"></rect>
        <rect x="75" y="0" width="25" height="64" fill="rgba(25,169,116,0.16)" class="pitch-zone" data-select-type="zone" data-select-id="final-third"></rect>
      ` : "";
      const market = overlay === "market" ? `
        <circle cx="76" cy="23" r="7" fill="none" stroke="#8fb3ff" stroke-width="0.5" opacity="0.8"></circle>
        <text x="76" y="15" fill="#8fb3ff" font-size="2.6" text-anchor="middle" font-family="monospace">+14 VALUE</text>
        <circle cx="53" cy="34" r="6" fill="none" stroke="#d99a24" stroke-width="0.5" opacity="0.75"></circle>
      ` : "";
      const shots = overlay === "shots" || overlay === "xg" ? state.events.filter(ev => ev.xg > 0).map((ev, index) => `
        <circle cx="${index === 0 ? 78 : 82}" cy="${index === 0 ? 31 : 22}" r="${2 + ev.xg * 8}" fill="rgba(199,162,74,0.38)" stroke="#c7a24a" stroke-width="0.35" class="pitch-event" data-select-type="event" data-select-id="${ev.id}"></circle>
      `).join("") : "";
      const passNetwork = overlay === "shape" ? `
        <path d="M53 34 L64 39 L76 23 L84 32 L75 51" fill="none" stroke="rgba(237,243,248,0.32)" stroke-width="0.45"></path>
        <path d="M53 34 L58 22 L76 23" fill="none" stroke="rgba(237,243,248,0.24)" stroke-width="0.35"></path>
      ` : "";
      return `
        <svg class="pitch-svg" viewBox="0 0 100 64" role="img" aria-label="Live 2D football pitch">
          <defs>
            <pattern id="grass" width="100" height="12" patternUnits="userSpaceOnUse">
              <rect width="100" height="6" fill="#245f3a"></rect>
              <rect y="6" width="100" height="6" fill="#2f7d4a"></rect>
            </pattern>
          </defs>
          <rect x="0" y="0" width="100" height="64" fill="url(#grass)"></rect>
          ${pressure}
          <rect x="3" y="3" width="94" height="58" fill="none" stroke="rgba(237,243,248,0.82)" stroke-width="0.45"></rect>
          <line x1="50" y1="3" x2="50" y2="61" stroke="rgba(237,243,248,0.72)" stroke-width="0.35"></line>
          <circle cx="50" cy="32" r="8" fill="none" stroke="rgba(237,243,248,0.72)" stroke-width="0.35"></circle>
          <circle cx="50" cy="32" r="0.6" fill="rgba(237,243,248,0.9)"></circle>
          <rect x="3" y="18" width="14" height="28" fill="none" stroke="rgba(237,243,248,0.72)" stroke-width="0.35"></rect>
          <rect x="83" y="18" width="14" height="28" fill="none" stroke="rgba(237,243,248,0.72)" stroke-width="0.35"></rect>
          <rect x="3" y="25" width="5" height="14" fill="none" stroke="rgba(237,243,248,0.72)" stroke-width="0.35"></rect>
          <rect x="92" y="25" width="5" height="14" fill="none" stroke="rgba(237,243,248,0.72)" stroke-width="0.35"></rect>
          ${passNetwork}
          ${shots}
          ${market}
          ${players.map(player => `
            <g class="pitch-player ${isSelected("player", player.id)}" data-select-type="player" data-select-id="${player.id}">
              <circle cx="${player.x}" cy="${player.y}" r="1.85" fill="${player.team === "home" ? "#edf3f8" : "#d7b56d"}" stroke="${player.team === "home" ? "#101316" : "#11151a"}" stroke-width="0.45"></circle>

            </g>
          `).join("")}
          <circle cx="${m.ball.x}" cy="${m.ball.y}" r="1.05" fill="#f2f4f6" stroke="#101316" stroke-width="0.35"></circle>
          <circle cx="${m.ball.x}" cy="${m.ball.y}" r="3.2" fill="none" stroke="rgba(242,244,246,0.32)" stroke-width="0.35"></circle>
        </svg>
      `;

        ]))
      ]);
    }

    function railTraders() {
      return railShell("Marketplace Control", "trader desk", [
        railSection("Top Desks", smallRows(state.traders.map(trader => [trader.name, `${trader.pnl}% 30d`, trader.status]))),
        railSection("Asset Heat", smallRows(state.assets.map(asset => [asset.asset, `${asset.change > 0 ? "+" : ""}${asset.change.toFixed(1)}`, asset.sentiment]))),
        railSection("Controls", actionStack([
          ["Open liquidity window", "open-liquidity"],
          ["Run abnormal spike scan", "risk-sweep"],
          ["Publish mandate update", "publish-mandate"]
        ]))
      ]);
    }

    function railCreators() {
      return railShell("Creator Yield Desk", "media economy", [
        railSection("Campaign Fit", smallRows(state.campaigns.map(campaign => [campaign.name, `${campaign.yield}% yield`, campaign.status]))),
        railSection("Creator Watch", smallRows(state.creators.map(creator => [creator.handle, `${creator.engagement}% eng`, creator.status]))),
        railSection("Controls", actionStack([
          ["Approve U23 market watch", "approve-u23"],
          ["Boost derby package", "content-drop"],
          ["Release rights memo", "rights-memo"]
        ]))
      ]);
    }

    function railMatch() {
      return railShell("Tactical Assistant", "live match", [
        railSection("Key Events", `<div class="event-feed">${state.events.slice(0, 4).map(renderEventRow).join("")}</div>`),
        railSection("Tactical Alerts", smallRows([
          ["Atlantic right channel", "Repeated exposure", "warn"],
          ["Lagos left build-up", "42% progression", "live"],
          ["Okoro market signal", "+14 asset impact", "gold"]
        ])),
        railSection("Market Impact", railRows([
          ["Home win probability", "64%"],
          ["Next goal index", "Home +8.2"],
          ["Liquidity window", "Open"]
        ]))
      ]);
    }

    function railAdmin() {
      return railShell("Incident Queue", "admin ops", [
        railSection("SLA Pressure", smallRows(state.adminOps.map(op => [op.entity, `${op.sla}m`, op.severity]))),
        railSection("Platform Health", railRows([
          ["Event bus", "99.98"],
          ["Wallet rail", "98.4"],
          ["Match feed", "live"],
          ["Audit mode", "enabled"]
        ])),
        railSection("Admin Actions", actionStack([
          ["Escalate payment review", "escalate-random"],
          ["Run sync job", "run-sync"],
          ["Freeze suspicious settlement", "hold-trader-settlement"]
        ]))
      ]);
    }

    function railRows(items) {
      return items.map(item => `<div class="key-value"><span>${item[0]}</span><strong>${item[1]}</strong></div>`).join("");
    }

    function smallRows(items) {
      return `<div class="row-list">${items.map(item => `<div class="list-row"><div><p class="row-title"><span>${item[0]}</span>${statusBadge(item[2])}</p><div class="row-meta"><span>${item[1]}</span></div></div></div>`).join("")}</div>`;
    }

    function actionStack(items) {
      return `<div class="row-list">${items.map(item => `<button class="btn" data-action="${item[1]}">${item[0]}</button>`).join("")}</div>`;
    }

    function tickerRail() {
      return `<div class="row-list">${state.tickers.slice(0, 5).map(tick => `<div class="info-row"><p class="row-title"><span>${tick.channel}</span>${statusBadge(tick.severity)}</p><div class="row-meta"><span>${tick.time}</span><span>${tick.text}</span></div></div>`).join("")}</div>`;
    }

    function renderSearchRail() {
      const q = state.search.trim().toLowerCase();
      const results = [
        ...state.players.map(item => ({ type: "player", id: item.id, title: item.name, meta: `${item.club} | ${item.pos} | ${gtx(item.value)}` })),
        ...state.clubs.map(item => ({ type: "club", id: item.id, title: item.name, meta: `${item.league} | cash ${gtx(item.cash)}` })),
        ...state.wallets.map(item => ({ type: "wallet", id: item.id, title: item.name, meta: `${gtx(item.balance)} | ${item.status}` })),
        ...state.traders.map(item => ({ type: "trader", id: item.id, title: item.name, meta: `${item.strategy} | rep ${item.reputation}` })),
        ...state.assets.map(item => ({ type: "asset", id: item.id, title: item.asset, meta: `${item.price.toFixed(1)} | ${item.sentiment}` }))
      ].filter(item => `${item.title} ${item.meta}`.toLowerCase().includes(q)).slice(0, 12);
      return railShell("Global Search", `${results.length} matches`, [
        railSection("Results", `<div class="row-list">${results.map(result => `
          <button class="list-row" data-select-type="${result.type}" data-select-id="${result.id}">
            <div><p class="row-title"><span>${result.title}</span>${statusBadge(result.type)}</p><div class="row-meta"><span>${result.meta}</span></div></div>
          </button>
        `).join("") || `<div class="notice">No entity matches the current query.</div>`}</div>`)
      ]);
    }

    function renderInspector(entity) {
      const { type, item } = entity;
      const title = item.name || item.handle || item.asset || item.player || item.entity || item.ref || item.id;
      const sections = [];
      if (type === "player") {
        sections.push(railSection("Player Profile", railRows([
          ["Club", item.club],
          ["Role", item.pos],
          ["Age", item.age],
          ["Value", gtx(item.value)],
          ["Wage", gtx(item.wage)],
          ["Scout grade", item.scout],
          ["Demand", item.demand]
        ])));
        sections.push(railSection("Operational Actions", actionStack([
          ["Add to shortlist", `shortlist:${item.id}`],
          ["Open bid controls", `bid-player:${item.id}`],
          ["Pin recruitment report", `pin:${type}:${item.id}`]
        ])));
      } else if (type === "club") {
        sections.push(railSection("Club Finance", railRows([
          ["League", item.league],
          ["Cash", gtx(item.cash)],
          ["Transfer budget", gtx(item.transferBudget)],
          ["Wage bill", gtx(item.wageBill)],
          ["Board", `${item.board}/100`],
          ["FFP risk", `${item.ffp}/100`]
        ])));
      } else if (type === "event") {
        sections.push(railSection("Match Incident", railRows([
          ["Time", item.minute],
          ["Team", item.team],
          ["Player", item.player],
          ["Event", item.type],
          ["xG", item.xg.toFixed(2)],
          ["Zone", item.zone]
        ])));
      } else {
        sections.push(railSection("Entity Snapshot", Object.entries(item).slice(0, 9).map(([key, value]) => `<div class="key-value"><span>${key}</span><strong>${formatAny(value)}</strong></div>`).join("")));
      }
      sections.push(railSection("Context Trail", tickerRail()));
      return railShell(title, `${type} inspector`, sections);
    }

    function formatAny(value) {
      if (typeof value === "number") return value > 9999 ? gtx(value) : String(value);
      if (typeof value === "boolean") return value ? "yes" : "no";
      return String(value);
    }

    function selectedEntity() {
      const { type, id } = state.selected;
      if (!type || !id) return null;
      const collections = {
        player: state.players,
        club: state.clubs,
        fixture: state.fixtures,
        event: state.events,
        deal: state.deals,
        order: state.transferOrders,
        wallet: state.wallets,
        ledger: state.ledger,
        trader: state.traders,
        asset: state.assets,
        creator: state.creators,
        campaign: state.campaigns,
        op: state.adminOps
      };
      const item = collections[type]?.find(entry => entry.id === id);
      return item ? { type, item } : null;
    }

    function isSelected(type, id) {
      return state.selected.type === type && state.selected.id === id ? "is-selected" : "";
    }

    function renderTicker() {
      if (state.tickerHeld) return;
      document.getElementById("tickerTrack").innerHTML = state.tickers.slice(0, 14).map(tick => `
        <button class="ticker-item" data-action="ticker-select" data-id="${tick.id}">
          <span class="ticker-time">${tick.time}</span>
          <span class="ticker-channel">${tick.channel}</span>
          <span>${tick.text}</span>
        </button>
      `).join("");
    }

    function renderWorkspace() {
      const views = {
        pulse: renderPulse,
        club: renderClub,
        transfers: renderTransfers,
        capital: renderCapital,
        traders: renderTraders,
        creators: renderCreators,
        match: renderMatch,
        admin: renderAdmin
      };
      document.getElementById("workspace").innerHTML = views[state.activeView]();
    }

    function render() {
      renderNav();
      renderTopbar();
      renderWorkspace();
      renderRail();
      renderTicker();
    }

    function selectEntity(type, id) {
      state.selected = { type, id };
      state.search = "";
      document.getElementById("globalSearch").value = "";
      render();
    }

    function handleAction(action, element) {
      if (action.includes(":")) {
        const [base, typeOrId, id] = action.split(":");
        if (base === "shortlist") shortlist(typeOrId);
        if (base === "bid-player") bidPlayer(typeOrId);
        if (base === "pin") addTicker("Pinned", `${typeOrId} ${id} pinned to operator rail`, "info");
        render();
        return;
      }

      switch (action) {
        case "role":
          state.role = element.dataset.role || state.role;
          addTicker("Operator", `Role switched to ${state.role}`, "info");
          break;
        case "toggle-live":
          state.running = !state.running;
          addTicker("System", `Live simulation ${state.running ? "resumed" : "held"}`, state.running ? "live" : "warn");
          break;
        case "toggle-ticker":
          state.tickerHeld = !state.tickerHeld;
          break;
        case "overlay":
          state.overlay = element.dataset.mode || "shape";
          break;
        case "inject-event":
          generateMatchEvent(true);
          break;
        case "inject-goal":
          generateGoal(true);
          break;
        case "reset-world":
          state.match.minute = 37;
          state.match.second = 42;
          state.match.score = { home: 1, away: 0 };
          addTicker("System", "Mock world reset to comparison baseline", "info");
          break;
        case "shortlist":
          shortlist(element.dataset.id);
          break;
        case "bid-player":
          bidPlayer(element.dataset.id);
          break;
        case "match-order":
          matchOrder(element.dataset.id);
          break;
        case "advance-deal":
        case "counter-deal":
          advanceDeal(element.dataset.id, "counter");
          break;
        case "accept-deal":
          advanceDeal(element.dataset.id, "accepted");
          break;
        case "new-rival-bid":
          rivalBid();
          break;
        case "settle-ledger":
          settleLedger(element.dataset.id);
          break;
        case "simulate-settlement":
          settleRandomLedger();
          break;
        case "export-ledger":
          addTicker("Capital", "Ledger CSV generated locally for operator review", "info");
          break;
        case "approve-sponsor":
          addTicker("Capital", `${element.dataset.name} sponsor package moved to board approval`, "live");
          break;
        case "price-tick":
          updateMarketPrices(true);
          break;
        case "buy-asset":
          buyAsset(element.dataset.id);
          break;
        case "follow-trader":
          followTrader(element.dataset.id);
          break;
        case "risk-sweep":
          addTicker("Trader", "Abnormal spike scan completed across four football indexes", "info");
          break;
        case "accept-mandate":
          addTicker("Trader", `Mandate accepted: ${element.dataset.name}`, "live");
          break;
        case "boost-creator":
          boostCreator(element.dataset.id);
          break;
        case "approve-campaign":
          approveCampaign(element.dataset.id);
          break;
        case "content-drop":
          contentDrop();
          break;
        case "settle-creators":
          addTicker("Creator", "Creator revenue split batch queued for wallet settlement", "live");
          break;
        case "hold-op":
          updateOp(element.dataset.id, "held");
          break;
        case "resolve-op":
          updateOp(element.dataset.id, "resolved");
          break;
        case "escalate-random":
          escalateRandom();
          break;
        case "run-sync":
          addTicker("Admin", "Event bus sync job completed with 99.98 reliability", "live");
          break;
        case "set-speed":
          setSpeed(Number(element.dataset.speed));
          break;
        case "ticker-select":
          addTicker("Rail", "Ticker item pinned into contextual inspection trail", "info");
          break;
        case "renew-contract":
          addTicker("Club HQ", "Protection terms drafted for Chidi Okoro", "gold");
          break;
        case "list-player":
          addTicker("Club HQ", "Rotation player flagged for controlled market listing", "warn");
          break;
        default:
          addTicker("Command", `${action.replaceAll("-", " ")} executed`, "info");
      }
      render();
    }

    function shortlist(id) {
      const player = state.players.find(item => item.id === id) || state.players.find(item => item.id === state.selected.id);
      if (!player) return;
      player.status = "shortlist";
      addTicker("Transfer", `${player.name} added to Lagos Crown shortlist`, "info");
      state.selected = { type: "player", id: player.id };
    }

    function bidPlayer(id) {
      const player = state.players.find(item => item.id === id) || state.players.find(item => item.id === state.selected.id);
      if (!player) return;
      player.status = "bid lodged";
      state.deals.unshift({ id: `deal-${Date.now()}`, player: player.name, buyer: "Lagos Crown FC", seller: player.club, fee: Math.round(player.value * 0.92), status: "bid lodged", risk: player.risk, next: "Await seller response" });
      addTicker("Transfer", `Bid lodged for ${player.name} at ${gtx(player.value * 0.92)}`, "live");
    }

    function matchOrder(id) {
      const order = state.transferOrders.find(item => item.id === id);
      if (!order) return;
      order.status = "matched";
      addTicker("Transfer", `${order.club} ${order.position} order matched to scout shortlist`, "live");
    }

    function advanceDeal(id, status) {
      const deal = state.deals.find(item => item.id === id);
      if (!deal) return;
      deal.status = status === "accepted" ? "accepted" : "counter sent";
      deal.next = status === "accepted" ? "Escrow release" : "Awaiting seller reply";
      addTicker("Transfer", `${deal.player} deal ${deal.status} at ${gtx(deal.fee)}`, status === "accepted" ? "live" : "warn");
    }

    function rivalBid() {
      const player = state.players.find(item => item.id === "p-rivas") || state.players[3];
      player.status = "rival bid";
      player.value += 600000;
      addTicker("Transfer", `Rival bid raised ${player.name} valuation to ${gtx(player.value)}`, "warn");
    }

    function settleLedger(id) {
      const entry = state.ledger.find(item => item.id === id);
      if (!entry) return;
      entry.status = "settled";
      entry.risk = false;
      addTicker("Capital", `${entry.ref} settled for ${gtx(entry.amount)}`, "live");
    }

    function settleRandomLedger() {
      const entry = state.ledger.find(item => item.status !== "settled");
      if (entry) settleLedger(entry.id);
      else addTicker("Capital", "No unsettled ledger entries remain", "info");
    }

    function buyAsset(id) {
      const asset = state.assets.find(item => item.id === id);
      if (!asset) return;
      asset.liquidity += 42000;
      asset.change += 0.2;
      addTicker("Trader", `Mock buy order placed on ${asset.asset}`, "live");
      state.selected = { type: "asset", id };
    }

    function followTrader(id) {
      const trader = state.traders.find(item => item.id === id);
      if (!trader) return;
      trader.status = "followed";
      addTicker("Trader", `${trader.name} added to institutional watchlist`, "info");
      state.selected = { type: "trader", id };
    }

    function boostCreator(id) {
      const creator = state.creators.find(item => item.id === id);
      if (!creator) return;
      creator.engagement = Number((creator.engagement + 0.4).toFixed(1));
      creator.revenue += 2800;
      addTicker("Creator", `${creator.handle} boosted; engagement now ${creator.engagement}%`, "live");
    }

    function approveCampaign(id) {
      const campaign = state.campaigns.find(item => item.id === id);
      if (!campaign) return;
      campaign.status = "active";
      addTicker("Creator", `${campaign.name} campaign approved`, "live");
    }

    function contentDrop() {
      const creator = state.creators[0];
      creator.revenue += 5200;
      creator.engagement = Number((creator.engagement + 0.6).toFixed(1));
      addTicker("Creator", `${creator.handle} content drop beat forecast; revenue +${gtx(5200)}`, "gold");
    }

    function updateOp(id, status) {
      const op = state.adminOps.find(item => item.id === id);
      if (!op) return;
      op.status = status;
      addTicker("Admin", `${op.type} for ${op.entity} marked ${status}`, status === "resolved" ? "live" : "warn");
    }

    function escalateRandom() {
      const op = state.adminOps.find(item => item.status !== "resolved") || state.adminOps[0];
      op.severity = "high";
      op.sla = Math.max(8, op.sla - 15);
      addTicker("Admin", `${op.entity} escalated to high severity`, "danger");
    }

    function setSpeed(value) {
      state.speed = value;
      document.getElementById("speedSelect").value = String(value);
      restartTimer();
      addTicker("System", `Simulation speed set to ${value === 1200 ? "deadline" : value === 4200 ? "calm" : "normal"}`, "info");
    }

    function updateMarketPrices(forceTicker = false) {
      state.assets.forEach(asset => {
        const drift = (Math.random() - 0.42) * 0.8;
        asset.price = Math.max(20, Number((asset.price + drift).toFixed(1)));
        asset.change = Number((asset.change + drift / 2).toFixed(1));
        asset.liquidity += Math.round((Math.random() - 0.35) * 18000);
      });
      if (forceTicker || Math.random() > 0.45) {
        const asset = state.assets[Math.floor(Math.random() * state.assets.length)];
        addTicker("Trader", `${asset.asset} ${asset.change >= 0 ? "+" : ""}${asset.change.toFixed(1)} with ${gtx(asset.liquidity)} liquidity`, asset.change > 3 ? "warn" : "info", false);
      }
    }

    function generateGoal(selectEvent = false) {
      const scorer = Math.random() > 0.32 ? state.players.find(p => p.id === "p-okoro") : state.players.find(p => p.id === "p-hart");
      const teamKey = scorer.team === "home" ? "home" : "away";
      state.match.score[teamKey] += 1;
      state.match.shots[teamKey] += 1;
      state.match.xg[teamKey] += 0.34;
      scorer.rating = Number((scorer.rating + 0.6).toFixed(1));
      scorer.xg += 0.34;
      const ev = {
        id: `ev-${Date.now()}`,
        minute: matchClock(),
        type: "Goal",
        team: scorer.club,
        player: scorer.name,
        xg: 0.34,
        zone: scorer.team === "home" ? "Left half-space" : "Central break",
        severity: "gold"
      };
      state.events.unshift(ev);
      if (selectEvent) {
        state.selected = { type: "event", id: ev.id };
      }
      addTicker("Match", `${matchClock()} Goal ${scorer.club}: ${scorer.name}`, "gold", false);
      addTicker("Trader", `Goal moved home control model to ${64 + state.match.score.home * 3}%`, "info", false);
    }

    function generateMatchEvent(force = false) {
      const weights = [
        ["Pass sequence", 35],
        ["Shot", 12],
        ["Save", 8],
        ["Yellow card", 5],
        ["Injury check", 4],
        ["Goal", force ? 20 : 3],
        ["VAR review", 2],
        ["Tactical change", 6],
        ["Market movement", 8],
        ["Scout flag", 7]
      ];
      const type = weighted(weights);
      if (type === "Goal") {
        generateGoal(force);
        return;
      }
      const player = state.players.filter(p => ["home", "away"].includes(p.team))[Math.floor(Math.random() * 5)];
      const isShot = type === "Shot" || type === "Save";
      const teamKey = player.team === "away" ? "away" : "home";
      if (isShot) {
        state.match.shots[teamKey] += 1;
        state.match.xg[teamKey] += 0.05;
        player.xg += 0.05;
      }
      state.match.ball = { x: clamp(player.x + (Math.random() - 0.5) * 8, 6, 94), y: clamp(player.y + (Math.random() - 0.5) * 8, 5, 59) };
      state.match.momentum = clamp(state.match.momentum + (teamKey === "home" ? 2 : -2) + Math.round((Math.random() - 0.5) * 6), 28, 78);
      state.match.timeline.push(state.match.momentum);
      state.match.timeline = state.match.timeline.slice(-16);
      const ev = {
        id: `ev-${Date.now()}`,
        minute: matchClock(),
        type,
        team: player.club,
        player: player.name,
        xg: isShot ? 0.05 : 0,
        zone: ["Zone 14", "Left channel", "Right channel", "Final third", "Middle third"][Math.floor(Math.random() * 5)],
        severity: type.includes("Yellow") || type.includes("Injury") ? "warn" : type.includes("Market") ? "info" : "live"
      };
      state.events.unshift(ev);
      state.events = state.events.slice(0, 28);
      addTicker(type.includes("Market") ? "Trader" : type.includes("Scout") ? "Transfer" : "Match", `${matchClock()} ${ev.team}: ${ev.type} by ${ev.player}`, ev.severity, false);
    }

    function weighted(items) {
      const total = items.reduce((sum, item) => sum + item[1], 0);
      let roll = Math.random() * total;
      for (const item of items) {
        roll -= item[1];
        if (roll <= 0) return item[0];
      }
      return items[0][0];
    }

    function advanceFixtureMinutes() {
      state.now = new Date(state.now.getTime() + 1000 * 24);
      state.match.second += 24;
      while (state.match.second >= 60) {
        state.match.second -= 60;
        state.match.minute += 1;
      }
      if (state.match.minute >= 45 && state.match.minute < 46) state.match.status = "HT SOON";
      if (state.match.minute >= 90) state.match.status = "FT";
      state.fixtures.forEach(fx => {
        if (fx.status === "LIVE") fx.minute = Math.min(90, fx.minute + (Math.random() > 0.5 ? 1 : 0));
      });
      state.transferOrders.forEach(order => {
        order.expires = Math.max(0, Number((order.expires - 0.1).toFixed(1)));
        if (order.expires === 0) order.status = "expired";
      });
      state.adminOps.forEach(op => {
        if (op.status !== "resolved") op.sla = Math.max(0, op.sla - 1);
      });
    }

    function tickWorld() {
      if (!state.running) {
        state.now = new Date(state.now.getTime() + 1000);
        renderTopbar();
        return;
      }
      state.tick += 1;
      advanceFixtureMinutes();
      generateMatchEvent();
      updateMarketPrices(false);
      if (Math.random() > 0.72) settleRandomLedger();
      if (Math.random() > 0.82) contentDrop();
      if (state.tick % 3 === 0) {
        const player = state.players[Math.floor(Math.random() * state.players.length)];
        player.demand = clamp(player.demand + Math.round((Math.random() - 0.38) * 5), 35, 98);
      }
      render();
    }

    let timer = null;
    function restartTimer() {
      if (timer) window.clearInterval(timer);
      timer = window.setInterval(tickWorld, state.speed);
    }

    document.addEventListener("click", event => {
      const nav = event.target.closest("[data-view]");
      if (nav) {
        state.activeView = nav.dataset.view;
        state.selected = { type: null, id: null };
        state.search = "";
        document.getElementById("globalSearch").value = "";
        render();
        document.getElementById("main").focus();
        return;
      }

      const action = event.target.closest("[data-action]");
      if (action) {
        handleAction(action.dataset.action, action);
        return;
      }

      const selectable = event.target.closest("[data-select-type][data-select-id]");
      if (selectable) {
        selectEntity(selectable.dataset.selectType, selectable.dataset.selectId);
      }
    });

    document.getElementById("globalSearch").addEventListener("input", event => {
      state.search = event.target.value;
      renderRail();
    });

    document.getElementById("speedSelect").addEventListener("change", event => {
      setSpeed(Number(event.target.value));
      render();
    });

    document.addEventListener("keydown", event => {
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "k") {
        event.preventDefault();
        document.getElementById("globalSearch").focus();
      }
    });

    seedTickers();
    render();
    restartTimer();
  </script>
</body>
</html>
