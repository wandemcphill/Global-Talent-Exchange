[pytest]
testpaths =
    backend/tests
    tests
addopts =
    --import-mode=importlib
    --ignore-glob=.pytest*
    --ignore-glob=.tmp*
    --ignore-glob=backend/.pytest*
    --ignore-glob=backend/.tmp*
    --ignore-glob=backend/.tmp_testdirs/*
    --ignore-glob=tmp/*
norecursedirs =
    .git
    .pytest_cache
    .pytest*
    .tmp*
    pytest-cache-files-*
    tmp
    backend/.pytest*
    backend/.tmp*
    backend/.tmp_testdirs
    frontend
    Docs
    v1_original
    v2
