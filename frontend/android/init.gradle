// Flutter's included Gradle build takes Kotlin from the Plugin Portal. That copy
// imports kotlin-gradle-plugins-bom, which exists on Maven Central only, and
// Gradle will not cross repositories to load the BOM. Exclusive repository
// content is not an option: Flutter plugins add their own buildscript
// repositories, and Gradle rejects that combination.
gradle.beforeSettings { settings ->
    settings.pluginManagement.repositories {
        mavenCentral()
        google()
        gradlePluginPortal {
            content {
                excludeGroup("org.jetbrains.kotlin")
            }
        }
    }
}
