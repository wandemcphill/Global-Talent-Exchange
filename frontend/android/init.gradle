// Flutter's included Gradle build resolves Kotlin plugins from the Gradle Plugin
// Portal. The portal copy of Kotlin 2.2.21 imports kotlin-gradle-plugins-bom,
// which is published on Maven Central only. Gradle will not cross repositories
// to load that BOM, so the Android build stops before it compiles.
gradle.beforeSettings { settings ->
    settings.pluginManagement.repositories {
        exclusiveContent {
            forRepository {
                mavenCentral()
            }
            filter {
                includeGroup("org.jetbrains.kotlin")
            }
        }
        mavenCentral()
        google()
        gradlePluginPortal()
    }
}
