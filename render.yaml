services:
  # 🌐 API
  - name: gtex-api
    type: web
    runtime: python
    region: frankfurt
    plan: starter
    buildCommand: "pip install -r backend/requirements.txt"
    preDeployCommand: "bash ops/render/production-preflight.sh && cd backend && alembic -c migrations/alembic.ini upgrade head"
    startCommand: "cd backend && gunicorn app.asgi:app --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --workers ${WEB_CONCURRENCY:-2} --timeout 180 --graceful-timeout 120"
    envVars:
      - key: WEB_CONCURRENCY
        value: "4"
      # Supabase PostgreSQL connection string (postgresql://...?sslmode=require).
      # Set manually in the Render dashboard. GTEX no longer provisions a
      # Render-managed Postgres instance; the database lives on Supabase.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_ENABLED
        value: "true"
      # Manual Render Redis instance connection string (rediss://...).
      # Set in the dashboard. Blueprint does NOT provision Redis (no keyvalue block),
      # so it can never recreate it or change its plan.
      - key: GTE_REDIS_URL
        sync: false
      - key: GTE_APP_ENV
        value: production
      - key: GTE_RUN_MIGRATION_CHECK
        value: "true"
      - key: GTE_INGESTION_PROVIDER
        value: sportmonks
      - key: GTE_CORS_ALLOW_ORIGIN_REGEX
        value: ""
      - key: GTE_AUTH_SECRET
        sync: false
      - key: GTE_MEDIA_SIGNING_SECRET
        sync: false
      - key: GTE_KORAPAY_PUBLIC_KEY
        sync: false
      - key: GTE_KORAPAY_SECRET_KEY
        sync: false
      - key: GTE_KORAPAY_ENCRYPTION_KEY
        sync: false
      - key: GTE_KORAPAY_WEBHOOK_SECRET
        sync: false
      - key: GTE_KORAPAY_NOTIFICATION_URL
        value: https://gtex-api-cijn.onrender.com/api/webhooks/korapay
      - key: GTE_ENABLE_PAYSTACK
        value: "false"
      - key: TREASURY_BANK_NAME
        sync: false
      - key: TREASURY_ACCOUNT_NAME
        sync: false
      - key: TREASURY_ACCOUNT_NUMBER
        sync: false
      - key: GTE_OUTBOX_RELAY_ENABLED
        value: "false"
      - key: GTE_TASK_QUEUE_ENABLED
        value: "true"
      # Cache the full tradable-player record set in-process for this many
      # seconds. The market listing query loads all ~30k players + relationships
      # per request (filtering/sorting happen in Python); caching turns that into
      # one load per TTL. 0 disables (default outside production).
      - key: GTE_MARKET_RECORDS_CACHE_TTL_SECONDS
        value: "300"

  # 🎨 Web
  - name: gtex-web
    type: web
    runtime: static
    buildCommand: "bash ops/render/build-frontend.sh"
    staticPublishPath: "frontend/build/web"
    envVars:
      - key: GTE_API_BASE_URL
        value: https://gtex-api-cijn.onrender.com
      - key: GTE_BACKEND_MODE
        value: live

  # ⚙️ RQ Worker
  - name: gtex-rq-worker
    type: worker
    runtime: python
    region: frankfurt
    plan: starter
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && python -m app.workers.rq_worker_main"
    envVars:
      # Supabase PostgreSQL connection string (postgresql://...?sslmode=require).
      # Set manually in the Render dashboard. GTEX no longer provisions a
      # Render-managed Postgres instance; the database lives on Supabase.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_ENABLED
        value: "true"
      # Manual Render Redis instance connection string (rediss://...).
      # Set in the dashboard. Blueprint does NOT provision Redis (no keyvalue block),
      # so it can never recreate it or change its plan.
      - key: GTE_REDIS_URL
        sync: false
      - key: GTE_APP_ENV
        value: production
      # Must be set to the SAME value as gtex-api's GTE_AUTH_SECRET /
      # GTE_MEDIA_SIGNING_SECRET (sync: false on every service so Blueprint never
      # overwrites them). Mismatched values will break cross-service auth.
      - key: GTE_AUTH_SECRET
        sync: false
      - key: GTE_MEDIA_SIGNING_SECRET
        sync: false
      - key: GTE_RUN_MIGRATION_CHECK
        value: "true"
      - key: GTE_INGESTION_PROVIDER
        value: sportmonks
      - key: GTE_OUTBOX_RELAY_ENABLED
        value: "false"
      - key: GTE_TASK_QUEUE_ENABLED
        value: "true"

  # 🎮 Simulation Worker
  - name: gtex-simulation-worker
    type: worker
    runtime: python
    region: frankfurt
    plan: starter
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && python -m app.backbone.simulation_worker_main"
    envVars:
      # Supabase PostgreSQL connection string (postgresql://...?sslmode=require).
      # Set manually in the Render dashboard. GTEX no longer provisions a
      # Render-managed Postgres instance; the database lives on Supabase.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_ENABLED
        value: "true"
      # Manual Render Redis instance connection string (rediss://...).
      # Set in the dashboard. Blueprint does NOT provision Redis (no keyvalue block),
      # so it can never recreate it or change its plan.
      - key: GTE_REDIS_URL
        sync: false
      - key: GTE_APP_ENV
        value: production
      # Must be set to the SAME value as gtex-api's GTE_AUTH_SECRET /
      # GTE_MEDIA_SIGNING_SECRET (sync: false on every service so Blueprint never
      # overwrites them). Mismatched values will break cross-service auth.
      - key: GTE_AUTH_SECRET
        sync: false
      - key: GTE_MEDIA_SIGNING_SECRET
        sync: false
      - key: GTE_RUN_MIGRATION_CHECK
        value: "true"
      - key: GTE_INGESTION_PROVIDER
        value: sportmonks
      - key: GTE_OUTBOX_RELAY_ENABLED
        value: "false"

  # 📡 Outbox Relay
  - name: gtex-outbox-relay
    type: worker
    runtime: python
    region: frankfurt
    plan: starter
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && python -m app.backbone.outbox_relay_main"
    envVars:
      # Supabase PostgreSQL connection string (postgresql://...?sslmode=require).
      # Set manually in the Render dashboard. GTEX no longer provisions a
      # Render-managed Postgres instance; the database lives on Supabase.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_ENABLED
        value: "true"
      # Manual Render Redis instance connection string (rediss://...).
      # Set in the dashboard. Blueprint does NOT provision Redis (no keyvalue block),
      # so it can never recreate it or change its plan.
      - key: GTE_REDIS_URL
        sync: false
      - key: GTE_APP_ENV
        value: production
      # Must be set to the SAME value as gtex-api's GTE_AUTH_SECRET /
      # GTE_MEDIA_SIGNING_SECRET (sync: false on every service so Blueprint never
      # overwrites them). Mismatched values will break cross-service auth.
      - key: GTE_AUTH_SECRET
        sync: false
      - key: GTE_MEDIA_SIGNING_SECRET
        sync: false
      - key: GTE_RUN_MIGRATION_CHECK
        value: "true"
      - key: GTE_INGESTION_PROVIDER
        value: sportmonks
      - key: GTE_OUTBOX_RELAY_ENABLED
        value: "true"

  # Player Ingestion Worker
  - name: gtex-player-ingestion-worker
    type: worker
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: "cd services/player-ingestion && npm ci"
    startCommand: "cd services/player-ingestion && npm run migrate && npm start"
    envVars:
      # Supabase PostgreSQL connection string (postgresql://...?sslmode=require).
      # Set manually in the Render dashboard. GTEX no longer provisions a
      # Render-managed Postgres instance; the database lives on Supabase.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_ENABLED
        value: "true"
      # Manual Render Redis instance connection string (rediss://...).
      # Set in the dashboard. Blueprint does NOT provision Redis (no keyvalue block),
      # so it can never recreate it or change its plan.
      - key: GTE_REDIS_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: SPORTMONKS_BASE_URL
        value: https://api.sportmonks.com/v3/football
      - key: SPORTMONKS_API_TOKEN
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: AUDIO_COMMENTARY_ENABLED
        value: "false"
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: CLOUDINARY_PLAYER_FOLDER
        value: gtex/players
      - key: WIKIMEDIA_FALLBACK_ENABLED
        value: "true"
      - key: WIKIMEDIA_RIGHTS_CLEARED_DEFAULT
        value: "false"
      - key: GTEX_REGENS_PER_LEAGUE
        value: "3"
      - key: INGESTION_CRON
        value: "0 */6 * * *"
      - key: INGESTION_RUN_ON_START
        value: "true"
      - key: INGESTION_WORKER_CONCURRENCY
        value: "4"
      - key: INGESTION_LOCK_KEY
        value: ingestion_lock
      - key: INGESTION_LOCK_TTL_SECONDS
        value: "3600"
      - key: INGESTION_RUN_TIMEOUT_SECONDS
        value: "3300"
      - key: HEALTH_SERVER_ENABLED
        value: "true"
      - key: HEALTH_PORT
        value: "3000"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=512"
      - key: SENTRY_DSN
        sync: false
      - key: SEASON_ENGINE_ENABLED
        value: "false"
      - key: SEASON_CRON
        value: "15 0 * * *"
      - key: SEASON_FIXTURES_PER_DAY
        value: "1"
      - key: SEASON_REGENS_PER_SEASON
        value: "12"
      - key: SEASON_TRANSFERS_ENABLED
        value: "false"
      - key: SEASON_TRANSFER_LIMIT_PER_TICK
        value: "1"
      - key: SEASON_TRANSFER_WINDOWS
        value: "2026-01-01:2026-01-31,2026-08-01:2026-08-31"

  # 🧑‍🤝‍🧑 Real-player ingest (cron job)
  # Ingests real players for leagues that still need them (the original 6 top
  # leagues are already populated). Runs on Render's stable network so the
  # supervised refresh can complete — a laptop session cannot (slow EU-pooler
  # throughput + dropped connections). Writes are DB-idempotent, so the
  # schedule can re-run safely; trigger manually from the dashboard for a
  # one-off backfill.
  - name: gtex-realplayer-ingest
    type: cronjob
    runtime: python
    region: frankfurt
    plan: starter
    schedule: "0 3 * * *"
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "bash ops/render/run-realplayer-ingest.sh"
    envVars:
      # Supabase PostgreSQL connection string (postgresql://...?sslmode=require).
      - key: DATABASE_URL
        sync: false
      # SportMonks v3 token (same value as gtex-player-ingestion-worker).
      - key: SPORTMONKS_API_TOKEN
        sync: false
      - key: SPORTMONKS_BASE_URL
        value: https://api.sportmonks.com/v3/football
      - key: GTE_APP_ENV
        value: production
      - key: GTE_INGESTION_PROVIDER
        value: sportmonks
      # Same values as gtex-api (cross-service auth). Optional — the script
      # falls back to local-dev secrets for this CLI path if unset.
      - key: GTE_AUTH_SECRET
        sync: false
      - key: GTE_MEDIA_SIGNING_SECRET
        sync: false

# NOTE: NO Blueprint-managed paid resources.
# - PostgreSQL is hosted on Supabase (no `databases:` block).
# - Redis is a MANUALLY-created Render Redis/Key-Value instance (no `keyvalue`
#   service block). Blueprint therefore never provisions, recreates, or re-plans
#   Redis. Services consume it via GTE_REDIS_URL (sync: false), set in the dashboard.
# All connection strings and secrets use `sync: false` so Blueprint cannot
# overwrite dashboard-managed values on deploy.
