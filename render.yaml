services:
  - type: web
    name: gtex-api
    runtime: python
    plan: starter
    numInstances: 2
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    preDeployCommand: python -m alembic -c backend/migrations/alembic.ini upgrade head
    # Gunicorn binds the port in the master process before the heavy FastAPI
    # app import finishes, which avoids Render's cold-start port scan failures.
    startCommand: gunicorn backend.app.asgi:app --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --workers 1 --timeout 180 --graceful-timeout 120
    healthCheckPath: /health
    autoDeployTrigger: off
    maxShutdownDelaySeconds: 120
    buildFilter:
      paths:
        - backend/**
        - services/**
        - ops/render/**
        - render.yaml
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: DATABASE_URL
        fromDatabase:
          name: gtex-postgres
          property: connectionString
      - key: GTE_REDIS_URL
        fromService:
          name: gtex-cache
          type: keyvalue
          property: connectionString
      - key: GTE_KAFKA_BROKERS
        sync: false
      - key: GTE_KAFKA_TOPIC_PREFIX
        value: gtex
      - key: GTE_OUTBOX_RELAY_ENABLED
        value: "false"
      - key: GTE_KAFKA_API_QUEUE_CONSUMER_ENABLED
        value: "true"
      - key: GTE_APP_ENV
        value: production
      - key: GTE_APP_NAME
        value: Global Talent Exchange API
      - key: GTE_APP_VERSION
        value: 0.1.0
      - key: GTE_CORS_ALLOW_ORIGINS
        value: https://gtex-web.onrender.com
      - key: GTE_CORS_ALLOW_ORIGIN_REGEX
        value: https?://(?:localhost|127\.0\.0\.1)(?::\d+)?$
      - key: GTE_CORS_ALLOW_CREDENTIALS
        value: "false"
      - key: GTE_PHASE_MARKER
        value: phase-8
      - key: GTE_CONFIG_DIR
        value: backend/config
      - key: GTE_AUTH_SECRET
        generateValue: true
      - key: GTE_MEDIA_SIGNING_SECRET
        generateValue: true
      - key: GTE_RUN_MIGRATION_CHECK
        value: "false"
      - key: GTE_INGESTION_PROVIDER
        value: mock
      - key: GTE_PROVIDER_TIMEOUT_SECONDS
        value: "20"
      - key: GTE_VALUE_SNAPSHOT_LOOKBACK_DAYS
        value: "7"
      - key: GTE_API_CACHE_ENABLED
        value: "true"
      - key: GTE_PLAYER_MARKETS_CACHE_TTL_SECONDS
        value: "5"
      - key: GTE_COMPETITIONS_CACHE_TTL_SECONDS
        value: "30"
      - key: GTE_REGEN_UNIVERSE_CACHE_TTL_SECONDS
        value: "15"
      - key: GTE_DISTRIBUTED_RATE_LIMIT_ENABLED
        value: "true"
      - key: GTE_API_RATE_LIMIT_PER_MINUTE
        value: "100"
      - key: GTE_SENSITIVE_RATE_LIMIT_PER_MINUTE
        value: "5"
      - key: GTE_TASK_QUEUE_ENABLED
        value: "true"
      - key: GTE_TASK_QUEUE_NAME
        value: gtex-jobs
      - key: GTE_CRYPTO_DEPOSIT_ENABLED
        value: "false"
      - key: GTE_CRYPTO_PROVIDER_KEY
        value: crypto_fiat
      # This path is writable on Render, but uploads remain ephemeral until you
      # move media to a persistent disk or external object storage.
      - key: GTE_MEDIA_STORAGE_ROOT
        value: backend/storage
      - key: GTE_MEDIA_DOWNLOAD_BASE_URL
        value: /media-engine/downloads
      # Add FOOTBALL_DATA_API_KEY in the Render dashboard only if you switch
      # GTE_INGESTION_PROVIDER to football_data.

  - type: worker
    name: gtex-outbox-relay
    runtime: python
    plan: starter
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: bash -lc "cd backend && python -m app.backbone.outbox_relay_main"
    autoDeployTrigger: off
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: DATABASE_URL
        fromDatabase:
          name: gtex-postgres
          property: connectionString
      - key: GTE_REDIS_URL
        fromService:
          name: gtex-cache
          type: keyvalue
          property: connectionString
      - key: GTE_KAFKA_BROKERS
        sync: false
      - key: GTE_KAFKA_TOPIC_PREFIX
        value: gtex
      - key: GTE_OUTBOX_RELAY_ENABLED
        value: "true"
      - key: GTE_APP_ENV
        value: production
      - key: GTE_APP_NAME
        value: Global Talent Exchange Relay
      - key: GTE_APP_VERSION
        value: 0.1.0
      - key: GTE_CONFIG_DIR
        value: backend/config

  - type: worker
    name: gtex-simulation-worker
    runtime: python
    plan: starter
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: bash -lc "cd backend && python -m app.backbone.simulation_worker_main"
    autoDeployTrigger: off
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: DATABASE_URL
        fromDatabase:
          name: gtex-postgres
          property: connectionString
      - key: GTE_REDIS_URL
        fromService:
          name: gtex-cache
          type: keyvalue
          property: connectionString
      - key: GTE_KAFKA_BROKERS
        sync: false
      - key: GTE_KAFKA_TOPIC_PREFIX
        value: gtex
      - key: GTE_OUTBOX_RELAY_ENABLED
        value: "false"
      - key: GTE_APP_ENV
        value: production
      - key: GTE_APP_NAME
        value: Global Talent Exchange Simulation Worker
      - key: GTE_APP_VERSION
        value: 0.1.0
      - key: GTE_CONFIG_DIR
        value: backend/config

  - type: worker
    name: gtex-projection-workers
    runtime: python
    plan: starter
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: bash -lc "cd backend && python -m app.backbone.projection_worker_main"
    autoDeployTrigger: off
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: DATABASE_URL
        fromDatabase:
          name: gtex-postgres
          property: connectionString
      - key: GTE_REDIS_URL
        fromService:
          name: gtex-cache
          type: keyvalue
          property: connectionString
      - key: GTE_KAFKA_BROKERS
        sync: false
      - key: GTE_KAFKA_TOPIC_PREFIX
        value: gtex
      - key: GTE_OUTBOX_RELAY_ENABLED
        value: "false"
      - key: GTE_APP_ENV
        value: production
      - key: GTE_APP_NAME
        value: Global Talent Exchange Projection Workers
      - key: GTE_APP_VERSION
        value: 0.1.0
      - key: GTE_CONFIG_DIR
        value: backend/config

  - type: worker
    name: gtex-rq-worker
    runtime: python
    plan: starter
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: bash -lc "cd backend && python -m app.workers.rq_worker_main"
    autoDeployTrigger: off
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: DATABASE_URL
        fromDatabase:
          name: gtex-postgres
          property: connectionString
      - key: GTE_REDIS_URL
        fromService:
          name: gtex-cache
          type: keyvalue
          property: connectionString
      - key: GTE_APP_ENV
        value: production
      - key: GTE_APP_NAME
        value: Global Talent Exchange RQ Worker
      - key: GTE_APP_VERSION
        value: 0.1.0
      - key: GTE_CONFIG_DIR
        value: backend/config
      - key: GTE_TASK_QUEUE_ENABLED
        value: "true"
      - key: GTE_TASK_QUEUE_NAME
        value: gtex-jobs

  - type: worker
    name: gtex-runtime-workers
    runtime: python
    plan: starter
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: bash -lc "cd backend && python -m app.gtex.worker_main"
    autoDeployTrigger: off
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: DATABASE_URL
        fromDatabase:
          name: gtex-postgres
          property: connectionString
      - key: GTE_REDIS_URL
        fromService:
          name: gtex-cache
          type: keyvalue
          property: connectionString
      - key: GTE_APP_ENV
        value: production
      - key: GTE_APP_NAME
        value: Global Talent Exchange Runtime Workers
      - key: GTE_APP_VERSION
        value: 0.1.0
      - key: GTE_CONFIG_DIR
        value: backend/config
      - key: GTE_GTEX_WORKERS
        value: valuation,matchmaker,brain,jackpot

  - type: web
    name: gtex-web
    runtime: static
    plan: starter
    buildCommand: bash ops/render/build-frontend.sh
    staticPublishPath: frontend/build/web
    autoDeployTrigger: off
    buildFilter:
      paths:
        - frontend/**
        - ops/render/**
        - render.yaml
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Set this to the backend service's public https URL during Blueprint
      # creation, for example https://gtex-api.onrender.com
      - key: GTE_API_BASE_URL
        sync: false
      - key: GTE_BACKEND_MODE
        value: live

  - type: keyvalue
    name: gtex-cache
    plan: starter
    ipAllowList: []

databases:
  - name: gtex-postgres
    plan: basic-256mb
    ipAllowList: []
