services:
  # 🌐 API
  - name: gtex-api
    type: web
    runtime: python
    plan: standard
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && gunicorn app.asgi:app --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --workers 1 --timeout 180 --graceful-timeout 120"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gtex-postgres
          property: connectionString
      - key: GTE_REDIS_URL
        fromService:
          type: redis
          name: gtex-cache
          property: connectionString
      - key: GTE_APP_ENV
        value: production
      - key: GTE_OUTBOX_RELAY_ENABLED
        value: "true"
      - key: GTE_TASK_QUEUE_ENABLED
        value: "true"

  # 🎨 Web
  - name: gtex-web
    type: web
    runtime: static
    plan: standard
    buildCommand: "cd frontend && flutter build web"
    staticPublishPath: "frontend/build/web"

  # ⚙️ RQ Worker
  - name: gtex-rq-worker
    type: worker
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && python -m app.workers.rq_worker_main"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gtex-postgres
          property: connectionString
      - key: GTE_REDIS_URL
        fromService:
          type: redis
          name: gtex-cache
          property: connectionString
      - key: GTE_TASK_QUEUE_ENABLED
        value: "true"

  # 🎮 Simulation Worker
  - name: gtex-simulation-worker
    type: worker
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && python -m app.backbone.simulation_worker_main"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gtex-postgres
          property: connectionString
      - key: GTE_REDIS_URL
        fromService:
          type: redis
          name: gtex-cache
          property: connectionString
      - key: GTE_OUTBOX_RELAY_ENABLED
        value: "true"

  # 📡 Outbox Relay
  - name: gtex-outbox-relay
    type: worker
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && python -m app.backbone.outbox_relay_main"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gtex-postgres
          property: connectionString
      - key: GTE_REDIS_URL
        fromService:
          type: redis
          name: gtex-cache
          property: connectionString
      - key: GTE_OUTBOX_RELAY_ENABLED
        value: "true"

  # 🔴 Redis
  - type: redis
    name: gtex-cache
    plan: starter
    ipAllowList: []

databases:
  - name: gtex-postgres
    plan: basic-256mb
    ipAllowList: []
