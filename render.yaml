services:
  - name: gtex-cache
    type: keyvalue
    region: frankfurt
    plan: starter
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot
    ipAllowList: []

  - name: gtex-api
    type: web
    runtime: python
    region: frankfurt
    plan: starter
    buildCommand: "pip install -r backend/requirements.txt"
    preDeployCommand: "bash ops/render/production-preflight.sh && cd backend && alembic -c migrations/alembic.ini upgrade head"
    startCommand: "cd backend && gunicorn app.asgi:app --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --workers ${WEB_CONCURRENCY:-1} --timeout 180 --graceful-timeout 120"
    envVars:
      - key: WEB_CONCURRENCY
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_ENABLED
        value: "true"
      - key: GTE_REDIS_URL
        fromService:
          type: keyvalue
          name: gtex-cache
          property: connectionString
      - key: GTE_APP_ENV
        value: production
      - key: GTE_RUN_MIGRATION_CHECK
        value: "true"
      - key: GTE_INGESTION_PROVIDER
        value: sportmonks
      - key: GTE_CORS_ALLOW_ORIGINS
        value: https://gtex-web-tw6c.onrender.com
      - key: GTE_CORS_ALLOW_ORIGIN_REGEX
        value: ""
      - key: GTE_TRUSTED_PROXY_HOPS
        value: "1"
      - key: GTE_AUTH_SECRET
        sync: false
      - key: GTE_MEDIA_SIGNING_SECRET
        sync: false
      - key: GTE_KORAPAY_PUBLIC_KEY
        sync: false
      - key: GTE_KORAPAY_SECRET_KEY
        sync: false
      - key: GTE_KORAPAY_ENCRYPTION_KEY
        sync: false
      - key: GTE_KORAPAY_WEBHOOK_SECRET
        sync: false
      - key: GTE_KORAPAY_NOTIFICATION_URL
        value: https://gtex-api-opea.onrender.com/integrations/payments/korapay/webhook
      - key: GTE_ENABLE_PAYSTACK
        value: "true"
      - key: GTE_PAYSTACK_SECRET_KEY
        sync: false
      - key: GTE_PAYSTACK_WEBHOOK_SECRET
        sync: false
      - key: GTE_PAYSTACK_CALLBACK_URL
        sync: false
      - key: TREASURY_BANK_NAME
        sync: false
      - key: TREASURY_ACCOUNT_NAME
        sync: false
      - key: TREASURY_ACCOUNT_NUMBER
        sync: false
      - key: GTE_OUTBOX_RELAY_ENABLED
        value: "false"
      - key: GTE_TASK_QUEUE_ENABLED
        value: "true"
      - key: GTE_MARKET_RECORDS_CACHE_TTL_SECONDS
        value: "300"
      - key: GTE_KAFKA_BROKERS
        value: ""

  - name: gtex-web
    type: web
    runtime: static
    buildCommand: "bash ops/render/build-frontend.sh"
    staticPublishPath: "frontend/build/web"
    envVars:
      - key: GTE_API_BASE_URL
        value: https://gtex-api-opea.onrender.com
      - key: GTE_BACKEND_MODE
        value: live

  - name: gtex-rq-worker
    type: worker
    runtime: python
    region: frankfurt
    plan: starter
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && python -m app.workers.rq_worker_main"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_ENABLED
        value: "true"
      - key: GTE_REDIS_URL
        fromService:
          type: keyvalue
          name: gtex-cache
          property: connectionString
      - key: GTE_APP_ENV
        value: production
      - key: GTE_AUTH_SECRET
        sync: false
      - key: GTE_MEDIA_SIGNING_SECRET
        sync: false
      - key: GTE_RUN_MIGRATION_CHECK
        value: "true"
      - key: GTE_INGESTION_PROVIDER
        value: sportmonks
      - key: GTE_OUTBOX_RELAY_ENABLED
        value: "false"
      - key: GTE_TASK_QUEUE_ENABLED
        value: "true"

  - name: gtex-simulation-worker
    type: worker
    runtime: python
    region: frankfurt
    plan: starter
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && python -m app.backbone.simulation_worker_main"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_ENABLED
        value: "true"
      - key: GTE_REDIS_URL
        fromService:
          type: keyvalue
          name: gtex-cache
          property: connectionString
      - key: GTE_APP_ENV
        value: production
      - key: GTE_AUTH_SECRET
        sync: false
      - key: GTE_MEDIA_SIGNING_SECRET
        sync: false
      - key: GTE_RUN_MIGRATION_CHECK
        value: "true"
      - key: GTE_INGESTION_PROVIDER
        value: sportmonks
      - key: GTE_OUTBOX_RELAY_ENABLED
        value: "false"

  - name: gtex-outbox-relay
    type: worker
    runtime: python
    region: frankfurt
    plan: starter
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && python -m app.backbone.outbox_relay_main"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_ENABLED
        value: "true"
      - key: GTE_REDIS_URL
        fromService:
          type: keyvalue
          name: gtex-cache
          property: connectionString
      - key: GTE_APP_ENV
        value: production
      - key: GTE_AUTH_SECRET
        sync: false
      - key: GTE_MEDIA_SIGNING_SECRET
        sync: false
      - key: GTE_RUN_MIGRATION_CHECK
        value: "true"
      - key: GTE_INGESTION_PROVIDER
        value: sportmonks
      - key: GTE_OUTBOX_RELAY_ENABLED
        value: "true"

  - name: gtex-player-ingestion-worker
    type: worker
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: "cd services/player-ingestion && npm ci"
    startCommand: "cd services/player-ingestion && npm run migrate && npm start"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_ENABLED
        value: "true"
      - key: GTE_REDIS_URL
        fromService:
          type: keyvalue
          name: gtex-cache
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: SPORTMONKS_BASE_URL
        value: https://api.sportmonks.com/v3/football
      - key: SPORTMONKS_API_TOKEN
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: AUDIO_COMMENTARY_ENABLED
        value: "false"
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: CLOUDINARY_PLAYER_FOLDER
        value: gtex/players
      - key: WIKIMEDIA_FALLBACK_ENABLED
        value: "true"
      - key: WIKIMEDIA_RIGHTS_CLEARED_DEFAULT
        value: "false"
      - key: GTEX_REGENS_PER_LEAGUE
        value: "3"
      - key: INGESTION_CRON
        value: "0 */6 * * *"
      - key: INGESTION_RUN_ON_START
        value: "true"
      - key: INGESTION_WORKER_CONCURRENCY
        value: "4"
      - key: INGESTION_LOCK_KEY
        value: ingestion_lock
      - key: INGESTION_LOCK_TTL_SECONDS
        value: "3600"
      - key: INGESTION_RUN_TIMEOUT_SECONDS
        value: "3300"
      - key: HEALTH_SERVER_ENABLED
        value: "true"
      - key: HEALTH_PORT
        value: "3000"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=512"
      - key: SENTRY_DSN
        sync: false
      - key: SEASON_ENGINE_ENABLED
        value: "false"
      - key: SEASON_CRON
        value: "15 0 * * *"
      - key: SEASON_FIXTURES_PER_DAY
        value: "1"
      - key: SEASON_REGENS_PER_SEASON
        value: "12"
      - key: SEASON_TRANSFERS_ENABLED
        value: "false"
      - key: SEASON_TRANSFER_LIMIT_PER_TICK
        value: "1"
      - key: SEASON_TRANSFER_WINDOWS
        value: "2026-01-01:2026-01-31,2026-08-01:2026-08-31"

  - name: gtex-realplayer-ingest
    type: cron
    runtime: python
    region: frankfurt
    plan: starter
    schedule: "0 3 * * *"
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "bash ops/render/run-realplayer-ingest.sh"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SPORTMONKS_API_TOKEN
        sync: false
      - key: SPORTMONKS_BASE_URL
        value: https://api.sportmonks.com/v3/football
      - key: GTE_APP_ENV
        value: production
      - key: GTE_INGESTION_PROVIDER
        value: sportmonks
      - key: GTE_AUTH_SECRET
        sync: false
      - key: GTE_MEDIA_SIGNING_SECRET
        sync: false

  - name: gtex-sofifa-import
    type: cron
    runtime: python
    region: frankfurt
    plan: starter
    schedule: "0 6 1 * *"
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "bash ops/render/run-sofifa-import.sh"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CSV_URL
        sync: false
      - key: IMAGES
        value: "cloudinary"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GTE_APP_ENV
        value: production
      - key: GTE_AUTH_SECRET
        sync: false
      - key: GTE_MEDIA_SIGNING_SECRET
        sync: false

  - name: gtex-appreciation-reprice
    type: cron
    runtime: python
    region: frankfurt
    plan: starter
    schedule: "0 2 * * 1"
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "bash ops/render/run-reprice-appreciation.sh"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GTE_APP_ENV
        value: production
      - key: GTE_AUTH_SECRET
        sync: false
      - key: GTE_MEDIA_SIGNING_SECRET
        sync: false

  - name: gtex-regen-rebuild
    type: cron
    runtime: python
    region: frankfurt
    plan: starter
    schedule: "0 4 1 * *"
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "bash ops/render/run-regen-rebuild.sh"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REGEN_TARGET
        value: "12000"
      - key: GTE_APP_ENV
        value: production
      - key: GTE_AUTH_SECRET
        sync: false
      - key: GTE_MEDIA_SIGNING_SECRET
        sync: false

  - name: gtex-squad-tier-backfill
    type: cron
    runtime: python
    region: frankfurt
    plan: starter
    schedule: "0 5 1 * *"
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "bash ops/render/run-squad-tier-backfill.sh"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GTE_APP_ENV
        value: production
      - key: GTE_AUTH_SECRET
        sync: false
      - key: GTE_MEDIA_SIGNING_SECRET
        sync: false
