services:
  # 🌐 API
  - name: gtex-api
    type: web
    runtime: python
    plan: starter
    buildCommand: "pip install -r backend/requirements.txt"
    preDeployCommand: "cd backend && alembic -c migrations/alembic.ini upgrade head"
    startCommand: "cd backend && gunicorn app.asgi:app --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gtex-postgres
          property: connectionString
      - key: GTE_REDIS_URL
        fromService:
          type: redis
          name: gtex-cache
          property: connectionString
      - key: GTE_APP_ENV
        value: production
      - key: GTE_RUN_MIGRATION_CHECK
        value: "false"
      - key: GTE_AUTH_SECRET
        generateValue: true
      - key: GTE_MEDIA_SIGNING_SECRET
        generateValue: true
      - key: GTE_OUTBOX_RELAY_ENABLED
        value: "false"
      - key: GTE_TASK_QUEUE_ENABLED
        value: "true"

  # 🎨 Web
  - name: gtex-web
    type: web
    runtime: static
    buildCommand: "bash ops/render/build-frontend.sh"
    staticPublishPath: "frontend/build/web"
    envVars:
      - key: GTE_API_BASE_URL
        value: https://gtex-api.onrender.com
      - key: GTE_BACKEND_MODE
        value: live

  # ⚙️ RQ Worker
  - name: gtex-rq-worker
    type: worker
    runtime: python
    plan: starter
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && python -m app.workers.rq_worker_main"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gtex-postgres
          property: connectionString
      - key: GTE_REDIS_URL
        fromService:
          type: redis
          name: gtex-cache
          property: connectionString
      - key: GTE_APP_ENV
        value: production
      - key: GTE_AUTH_SECRET
        fromService:
          type: web
          name: gtex-api
          envVarKey: GTE_AUTH_SECRET
      - key: GTE_MEDIA_SIGNING_SECRET
        fromService:
          type: web
          name: gtex-api
          envVarKey: GTE_MEDIA_SIGNING_SECRET
      - key: GTE_RUN_MIGRATION_CHECK
        value: "false"
      - key: GTE_OUTBOX_RELAY_ENABLED
        value: "false"
      - key: GTE_TASK_QUEUE_ENABLED
        value: "true"

  # 🎮 Simulation Worker
  - name: gtex-simulation-worker
    type: worker
    runtime: python
    plan: starter
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && python -m app.backbone.simulation_worker_main"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gtex-postgres
          property: connectionString
      - key: GTE_REDIS_URL
        fromService:
          type: redis
          name: gtex-cache
          property: connectionString
      - key: GTE_APP_ENV
        value: production
      - key: GTE_AUTH_SECRET
        fromService:
          type: web
          name: gtex-api
          envVarKey: GTE_AUTH_SECRET
      - key: GTE_MEDIA_SIGNING_SECRET
        fromService:
          type: web
          name: gtex-api
          envVarKey: GTE_MEDIA_SIGNING_SECRET
      - key: GTE_RUN_MIGRATION_CHECK
        value: "false"
      - key: GTE_OUTBOX_RELAY_ENABLED
        value: "false"

  # 📡 Outbox Relay
  - name: gtex-outbox-relay
    type: worker
    runtime: python
    plan: starter
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && python -m app.backbone.outbox_relay_main"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gtex-postgres
          property: connectionString
      - key: GTE_REDIS_URL
        fromService:
          type: redis
          name: gtex-cache
          property: connectionString
      - key: GTE_APP_ENV
        value: production
      - key: GTE_AUTH_SECRET
        fromService:
          type: web
          name: gtex-api
          envVarKey: GTE_AUTH_SECRET
      - key: GTE_MEDIA_SIGNING_SECRET
        fromService:
          type: web
          name: gtex-api
          envVarKey: GTE_MEDIA_SIGNING_SECRET
      - key: GTE_RUN_MIGRATION_CHECK
        value: "false"
      - key: GTE_OUTBOX_RELAY_ENABLED
        value: "true"

  # 🔴 Redis
  - type: redis
    name: gtex-cache
    plan: starter
    ipAllowList: []

databases:
  - name: gtex-postgres
    plan: basic-256mb
    ipAllowList: []
