services:
  # 🌐 API
  - name: gtex-api
    type: web
    runtime: python
    region: frankfurt
    plan: standard
    buildCommand: "pip install -r backend/requirements.txt"
    preDeployCommand: "bash ops/render/production-preflight.sh && cd backend && alembic -c migrations/alembic.ini upgrade head"
    startCommand: "cd backend && gunicorn app.asgi:app --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --workers ${WEB_CONCURRENCY:-2} --timeout 180 --graceful-timeout 120"
    envVars:
      - key: WEB_CONCURRENCY
        value: "4"
      - key: DATABASE_URL
        fromDatabase:
          name: gtex-postgres
          property: connectionString
      - key: GTE_REDIS_URL
        fromService:
          type: redis
          name: gtex-cache
          property: connectionString
      - key: GTE_APP_ENV
        value: production
      - key: GTE_RUN_MIGRATION_CHECK
        value: "true"
      - key: GTE_INGESTION_PROVIDER
        value: sportmonks
      - key: GTE_CORS_ALLOW_ORIGIN_REGEX
        value: ""
      - key: GTE_AUTH_SECRET
        sync: false
      - key: GTE_MEDIA_SIGNING_SECRET
        sync: false
      - key: GTE_KORAPAY_PUBLIC_KEY
        sync: false
      - key: GTE_KORAPAY_SECRET_KEY
        sync: false
      - key: GTE_KORAPAY_ENCRYPTION_KEY
        sync: false
      - key: GTE_KORAPAY_WEBHOOK_SECRET
        sync: false
      - key: GTE_KORAPAY_NOTIFICATION_URL
        value: https://gtex-api.onrender.com/api/webhooks/korapay
      - key: GTE_ENABLE_PAYSTACK
        value: "false"
      - key: TREASURY_BANK_NAME
        sync: false
      - key: TREASURY_ACCOUNT_NAME
        sync: false
      - key: TREASURY_ACCOUNT_NUMBER
        sync: false
      - key: GTE_OUTBOX_RELAY_ENABLED
        value: "false"
      - key: GTE_TASK_QUEUE_ENABLED
        value: "true"

  # 🎨 Web
  - name: gtex-web
    type: web
    runtime: static
    buildCommand: "bash ops/render/build-frontend.sh"
    staticPublishPath: "frontend/build/web"
    envVars:
      - key: GTE_API_BASE_URL
        value: https://gtex-api.onrender.com
      - key: GTE_BACKEND_MODE
        value: live

  # ⚙️ RQ Worker
  - name: gtex-rq-worker
    type: worker
    runtime: python
    region: frankfurt
    plan: standard
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && python -m app.workers.rq_worker_main"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gtex-postgres
          property: connectionString
      - key: GTE_REDIS_URL
        fromService:
          type: redis
          name: gtex-cache
          property: connectionString
      - key: GTE_APP_ENV
        value: production
      - key: GTE_AUTH_SECRET
        fromService:
          type: web
          name: gtex-api
          envVarKey: GTE_AUTH_SECRET
      - key: GTE_MEDIA_SIGNING_SECRET
        fromService:
          type: web
          name: gtex-api
          envVarKey: GTE_MEDIA_SIGNING_SECRET
      - key: GTE_RUN_MIGRATION_CHECK
        value: "true"
      - key: GTE_INGESTION_PROVIDER
        value: sportmonks
      - key: GTE_OUTBOX_RELAY_ENABLED
        value: "false"
      - key: GTE_TASK_QUEUE_ENABLED
        value: "true"

  # 🎮 Simulation Worker
  - name: gtex-simulation-worker
    type: worker
    runtime: python
    region: frankfurt
    plan: standard
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && python -m app.backbone.simulation_worker_main"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gtex-postgres
          property: connectionString
      - key: GTE_REDIS_URL
        fromService:
          type: redis
          name: gtex-cache
          property: connectionString
      - key: GTE_APP_ENV
        value: production
      - key: GTE_AUTH_SECRET
        fromService:
          type: web
          name: gtex-api
          envVarKey: GTE_AUTH_SECRET
      - key: GTE_MEDIA_SIGNING_SECRET
        fromService:
          type: web
          name: gtex-api
          envVarKey: GTE_MEDIA_SIGNING_SECRET
      - key: GTE_RUN_MIGRATION_CHECK
        value: "true"
      - key: GTE_INGESTION_PROVIDER
        value: sportmonks
      - key: GTE_OUTBOX_RELAY_ENABLED
        value: "false"

  # 📡 Outbox Relay
  - name: gtex-outbox-relay
    type: worker
    runtime: python
    region: frankfurt
    plan: standard
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && python -m app.backbone.outbox_relay_main"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gtex-postgres
          property: connectionString
      - key: GTE_REDIS_URL
        fromService:
          type: redis
          name: gtex-cache
          property: connectionString
      - key: GTE_APP_ENV
        value: production
      - key: GTE_AUTH_SECRET
        fromService:
          type: web
          name: gtex-api
          envVarKey: GTE_AUTH_SECRET
      - key: GTE_MEDIA_SIGNING_SECRET
        fromService:
          type: web
          name: gtex-api
          envVarKey: GTE_MEDIA_SIGNING_SECRET
      - key: GTE_RUN_MIGRATION_CHECK
        value: "true"
      - key: GTE_INGESTION_PROVIDER
        value: sportmonks
      - key: GTE_OUTBOX_RELAY_ENABLED
        value: "true"

  # Player Ingestion Worker
  - name: gtex-player-ingestion-worker
    type: worker
    runtime: node
    region: frankfurt
    plan: standard
    buildCommand: "cd services/player-ingestion && npm ci"
    startCommand: "cd services/player-ingestion && npm run migrate && npm start"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gtex-postgres
          property: connectionString
      - key: GTE_REDIS_URL
        fromService:
          type: redis
          name: gtex-cache
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: SPORTMONKS_BASE_URL
        value: https://api.sportmonks.com/v3/football
      - key: SPORTMONKS_API_TOKEN
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: AUDIO_COMMENTARY_ENABLED
        value: "false"
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: CLOUDINARY_PLAYER_FOLDER
        value: gtex/players
      - key: WIKIMEDIA_FALLBACK_ENABLED
        value: "true"
      - key: WIKIMEDIA_RIGHTS_CLEARED_DEFAULT
        value: "false"
      - key: GTEX_REGENS_PER_LEAGUE
        value: "3"
      - key: INGESTION_CRON
        value: "0 */6 * * *"
      - key: INGESTION_RUN_ON_START
        value: "true"
      - key: INGESTION_WORKER_CONCURRENCY
        value: "4"
      - key: INGESTION_LOCK_KEY
        value: ingestion_lock
      - key: INGESTION_LOCK_TTL_SECONDS
        value: "3600"
      - key: INGESTION_RUN_TIMEOUT_SECONDS
        value: "3300"
      - key: HEALTH_SERVER_ENABLED
        value: "true"
      - key: HEALTH_PORT
        value: "3000"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=512"
      - key: SENTRY_DSN
        sync: false
      - key: SEASON_ENGINE_ENABLED
        value: "false"
      - key: SEASON_CRON
        value: "15 0 * * *"
      - key: SEASON_FIXTURES_PER_DAY
        value: "1"
      - key: SEASON_REGENS_PER_SEASON
        value: "12"
      - key: SEASON_TRANSFERS_ENABLED
        value: "false"
      - key: SEASON_TRANSFER_LIMIT_PER_TICK
        value: "1"
      - key: SEASON_TRANSFER_WINDOWS
        value: "2026-01-01:2026-01-31,2026-08-01:2026-08-31"

  # 🔴 Redis
  - type: keyvalue
    name: gtex-cache
    region: frankfurt
    plan: standard
    ipAllowList: []

databases:
  - name: gtex-postgres
    region: frankfurt
    plan: basic-1gb
    ipAllowList: []
