name: tmp fix Render production contract

on:
  push:
    branches:
      - phase/b-engine-integration

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fix canonical production Render endpoints
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("render.yaml")
          text = p.read_text(encoding="utf-8")
          text = text.replace(
              "GTE_KORAPAY_NOTIFICATION_URL\n        value: https://gtex-api-opea.onrender.com/api/webhooks/korapay",
              "GTE_KORAPAY_NOTIFICATION_URL\n        value: https://gtex-api-opea.onrender.com/integrations/payments/korapay/webhook",
          )
          text = text.replace(
              "      - key: GTE_API_BASE_URL\n        value: https://gtex-api-cijn.onrender.com",
              "      - key: GTE_API_BASE_URL\n        value: https://gtex-api-opea.onrender.com",
          )
          p.write_text(text, encoding="utf-8")
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/tmp-fix-render-contract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add render.yaml .github/workflows/tmp-fix-render-contract.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: align Render production endpoints"
          git push origin HEAD:phase/b-engine-integration
