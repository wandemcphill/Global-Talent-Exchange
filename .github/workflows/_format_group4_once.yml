name: Format Group 4 Once

on:
  push:
    branches:
      - phase/group-4-match-engine-competition-economy

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'chore: format Group 4 Python files'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install black
      - run: |
          python -m black \
            backend/scripts/audit_admin_control_plane_release.py \
            backend/scripts/audit_match_engine_competition_economy_release.py \
            backend/tests/economy/test_match_economy_engine.py \
            backend/tests/economy/test_match_engine_competition_economy_contract.py \
            backend/tests/match_engine/test_match_engine_competition_economy_release_audit.py
      - name: Commit formatted files
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/scripts/audit_admin_control_plane_release.py backend/scripts/audit_match_engine_competition_economy_release.py backend/tests/economy/test_match_economy_engine.py backend/tests/economy/test_match_engine_competition_economy_contract.py backend/tests/match_engine/test_match_engine_competition_economy_release_audit.py
          git commit -m "chore: format Group 4 Python files"
          git push
