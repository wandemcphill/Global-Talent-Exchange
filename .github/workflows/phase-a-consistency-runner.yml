name: Phase A Consistency Runner

on:
  push:
    branches:
      - fix/phase-a-economic-consistency

permissions:
  contents: write

jobs:
  repair:
    if: contains(github.event.head_commit.message, '[phase-a-consistency-runner]') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/phase-a-economic-consistency
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply economic consistency repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path.cwd()

          def edit(path: str, fn):
              p = root / path
              s = p.read_text(encoding='utf-8')
              n = fn(s)
              if n == s:
                  raise SystemExit(f'No change made to {path}')
              p.write_text(n, encoding='utf-8')

          def replace_exact(path: str, old: str, new: str):
              def fn(s):
                  count = s.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly 1 match, found {count}')
                  return s.replace(old, new, 1)
              edit(path, fn)

          # Admin seed must match the constitutional 30% competition fee.
          replace_exact('backend/app/admin_engine/service.py', '"competition_platform_fee_bps": 1000,', '"competition_platform_fee_bps": 3000,')

          # Central policy resolver must be the only economic fee authority.
          policy = '''from __future__ import annotations

          from dataclasses import dataclass
          from datetime import datetime
          from decimal import Decimal
          import hashlib
          import json

          from sqlalchemy import select
          from sqlalchemy.orm import Session

          from app.models.admin_rules import AdminRewardRule


          class EconomicPolicyUnavailableError(RuntimeError):
              """Raised when the platform has no unambiguous active economic policy."""


          @dataclass(frozen=True, slots=True)
          class EconomicPolicy:
              rule: AdminRewardRule
              policy_version: str
              effective_at: datetime

              @property
              def trading_fee_bps(self) -> int:
                  return int(self.rule.trading_fee_bps)

              @property
              def gift_platform_rake_bps(self) -> int:
                  return int(self.rule.gift_platform_rake_bps)

              @property
              def withdrawal_fee_bps(self) -> int:
                  return int(self.rule.withdrawal_fee_bps)

              @property
              def minimum_withdrawal_fee_credits(self) -> Decimal:
                  return Decimal(str(self.rule.minimum_withdrawal_fee_credits))

              @property
              def competition_platform_fee_bps(self) -> int:
                  return int(self.rule.competition_platform_fee_bps)


          @dataclass(frozen=True, slots=True)
          class EconomicGiftSplit:
              gross_amount: Decimal
              platform_amount: Decimal
              recipient_amount: Decimal
              creator_amount: Decimal
              burn_amount: Decimal
              rule_key: str
              policy_version: str


          def resolve_economic_policy(session: Session) -> EconomicPolicy:
              rows = list(
                  session.scalars(
                      select(AdminRewardRule)
                      .where(AdminRewardRule.active.is_(True))
                      .order_by(AdminRewardRule.updated_at.desc(), AdminRewardRule.id.asc())
                  ).all()
              )
              if not rows:
                  raise EconomicPolicyUnavailableError("No active Admin economic policy exists.")
              if len(rows) != 1:
                  raise EconomicPolicyUnavailableError("Exactly one active Admin economic policy is required.")
              rule = rows[0]
              effective_at = rule.updated_at
              if effective_at is None:
                  raise EconomicPolicyUnavailableError("Active Admin economic policy has no effective timestamp.")
              payload = {
                  "rule_key": rule.rule_key,
                  "trading_fee_bps": int(rule.trading_fee_bps),
                  "gift_platform_rake_bps": int(rule.gift_platform_rake_bps),
                  "withdrawal_fee_bps": int(rule.withdrawal_fee_bps),
                  "minimum_withdrawal_fee_credits": str(Decimal(str(rule.minimum_withdrawal_fee_credits))),
                  "competition_platform_fee_bps": int(rule.competition_platform_fee_bps),
                  "stability_controls_json": rule.stability_controls_json or {},
                  "effective_at": effective_at.isoformat(),
              }
              version = hashlib.sha256(
                  json.dumps(payload, sort_keys=True, separators=(",", ":")).encode("utf-8")
              ).hexdigest()[:16]
              return EconomicPolicy(rule=rule, policy_version=version, effective_at=effective_at)


          def compute_gift_split(session: Session, gross_amount: Decimal) -> EconomicGiftSplit:
              quant = Decimal("0.0001")
              gross = Decimal(str(gross_amount)).quantize(quant)
              if gross <= 0:
                  raise EconomicPolicyUnavailableError("Gift gross amount must be positive.")
              policy = resolve_economic_policy(session)
              bps = policy.gift_platform_rake_bps
              if not 0 <= bps <= 10_000:
                  raise EconomicPolicyUnavailableError("Admin gift rake is outside the valid range.")
              platform_amount = (gross * Decimal(bps) / Decimal(10_000)).quantize(quant)
              burn_amount = Decimal("0.0000")
              try:
                  from app.economy.governor_service import EconomyGovernorService
                  burn_bps = max(0, min(10_000, int(EconomyGovernorService(session).burn_bonus_bps())))
                  burn_amount = (gross * Decimal(burn_bps) / Decimal(10_000)).quantize(quant)
              except Exception:
                  burn_amount = Decimal("0.0000")
              if platform_amount + burn_amount > gross:
                  burn_amount = max(Decimal("0.0000"), gross - platform_amount)
              return EconomicGiftSplit(
                  gross_amount=gross,
                  platform_amount=platform_amount,
                  recipient_amount=(gross - platform_amount - burn_amount).quantize(quant),
                  creator_amount=Decimal("0.0000"),
                  burn_amount=burn_amount,
                  rule_key=policy.rule.rule_key,
                  policy_version=policy.policy_version,
              )


          __all__ = [
              "EconomicGiftSplit",
              "EconomicPolicy",
              "EconomicPolicyUnavailableError",
              "compute_gift_split",
              "resolve_economic_policy",
          ]
          '''
          (root / 'backend/app/economy/economic_policy.py').write_text(policy.lstrip(), encoding='utf-8')

          # Competition orchestration resolves the fee from the active Admin policy.
          def competition(s):
              if 'from app.economy.economic_policy import resolve_economic_policy' not in s:
                  anchor = 'from app.config.competition_constants import USER_COMPETITION_MAX_PLATFORM_FEE_BPS, USER_COMPETITION_MIN_PARTICIPANTS\n'
                  s = s.replace(anchor, 'from app.config.competition_constants import USER_COMPETITION_MIN_PARTICIPANTS\nfrom app.economy.economic_policy import resolve_economic_policy\n', 1)
              old = '''        domain_payload = backend_competition_create_request(
            payload,
            default_platform_fee_pct=self.fee_service.default_platform_fee_pct,
        )
'''
              new = '''        economic_policy = resolve_economic_policy(self.session)
        domain_payload = backend_competition_create_request(
            payload,
            default_platform_fee_pct=Decimal(economic_policy.competition_platform_fee_bps) / Decimal("100"),
        )
'''
              if old not in s:
                  raise SystemExit('competition orchestrator domain payload block not found')
              s = s.replace(old, new, 1)
              s = s.replace('            domain_payload.financials.platform_fee_bps = USER_COMPETITION_MAX_PLATFORM_FEE_BPS\n', '            domain_payload.financials.platform_fee_bps = economic_policy.competition_platform_fee_bps\n', 1)
              s = s.replace('            competition.platform_fee_bps = USER_COMPETITION_MAX_PLATFORM_FEE_BPS\n', '            competition.platform_fee_bps = economic_policy.competition_platform_fee_bps\n', 1)
              marker = '            "special_rules": payload.special_rules,\n'
              inject = '''            "special_rules": payload.special_rules,
            "economic_policy": {
                "rule_key": economic_policy.rule.rule_key,
                "version": economic_policy.policy_version,
                "effective_at": economic_policy.effective_at.isoformat(),
                "competition_platform_fee_bps": economic_policy.competition_platform_fee_bps,
            },
'''
              if marker not in s:
                  raise SystemExit('competition metadata marker not found')
              return s.replace(marker, inject, 1)
          edit('backend/app/services/competition_orchestrator.py', competition)

          # Canonical gifts use the central fee policy and durable post-commit events.
          for path in ['backend/app/gift_engine/canonical_service.py']:
              replace_exact(path, 'from app.economy.service import EconomyConfigService\n', 'from app.economy.service import EconomyConfigService\nfrom app.economy.economic_policy import compute_gift_split\n')
              replace_exact(path, '''        split = EconomyConfigService(self.session).compute_revenue_split(
            scope="gift",
            gross_amount=gross_amount,
            fallback_platform_bps=self._active_gift_rake_bps(),
        )
''', '        split = compute_gift_split(self.session, gross_amount)\n')
              replace_exact(path, 'fee_rule_version="1",', 'fee_rule_version=split.policy_version,')
              replace_exact(path, '        self.event_publisher.publish(event)\n', '        self.wallet_service._stage_domain_event(self.session, event=event, durable=True)\n')

          # Remove the remaining canonical hard-coded 5/min match gift limiter.
          edit('backend/app/gift_engine/canonical_service.py', lambda s: re.sub(
              r'\n        if requested_scope == "gtex_competition" and recipient_user_id:[\s\S]*?\n\n        self\.ensure_football_gift_catalog\(\)',
              '\n        self.ensure_football_gift_catalog()', s, count=1
          ))
          edit('backend/app/gift_engine/canonical_service.py', lambda s: re.sub(
              r'\n        if normalized_scope == "gtex_competition":[\s\S]*?\n        gift = self\.session\.scalar',
              '\n        gift = self.session.scalar', s, count=1
          ))

          # WalletService has no independent fee default: omitted fee resolves centrally.
          wpath = 'backend/app/wallets/service.py'
          edit(wpath, lambda s: s.replace('        withdrawal_fee_bps: int = 1000,\n        minimum_fee: Decimal = Decimal("5.0000"),\n', '        withdrawal_fee_bps: int | None = None,\n        minimum_fee: Decimal | None = None,\n', 1))
          edit(wpath, lambda s: s.replace('''        fee_tag = LedgerSourceTag.WITHDRAWAL_FEE_BURN
        fee_amount = self._normalize_amount(
            max(
                (normalized_amount * Decimal(withdrawal_fee_bps) / Decimal(10_000)), self._normalize_amount(minimum_fee)
            )
        )
''', '''        fee_tag = LedgerSourceTag.WITHDRAWAL_FEE_BURN
        if withdrawal_fee_bps is None or minimum_fee is None:
            from app.economy.economic_policy import resolve_economic_policy
            policy = resolve_economic_policy(session)
            withdrawal_fee_bps = policy.withdrawal_fee_bps if withdrawal_fee_bps is None else withdrawal_fee_bps
            minimum_fee = policy.minimum_withdrawal_fee_credits if minimum_fee is None else minimum_fee
        fee_amount = self._normalize_amount(
            max(
                (normalized_amount * Decimal(withdrawal_fee_bps) / Decimal(10_000)), self._normalize_amount(minimum_fee)
            )
        )
''', 1))
          edit(wpath, lambda s: s.replace('                    "total_debit": str(total_debit),\n', '                    "total_debit": str(total_debit),\n                    "fee_policy_rule_key": (policy.rule.rule_key if "policy" in locals() else None),\n                    "fee_policy_version": (policy.policy_version if "policy" in locals() else None),\n                    "fee_policy_effective_at": (policy.effective_at.isoformat() if "policy" in locals() else None),\n', 1))

          # Migration for stale defaults and ambiguous active policies.
          mig = root / 'backend/migrations/versions/20260827_0114_economic_policy_authority.py'
          mig.write_text('''"""Normalize Phase A economic policy state and collapse ambiguous active policies."""\n\nfrom __future__ import annotations\n\nfrom alembic import op\nimport sqlalchemy as sa\n\nrevision = "20260827_0114_economic_policy_authority"\ndown_revision = "20260827_0113_economic_policy_consistency"\nbranch_labels = None\ndepends_on = None\n\n\ndef upgrade() -> None:\n    connection = op.get_bind()\n    connection.execute(sa.text("UPDATE admin_reward_rules SET competition_platform_fee_bps=3000 WHERE rule_key='platform-economy-defaults' AND competition_platform_fee_bps IN (1000,2000)"))\n    connection.execute(sa.text("UPDATE admin_reward_rules SET active=FALSE WHERE active AND id <> (SELECT id FROM admin_reward_rules WHERE active ORDER BY updated_at DESC, id ASC LIMIT 1)"))\n    connection.execute(sa.text("UPDATE competition_templates SET platform_fee_bps=3000 WHERE platform_fee_bps IN (1000,2000)"))\n\n\ndef downgrade() -> None:\n    pass\n''', encoding='utf-8')

          # Static regression tests for the constitution, without depending on full app bootstrap.
          tpath = root / 'backend/tests/economy/test_phase_a_policy_consistency.py'
          tpath.write_text('''from __future__ import annotations\n\nfrom datetime import datetime, timezone\nfrom decimal import Decimal\n\nimport pytest\nfrom sqlalchemy import create_engine\nfrom sqlalchemy.orm import Session\n\nfrom app.admin_engine.schemas import AdminRewardRuleUpsertRequest\nfrom app.economy.economic_policy import EconomicPolicyUnavailableError, resolve_economic_policy\nfrom app.models.admin_rules import AdminRewardRule\nfrom app.agents.agent_wallet import AgentWallet, AgentWalletService\n\n\ndef _session() -> Session:\n    engine = create_engine("sqlite:///:memory:")\n    AdminRewardRule.__table__.create(engine)\n    return Session(engine)\n\n\ndef test_economic_policy_requires_exactly_one_active_rule() -> None:\n    session = _session()\n    with pytest.raises(EconomicPolicyUnavailableError):\n        resolve_economic_policy(session)\n    session.add(AdminRewardRule(rule_key="one", title="One", active=True))\n    session.flush()\n    policy = resolve_economic_policy(session)\n    assert policy.rule.rule_key == "one"\n    assert len(policy.policy_version) == 16\n    session.add(AdminRewardRule(rule_key="two", title="Two", active=True))\n    session.flush()\n    with pytest.raises(EconomicPolicyUnavailableError):\n        resolve_economic_policy(session)\n\n\ndef test_admin_competition_fee_schema_cannot_exceed_30_percent() -> None:\n    payload = AdminRewardRuleUpsertRequest(rule_key="x", title="X", competition_platform_fee_bps=3000)\n    assert payload.competition_platform_fee_bps == 3000\n    with pytest.raises(Exception):\n        AdminRewardRuleUpsertRequest(rule_key="x", title="X", competition_platform_fee_bps=3001)\n\n\ndef test_compatibility_agent_wallet_cannot_mutate_money() -> None:\n    service = AgentWalletService()\n    wallet = AgentWallet(balance=100.0)\n    with pytest.raises(RuntimeError):\n        service.apply_spend(wallet, 10.0)\n    with pytest.raises(RuntimeError):\n        service.settle(wallet, earnings=10.0, quality_score=1.0, trust_score=1.0, repetition_ratio=0.0)\n''', encoding='utf-8')

          print('Phase A economic consistency repairs applied')
          PY
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt pytest
      - name: Compile backend
        run: python -m compileall -q backend/app backend/tests
      - name: Run targeted Phase A regressions
        working-directory: backend
        run: pytest -q tests/economy/test_phase_a_policy_consistency.py tests/economy tests/gift_engine tests/wallets tests/agents
      - name: Remove runner and commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/phase-a-consistency-runner.yml
          git rm -f backend/scripts/apply_phase_a_consistency_fix.py 2>/dev/null || true
          git rm -f .phase-a-trigger 2>/dev/null || true
          git add backend docs
          git commit -m "fix(economy): close Phase A economic consistency gaps [phase-a-consistency-runner]"
          git push origin fix/phase-a-economic-consistency
