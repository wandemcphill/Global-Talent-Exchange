name: GTEX React web (Cloudflare Pages, playgtex.app)

on:
  pull_request:
    paths:
      - "frontend/react-shell/**"
      - "ops/cloudflare/verify-react-root-build.sh"
      - ".github/workflows/react-cloudflare-pages.yml"
  push:
    branches: [main]
    paths:
      - "frontend/react-shell/**"
      - "ops/cloudflare/verify-react-root-build.sh"
      - ".github/workflows/react-cloudflare-pages.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/react-shell
    env:
      NODE_OPTIONS: "--openssl-legacy-provider"
      PUBLIC_URL: ""
      REACT_APP_BACKEND_URL: "https://gtex-api-2gtu.onrender.com"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/react-shell/package-lock.json
      - run: npm ci --legacy-peer-deps --include=dev
      - name: Unit tests
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: "true"
      - name: Build (root domain)
        run: npm run build
        env:
          CI: "false"
      - name: Verify root-domain build and SPA fallback
        run: bash ../../ops/cloudflare/verify-react-root-build.sh build
