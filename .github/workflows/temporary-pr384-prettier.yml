name: Temporary PR 384 Prettier formatter

on:
  push:
    branches:
      - gemini/unit-2a-milestone-2-arena-gameplay-readiness

permissions:
  contents: read

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Format using repository Prettier
        run: |
          npx --yes prettier --version
          npx --yes prettier --write frontend/react-shell/scripts/build_humanoid_footballer_glb.mjs
          npx --yes prettier --check frontend/react-shell/scripts/build_humanoid_footballer_glb.mjs
          echo "----- BEGIN FORMATTED SCRIPT -----"
          cat frontend/react-shell/scripts/build_humanoid_footballer_glb.mjs
          echo "----- END FORMATTED SCRIPT -----"
