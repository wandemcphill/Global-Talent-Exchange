name: tmp Phase A format repair

on:
  push:
    branches:
      - phase/a-economic-foundation

permissions:
  contents: write

jobs:
  format-repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install black
      - run: python -m black backend/app/models/wallet.py backend/tests/economy/test_phase_a_hosted_competition_db_roundtrip.py
      - name: Commit formatting repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No formatting changes needed"
            exit 0
          fi
          git add backend/app/models/wallet.py backend/tests/economy/test_phase_a_hosted_competition_db_roundtrip.py
          git commit -m "chore: format phase A economic files"
          git push
