name: Phase A temporary Black repair

on:
  push:
    branches:
      - fix/phase-a-final-economic-safety

permissions:
  contents: write

jobs:
  black:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Black
        run: python -m pip install --disable-pip-version-check black==26.5.1
      - name: Format Phase A files
        run: |
          python -m black \
            backend/app/admin_engine/service.py \
            backend/app/economy/conversion_service.py \
            backend/app/gift_engine/canonical_service.py \
            backend/app/treasury/schemas.py \
            backend/app/wallets/service.py \
            backend/migrations/versions/20260828_0116_economic_policy_collapse_hardening.py \
            backend/scripts/audit_player_share_release_gate.py \
            backend/tests/admin_engine/test_admin_reward_rule_single_active.py \
            backend/tests/economy/test_gift_conversion_bridge_reconciliation.py \
            backend/tests/economy/test_economy_service.py \
            backend/tests/gift_engine/test_fan_coin_to_gtex_coin_conversion.py \
            backend/tests/wallets/test_wallet_payments_treasury_release_gate.py
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "Black made no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/app/admin_engine/service.py \
            backend/app/economy/conversion_service.py \
            backend/app/gift_engine/canonical_service.py \
            backend/app/treasury/schemas.py \
            backend/app/wallets/service.py \
            backend/migrations/versions/20260828_0116_economic_policy_collapse_hardening.py \
            backend/scripts/audit_player_share_release_gate.py \
            backend/tests/admin_engine/test_admin_reward_rule_single_active.py \
            backend/tests/economy/test_gift_conversion_bridge_reconciliation.py \
            backend/tests/economy/test_economy_service.py \
            backend/tests/gift_engine/test_fan_coin_to_gtex_coin_conversion.py \
            backend/tests/wallets/test_wallet_payments_treasury_release_gate.py
          git commit -m "style: format Phase A economic files with Black"
          git push
