name: Phase A Economic Consistency Fix

on:
  push:
    branches:
      - fix/phase-a-economic-consistency

permissions:
  contents: write

jobs:
  apply-fix:
    if: contains(github.event.head_commit.message, '[phase-a-economic-fix]') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/phase-a-economic-consistency
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply consistency sweep
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path.cwd()
          def r(p): return (root/p).read_text()
          def w(p,s): (root/p).write_text(s)
          def repl(p,a,b):
              s=r(p); n=s.count(a)
              if n != 1: raise SystemExit(f'{p}: expected 1 match, got {n}')
              w(p,s.replace(a,b))

          w('backend/app/economy/economic_policy.py', '''from __future__ import annotations\n\nfrom dataclasses import dataclass\nfrom datetime import datetime\nfrom decimal import Decimal\nimport hashlib\nimport json\n\nfrom sqlalchemy import select\nfrom sqlalchemy.orm import Session\n\nfrom app.models.admin_rules import AdminRewardRule\n\n\nclass EconomicPolicyUnavailableError(RuntimeError):\n    pass\n\n\n@dataclass(frozen=True, slots=True)\nclass EconomicPolicy:\n    rule: AdminRewardRule\n    policy_version: str\n    effective_at: datetime\n\n    @property\n    def trading_fee_bps(self) -> int:\n        return int(self.rule.trading_fee_bps)\n\n    @property\n    def gift_platform_rake_bps(self) -> int:\n        return int(self.rule.gift_platform_rake_bps)\n\n    @property\n    def withdrawal_fee_bps(self) -> int:\n        return int(self.rule.withdrawal_fee_bps)\n\n    @property\n    def minimum_withdrawal_fee_credits(self) -> Decimal:\n        return Decimal(str(self.rule.minimum_withdrawal_fee_credits))\n\n    @property\n    def competition_platform_fee_bps(self) -> int:\n        return int(self.rule.competition_platform_fee_bps)\n\n\n@dataclass(frozen=True, slots=True)\nclass EconomicGiftSplit:\n    gross_amount: Decimal\n    platform_amount: Decimal\n    recipient_amount: Decimal\n    creator_amount: Decimal\n    burn_amount: Decimal\n    rule_key: str\n    policy_version: str\n\n\ndef resolve_economic_policy(session: Session) -> EconomicPolicy:\n    rows = list(session.scalars(select(AdminRewardRule).where(AdminRewardRule.active.is_(True)).order_by(AdminRewardRule.updated_at.desc(), AdminRewardRule.id.asc())).all())\n    if not rows:\n        raise EconomicPolicyUnavailableError('No active Admin economic policy exists.')\n    if len(rows) != 1:\n        raise EconomicPolicyUnavailableError('Exactly one active Admin economic policy is required.')\n    rule = rows[0]\n    payload = {\n        'rule_key': rule.rule_key,\n        'trading_fee_bps': int(rule.trading_fee_bps),\n        'gift_platform_rake_bps': int(rule.gift_platform_rake_bps),\n        'withdrawal_fee_bps': int(rule.withdrawal_fee_bps),\n        'minimum_withdrawal_fee_credits': str(Decimal(str(rule.minimum_withdrawal_fee_credits))),\n        'competition_platform_fee_bps': int(rule.competition_platform_fee_bps),\n        'stability_controls_json': rule.stability_controls_json or {},\n        'effective_at': rule.updated_at.isoformat() if rule.updated_at else None,\n    }\n    version = hashlib.sha256(json.dumps(payload, sort_keys=True, separators=(',', ':')).encode()).hexdigest()[:16]\n    return EconomicPolicy(rule=rule, policy_version=version, effective_at=rule.updated_at)\n\n\ndef compute_gift_split(session: Session, gross_amount: Decimal) -> EconomicGiftSplit:\n    q=Decimal('0.0001'); gross=Decimal(str(gross_amount)).quantize(q)\n    if gross <= 0: raise EconomicPolicyUnavailableError('Gift gross amount must be positive.')\n    policy=resolve_economic_policy(session)\n    if not 0 <= policy.gift_platform_rake_bps <= 10000: raise EconomicPolicyUnavailableError('Admin gift rake is outside the valid range.')\n    platform=(gross*Decimal(policy.gift_platform_rake_bps)/Decimal(10000)).quantize(q)\n    burn=Decimal('0.0000')\n    try:\n        from app.economy.governor_service import EconomyGovernorService\n        burn_bps=max(0,min(10000,int(EconomyGovernorService(session).burn_bonus_bps())))\n        burn=(gross*Decimal(burn_bps)/Decimal(10000)).quantize(q)\n    except Exception:\n        burn=Decimal('0.0000')\n    if platform+burn>gross: burn=max(Decimal('0.0000'),gross-platform)\n    return EconomicGiftSplit(gross_amount=gross, platform_amount=platform, recipient_amount=(gross-platform-burn).quantize(q), creator_amount=Decimal('0.0000'), burn_amount=burn, rule_key=policy.rule.rule_key, policy_version=policy.policy_version)\n\n__all__=['EconomicGiftSplit','EconomicPolicy','EconomicPolicyUnavailableError','compute_gift_split','resolve_economic_policy']\n''')

          repl('backend/app/admin_engine/service.py','"competition_platform_fee_bps": 1000,','"competition_platform_fee_bps": 3000,')
          repl('backend/app/admin_engine/service.py','''    def get_active_reward_rule(self) -> AdminRewardRule | None:\n        return next(iter(self.list_reward_rules(active_only=True)), None)\n''','''    def get_active_reward_rule(self) -> AdminRewardRule | None:\n        rows = list(self.session.scalars(select(AdminRewardRule).where(AdminRewardRule.active.is_(True)).order_by(AdminRewardRule.updated_at.desc(), AdminRewardRule.id.asc())).all())\n        if len(rows) > 1:\n            raise ValueError("Exactly one active Admin reward/economic policy is required.")\n        return rows[0] if rows else None\n''')
          repl('backend/app/admin_engine/service.py','''        record.stability_controls_json = self.normalize_stability_controls_payload(payload.stability_controls)\n        record.active = payload.active\n        record.updated_by_user_id = actor.id\n''','''        record.stability_controls_json = self.normalize_stability_controls_payload(payload.stability_controls)\n        record.active = payload.active\n        if payload.active:\n            self.session.query(AdminRewardRule).filter(AdminRewardRule.active.is_(True), AdminRewardRule.id != record.id).update({AdminRewardRule.active: False}, synchronize_session=False)\n        record.updated_by_user_id = actor.id\n''')
          repl('backend/app/admin_engine/schemas.py','competition_platform_fee_bps: int = Field(default=3000, ge=0, le=5000)','competition_platform_fee_bps: int = Field(default=3000, ge=0, le=3000)')

          w('backend/app/treasury/commission_policy.py','''from __future__ import annotations\n\nfrom dataclasses import dataclass\nfrom decimal import Decimal\nfrom sqlalchemy.orm import Session\nfrom app.economy.economic_policy import EconomicPolicyUnavailableError, resolve_economic_policy\n\nclass CommissionPolicyUnavailableError(RuntimeError):\n    pass\n\n@dataclass(frozen=True, slots=True)\nclass CommissionPolicy:\n    withdrawal_fee_bps: int\n    minimum_withdrawal_fee_credits: Decimal\n    policy_rule_key: str\n    policy_version: str\n    effective_at: object\n\ndef resolve_commission_policy(session: Session) -> CommissionPolicy:\n    try: p=resolve_economic_policy(session)\n    except EconomicPolicyUnavailableError as exc: raise CommissionPolicyUnavailableError(str(exc)) from exc\n    return CommissionPolicy(p.withdrawal_fee_bps,p.minimum_withdrawal_fee_credits,p.rule.rule_key,p.policy_version,p.effective_at)\n\n__all__=['CommissionPolicy','CommissionPolicyUnavailableError','resolve_commission_policy']\n''')

          v='backend/app/services/competition_validation_service.py'; s=r(v)
          if 'from app.economy.economic_policy import' not in s: s=s.replace('from app.common.enums.competition_status import CompetitionStatus\n','from app.common.enums.competition_status import CompetitionStatus\nfrom app.economy.economic_policy import EconomicPolicyUnavailableError, resolve_economic_policy\n',1)
          s=s.replace('class CompetitionValidationService:\n    def __init__(self, rules_engine: CompetitionRulesEngine | None = None) -> None:\n        self._rules_engine = rules_engine or CompetitionRulesEngine()\n','class CompetitionValidationService:\n    def __init__(self, rules_engine: CompetitionRulesEngine | None = None, session=None) -> None:\n        self._rules_engine = rules_engine or CompetitionRulesEngine()\n        self._session = session\n\n    def _session_for_policy(self):\n        if self._session is None:\n            raise EconomicPolicyUnavailableError("Economic policy resolution requires a database session.")\n        return self._session\n',1)
          s=s.replace('        errors.extend(self._validate_financial_bounds(payload.financials))\n','        errors.extend(self._validate_financial_bounds(payload.financials))\n        try:\n            policy = resolve_economic_policy(self._session_for_policy())\n            if int(payload.financials.platform_fee_bps) != policy.competition_platform_fee_bps:\n                errors.append(f"competition platform fee must equal the active Admin policy ({policy.competition_platform_fee_bps} bps)")\n        except EconomicPolicyUnavailableError as exc:\n            errors.append(str(exc))\n',1)
          w(v,s)

          c='backend/app/services/competition_creation_service.py'; s=r(c)
          if 'from app.economy.economic_policy import resolve_economic_policy' not in s: s=s.replace('from app.common.enums.competition_format import CompetitionFormat\n','from app.common.enums.competition_format import CompetitionFormat\nfrom app.economy.economic_policy import resolve_economic_policy\n',1)
          s=s.replace('        validation = self._validation_service.validate_creation(payload)\n        competition_id = generate_uuid()\n\n','        validation = self._validation_service.validate_creation(payload)\n        competition_id = generate_uuid()\n        competition_policy = resolve_economic_policy(self._validation_service._session_for_policy())\n\n',1)
          s=s.replace('platform_fee_bps=payload.financials.platform_fee_bps,','platform_fee_bps=competition_policy.competition_platform_fee_bps,',1)
          s=s.replace('            net_prize_pool_minor=validation.fee_summary.net_prize_pool_minor,\n','            net_prize_pool_minor=validation.fee_summary.net_prize_pool_minor,\n            metadata_json={"economic_policy": {"rule_key": competition_policy.rule.rule_key, "version": competition_policy.policy_version, "effective_at": competition_policy.effective_at.isoformat(), "competition_platform_fee_bps": competition_policy.competition_platform_fee_bps}},\n',1)
          w(c,s)

          for p in ['backend/app/gift_engine/canonical_service.py','backend/app/gift_engine/service.py']:
              s=r(p)
              if 'from app.economy.economic_policy import compute_gift_split' not in s:
                  anchor='from app.economy.service import EconomyConfigService\n'
                  if anchor in s: s=s.replace(anchor,anchor+'from app.economy.economic_policy import compute_gift_split\n',1)
                  else: s=s.replace('from app.models.base import generate_uuid, utcnow\n','from app.models.base import generate_uuid, utcnow\nfrom app.economy.economic_policy import compute_gift_split\n',1)
              exact='''        split = EconomyConfigService(self.session).compute_revenue_split(\n            scope="gift",\n            gross_amount=gross_amount,\n            fallback_platform_bps=self._active_gift_rake_bps(),\n        )\n'''
              if exact in s: s=s.replace(exact,'        split = compute_gift_split(self.session, gross_amount)\n',1)
              s=s.replace('        self.event_publisher.publish(event)\n','        self.wallet_service._stage_domain_event(self.session, event=event, durable=True)\n',1)
              w(p,s)
          repl('backend/app/gift_engine/canonical_service.py','fee_rule_version="1",','fee_rule_version=split.policy_version,')

          w('backend/app/wallets/service.py', r('backend/app/wallets/service.py'))
          s=r('backend/app/wallets/service.py')
          s=s.replace('        withdrawal_fee_bps: int = 1000,\n        minimum_fee: Decimal = Decimal("5.0000"),\n','        withdrawal_fee_bps: int | None = None,\n        minimum_fee: Decimal | None = None,\n',1)
          old='''        fee_tag = LedgerSourceTag.WITHDRAWAL_FEE_BURN\n        fee_amount = self._normalize_amount(\n            max(\n                (normalized_amount * Decimal(withdrawal_fee_bps) / Decimal(10_000)), self._normalize_amount(minimum_fee)\n            )\n        )\n'''
          new='''        fee_tag = LedgerSourceTag.WITHDRAWAL_FEE_BURN\n        if withdrawal_fee_bps is None or minimum_fee is None:\n            from app.economy.economic_policy import resolve_economic_policy\n            policy = resolve_economic_policy(session)\n            withdrawal_fee_bps = policy.withdrawal_fee_bps if withdrawal_fee_bps is None else withdrawal_fee_bps\n            minimum_fee = policy.minimum_withdrawal_fee_credits if minimum_fee is None else minimum_fee\n        fee_amount = self._normalize_amount(\n            max(\n                (normalized_amount * Decimal(withdrawal_fee_bps) / Decimal(10_000)), self._normalize_amount(minimum_fee)\n            )\n        )\n'''
          if old not in s: raise SystemExit('wallet fee block not found')
          s=s.replace(old,new,1)
          s=s.replace('                    "total_debit": str(total_debit),\n','                    "total_debit": str(total_debit),\n                    "fee_policy_rule_key": (policy.rule.rule_key if "policy" in locals() else None),\n                    "fee_policy_version": (policy.policy_version if "policy" in locals() else None),\n                    "fee_policy_effective_at": (policy.effective_at.isoformat() if "policy" in locals() else None),\n',1)
          w('backend/app/wallets/service.py',s)

          p='backend/app/agents/agent_wallet.py'; s=r(p); start=s.index('    def apply_spend('); end=s.index('    @staticmethod\n    def _roi',start)
          stub='''    def apply_spend(self, wallet: AgentWallet, amount: float) -> AgentWallet:\n        raise RuntimeError("AgentWallet is a ledger projection only. Use AgentLedgerService for monetary spend.")\n\n    def settle(self, wallet: AgentWallet, *, earnings: float, quality_score: float, trust_score: float, repetition_ratio: float):\n        raise RuntimeError("AgentWallet is a ledger projection only. Use AgentLedgerService for settlement and payout authorization.")\n\n'''
          w(p,s[:start]+stub+s[end:])

          # Remove code-level duplicate match-gift rate checks. Admin spending controls are authoritative.
          for p in ['backend/app/gift_engine/canonical_service.py','backend/app/gift_engine/service.py']:
              s=r(p)
              s=re.sub(r'\n        if requested_scope == "gtex_competition" and recipient_user_id:[\s\S]*?\n\n        self\.ensure_football_gift_catalog\(\)', '\n        self.ensure_football_gift_catalog()', s, count=1)
              s=re.sub(r'\n        if normalized_scope == "gtex_competition":[\s\S]*?\n        gift = self\.session\.scalar', '\n        gift = self.session.scalar', s, count=1)
              w(p,s)

          w('backend/migrations/versions/20260827_0114_economic_policy_authority.py','''"""Normalize the Phase A economic-policy baseline and enforce one active policy row."""\n\nfrom alembic import op\nimport sqlalchemy as sa\n\nrevision = "20260827_0114_economic_policy_authority"\ndown_revision = "20260827_0113_economic_policy_consistency"\nbranch_labels = None\ndepends_on = None\n\ndef upgrade():\n    c=op.get_bind()\n    c.execute(sa.text("UPDATE admin_reward_rules SET competition_platform_fee_bps=3000 WHERE rule_key='platform-economy-defaults' AND competition_platform_fee_bps IN (1000,2000)"))\n    c.execute(sa.text("UPDATE admin_reward_rules SET active=FALSE WHERE active AND id <> (SELECT id FROM admin_reward_rules WHERE active ORDER BY updated_at DESC, id ASC LIMIT 1)"))\n    c.execute(sa.text("UPDATE competition_templates SET platform_fee_bps=3000 WHERE platform_fee_bps IN (1000,2000)"))\n\ndef downgrade():\n    pass\n''')

          h='docs/implementation/PHASE_A_LATEST_HANDOFF_ADDENDUM_20260822.md'; s=r(h)
          if 'centralized AdminRewardRule economic policy authority' not in s:
              s += '\n\n## Phase A consistency sweep 2026-08-27\n\nEconomic fee execution is centralized on the active AdminRewardRule. Competition creation rejects caller-supplied fee drift, gifting and withdrawals resolve the same policy, policy identity is fingerprinted into economic provenance, compatibility AgentWallet mutations fail closed, and gift events use commit-safe durable publication.\n'
          w(h,s)
          print('consistency sweep applied')
          PY
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt pytest
      - name: Compile
        run: python -m compileall -q backend/app backend/tests
      - name: Targeted backend tests
        run: |
          cd backend
          pytest -q tests/economy tests/gift_engine tests/wallets tests/agents
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/phase-a-economic-consistency-fix.yml
          git add backend docs
          git commit -m "fix(economy): close Phase A consistency gaps [phase-a-economic-fix]"
          git push origin fix/phase-a-economic-consistency
