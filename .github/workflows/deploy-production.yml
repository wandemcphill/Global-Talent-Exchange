name: Production Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gtex-production-deploy
  cancel-in-progress: false

jobs:
  frontend-tests:
    name: Flutter analyze and full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Run frontend analyzer guard
        run: |
          rm -rf build/unit_test_assets build/native_assets
          python tool/check_analyzer_hard_errors.py
      - name: Run Flutter analyze
        run: flutter analyze --no-pub
      - name: Run full Flutter test suite
        run: |
          rm -rf build/unit_test_assets build/native_assets
          flutter test --no-pub --concurrency=1

  generated-api-contract-check:
    name: Generated API contract check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend contract dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
      - name: Regenerate API contract artifacts
        run: python tools/audit/generate_api_contract_bindings.py
      - name: Verify generated API contract artifacts are committed
        shell: bash
        run: git diff --exit-code -- shared/api_contract.json frontend/lib/data/generated/gte_api_contract.g.dart
      - name: Check frontend API contract usage
        run: python tools/audit/check_api_contract_violations.py

  production-guardrail-scan:
    name: Production guardrails and deploy blockers
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend guardrail dependencies
        run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements.txt pytest
      - name: Run production guardrail scan
        run: python tools/guardrails/production_guardrail_scan.py --profile canonical-production --format summary --fail-on violation
      - name: Run canonical acceptance gate
        run: python tools/quality/run_gtex_canonical_acceptance.py --diff-base=
      - name: Verify production deploy blockers
        run: python -m pytest backend/tests/ops/test_canonical_production_guards.py -q

  backend-tests:
    name: Full backend pytest suite
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend test dependencies
        run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements.txt pytest
      - name: Run full backend pytest
        run: python -m pytest backend/tests -q

  backend-live-match-center-tests:
    name: Backend live match center smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements.txt pytest
      - run: >
          python -m pytest
          backend/tests/live_matches/test_live_match_router.py
          backend/tests/live_matches/test_live_match_hot_path_cache.py
          backend/tests/live_matches/test_live_match_sampling.py
          backend/tests/match_engine/test_live_match_experience_contract.py
          backend/tests/realtime/test_match_websocket_gateway.py
          backend/tests/app/test_realtime_match_stream.py
          backend/tests/test_match_timeline_service.py
          -q

  production-deploy-gate:
    name: GTEX production deploy gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - frontend-tests
      - generated-api-contract-check
      - production-guardrail-scan
      - backend-tests
      - backend-live-match-center-tests
    steps:
      - name: Require every production deploy gate to pass
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          failures = {
              name: details["result"]
              for name, details in needs.items()
              if details["result"] != "success"
          }
          if failures:
              for name, result in sorted(failures.items()):
                  print(f"{name}: {result}")
              sys.exit(1)
          print("All GTEX production deploy gates passed.")
          PY

  deploy-production:
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.production-deploy-gate.result == 'success'
    needs:
      - production-deploy-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: ${{ vars.RENDER_HEALTH_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install httpx websockets
      - run: python -m py_compile ops/render/deploy.py ops/render/verify_match_center_routes.py
      - name: Verify canonical production ops guardrails
        run: python tools/quality/run_gtex_canonical_acceptance.py --diff-base=
      - name: Check Render deploy config
        id: render-config
        shell: bash
        env:
          RENDER_DEPLOY_MODE: hook-only
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_API: ${{ secrets.RENDER_SERVICE_API }}
          RENDER_DEPLOY_HOOK_API: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
          RENDER_SERVICE_WEB: ${{ secrets.RENDER_SERVICE_WEB }}
          RENDER_DEPLOY_HOOK_WEB: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
          RENDER_HEALTH_URL: ${{ vars.RENDER_HEALTH_URL }}
        run: |
          missing=()
          [[ -n "$RENDER_API_KEY" ]] || missing+=("RENDER_API_KEY")
          [[ -n "$RENDER_SERVICE_API" ]] || missing+=("RENDER_SERVICE_API")
          [[ -n "$RENDER_DEPLOY_HOOK_API" ]] || missing+=("RENDER_DEPLOY_HOOK_API")
          [[ -n "$RENDER_SERVICE_WEB" ]] || missing+=("RENDER_SERVICE_WEB")
          [[ -n "$RENDER_DEPLOY_HOOK_WEB" ]] || missing+=("RENDER_DEPLOY_HOOK_WEB")
          [[ -n "$RENDER_HEALTH_URL" ]] || missing+=("RENDER_HEALTH_URL")

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Production deploy is not configured. Missing: ${missing[*]}"
            exit 1
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"
      - run: python ops/render/deploy.py
        if: steps.render-config.outputs.configured == 'true'
        env:
          RENDER_DEPLOY_MODE: hook-only
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_API: ${{ secrets.RENDER_SERVICE_API }}
          RENDER_DEPLOY_HOOK_API: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
          RENDER_SERVICE_WEB: ${{ secrets.RENDER_SERVICE_WEB }}
          RENDER_DEPLOY_HOOK_WEB: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
          RENDER_SERVICE_ORDER: ${{ vars.RENDER_SERVICE_ORDER }}
          RENDER_HEALTH_URL: ${{ vars.RENDER_HEALTH_URL }}
          RENDER_VERIFY_MATCH_CENTER_ROUTES: "true"
