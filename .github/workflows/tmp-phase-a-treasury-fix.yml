name: Temporary Phase A Treasury Fix

on:
  push:
    branches:
      - phase/a-economic-foundation

permissions:
  contents: write

jobs:
  treasury-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -r backend/requirements.txt black ruff pytest
      - name: Wire treasury withdrawal fee to Admin policy
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/app/treasury/service.py")
          text = path.read_text()

          import_line = "from app.treasury.commission_policy import resolve_commission_policy\n"
          anchor = "from app.risk_ops_engine.service import RiskActionBlockedError, RiskOpsService\n"
          if import_line not in text:
              if anchor not in text:
                  raise SystemExit("Treasury import anchor not found")
              text = text.replace(anchor, anchor + import_line, 1)

          old_fee_block = '''        commissions = self._commission_settings()\n        try:\n            result = self.wallet_service.request_payout(\n'''
          new_fee_block = '''        commission_policy = resolve_commission_policy(session)\n        try:\n            result = self.wallet_service.request_payout(\n'''
          if old_fee_block not in text:
              if "commission_policy = resolve_commission_policy(session)" not in text:
                  raise SystemExit("Treasury withdrawal fee call-site block not found")
          else:
              text = text.replace(old_fee_block, new_fee_block, 1)

          old_args = '''                withdrawal_fee_bps=int(commissions.get("withdrawal_fee_bps", 1000) or 1000),\n                minimum_fee=Decimal(str(commissions.get("minimum_withdrawal_fee_credits", "5.0000") or "5.0000")),\n'''
          new_args = '''                withdrawal_fee_bps=commission_policy.withdrawal_fee_bps,\n                minimum_fee=commission_policy.minimum_withdrawal_fee_credits,\n'''
          if old_args not in text:
              if "withdrawal_fee_bps=commission_policy.withdrawal_fee_bps" not in text:
                  raise SystemExit("Treasury withdrawal fee arguments not found")
          else:
              text = text.replace(old_args, new_args, 1)

          path.write_text(text)
          PY

          cat > backend/tests/treasury/test_commission_policy.py <<'PY'
          from decimal import Decimal

          import pytest
          from sqlalchemy import create_engine
          from sqlalchemy.orm import Session

          from app.models.admin_runtime_state import AdminRuntimeState
          from app.treasury.commission_policy import (
              CommissionPolicyUnavailableError,
              resolve_commission_policy,
          )


          def make_session() -> Session:
              engine = create_engine("sqlite:///:memory:")
              AdminRuntimeState.__table__.create(engine)
              return Session(engine)


          def test_withdrawal_fee_resolves_from_admin_runtime_state() -> None:
              with make_session() as session:
                  session.add(
                      AdminRuntimeState(
                          state_key="admin_god_mode",
                          payload_json={
                              "commissions": {
                                  "withdrawal_fee_bps": 300,
                                  "minimum_withdrawal_fee_credits": "7.5000",
                              }
                          },
                      )
                  )
                  session.commit()

                  policy = resolve_commission_policy(session)

              assert policy.withdrawal_fee_bps == 300
              assert policy.minimum_withdrawal_fee_credits == Decimal("7.5000")


          def test_withdrawal_fee_resolution_fails_closed_when_admin_policy_missing() -> None:
              with make_session() as session:
                  with pytest.raises(CommissionPolicyUnavailableError):
                      resolve_commission_policy(session)
          PY

          python -m black backend/app/treasury/commission_policy.py backend/app/treasury/service.py backend/tests/treasury/test_commission_policy.py
          python -m ruff check --fix --no-cache backend/app/treasury/commission_policy.py backend/app/treasury/service.py backend/tests/treasury/test_commission_policy.py
          python -m pytest backend/tests/treasury/test_commission_policy.py -q
      - name: Commit treasury fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/treasury/commission_policy.py backend/app/treasury/service.py backend/tests/treasury/test_commission_policy.py
          git commit -m "fix(treasury): resolve withdrawal fees from Admin policy"
          git push
