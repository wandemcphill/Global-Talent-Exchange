name: GTEX short pass selection repair

on:
  push:
    branches: [fix/gtex-short-pass-selection]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/gtex-short-pass-selection
      - name: Patch short pass candidate floor
        shell: bash
        run: |
          set -euo pipefail
          FILE="Gtex_Test_Migration/Assets/Code/GTEX/Simulation/GtexSimSpatialSynthesizer.cs"
          BEFORE=$(grep -n 'distance <= 7f' "$FILE" || true)
          test -n "$BEFORE"
          sed -i 's/distance <= 7f/distance <= 3.5f/' "$FILE"
          AFTER=$(grep -n 'distance <= 3.5f' "$FILE" || true)
          test -n "$AFTER"
          git diff --check
          git diff -- "$FILE"
          rm .github/workflows/gtex_short_pass_repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git add -u .github/workflows/gtex_short_pass_repair.yml
          git commit -m "fix(gtex): allow safe short passing options"
          git push origin HEAD:fix/gtex-short-pass-selection
