name: Phase A legacy fee fix

on:
  push:
    branches:
      - phase/a-economic-foundation

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[phase-a-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove legacy hosted competition fee defaults
        env:
          GH_BRANCH: phase/a-economic-foundation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/app/hosted_competition_engine/service.py')
          text = path.read_text()
          replacements = {
              '"platform_fee_bps": 1000,': '"platform_fee_bps": 3000,',
              '"platform_fee_bps": 2000,': '"platform_fee_bps": 3000,',
              'return int(rule.competition_platform_fee_bps if rule is not None else 1000)':
                  'return int(rule.competition_platform_fee_bps if rule is not None else 3000)',
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new)
          path.write_text(text)
          PY

          python - <<'PY'
          from pathlib import Path
          path = Path('backend/app/models/hosted_competition.py')
          text = path.read_text()
          old = 'platform_fee_bps: Mapped[int] = mapped_column(nullable=False, default=1000)'
          new = 'platform_fee_bps: Mapped[int] = mapped_column(nullable=False, default=3000, server_default="3000")'
          if old in text:
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

          git diff --check
          git config user.name 'gtex-phase-a-bot'
          git config user.email 'gtex-phase-a-bot@users.noreply.github.com'
          git add backend/app/hosted_competition_engine/service.py backend/app/models/hosted_competition.py
          git diff --cached --quiet || git commit -m 'fix: remove legacy hosted competition fee defaults [phase-a-bot]'
          git push origin "$GH_BRANCH"
