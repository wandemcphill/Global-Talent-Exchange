name: GTEX authoritative playback finalization

on:
  push:
    branches: [fix/gtex-authoritative-3d-playback]

permissions:
  contents: write

jobs:
  finalize:
    if: "!contains(github.event.head_commit.message, '[gtex-finalized]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gtex-authoritative-3d-playback
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Correct finalizer validation gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/gtex_finalize_authoritative_playback.py')
          s = p.read_text(encoding='utf-8')
          old = '''m = re.search(r"private float ApplyLivePlayerState\\([\\s\\S]*?\\n        }\\n\\s*private Vector3 ResolveBehaviorAnchorPosition", r)
          if not m:
              raise SystemExit("ApplyLivePlayerState boundary missing")
          body = m.group(0)'''
          new = '''m = re.search(r"private float ApplyLivePlayerState\\([\\s\\S]*?\\n        }", r)
          if not m:
              raise SystemExit("ApplyLivePlayerState boundary missing")
          body = m.group(0)'''
          if old not in s:
              raise SystemExit('expected validator block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Finalize source
        run: python3 tools/gtex_finalize_authoritative_playback.py
      - name: Commit final source and remove finalizer
        run: |
          rm -f .github/workflows/gtex_finalize_trigger.yml tools/gtex_finalize_authoritative_playback.py
          git config user.name "GTEX Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "fix: finalize GTEX authoritative 3D playback [gtex-finalized]"
          git push origin HEAD:fix/gtex-authoritative-3d-playback
