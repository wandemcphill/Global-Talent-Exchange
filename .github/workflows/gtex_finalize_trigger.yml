name: GTEX authoritative playback finalization

on:
  push:
    branches: [fix/gtex-authoritative-3d-playback]

permissions:
  contents: write

jobs:
  finalize:
    if: "!contains(github.event.head_commit.message, '[gtex-finalized]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gtex-authoritative-3d-playback
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Finalize source
        run: python3 tools/gtex_finalize_authoritative_playback.py
      - name: Commit final source and remove finalizer
        run: |
          rm -f .github/workflows/gtex_finalize_trigger.yml tools/gtex_finalize_authoritative_playback.py
          git config user.name "GTEX Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "fix: finalize GTEX authoritative 3D playback [gtex-finalized]"
          git push origin HEAD:fix/gtex-authoritative-3d-playback
