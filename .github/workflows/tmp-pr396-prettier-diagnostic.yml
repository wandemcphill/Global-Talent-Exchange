name: Temporary PR 396 Prettier Diagnostic

on:
  push:
    branches:
      - fix/ingestion-predeploy-migrations

permissions:
  contents: read

jobs:
  format-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install root quality dependencies
        run: npm ci
      - name: Emit canonical Prettier output
        shell: bash
        run: |
          npx prettier --write services/player-ingestion/test/startup-migration.test.cjs
          echo "----- PRETTIER DIFF -----"
          git diff -- services/player-ingestion/test/startup-migration.test.cjs || true
          echo "----- FORMATTED FILE -----"
          cat services/player-ingestion/test/startup-migration.test.cjs
