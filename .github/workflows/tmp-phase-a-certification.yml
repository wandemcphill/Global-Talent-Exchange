name: Temporary Phase A Certification

on:
  push:
    branches:
      - phase/a-economic-foundation

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -r backend/requirements.txt black ruff detect-secrets
      - name: Run Phase A quality and economic proof
        env:
          QUALITY_BASE_SHA: a74a64cfe5d6c557cfde309b796d4efe4041c2ab
          QUALITY_HEAD_SHA: ${{ github.sha }}
        run: |
          python tools/check_python_runtime_alignment.py
          python tools/audit/generate_api_contract_bindings.py
          python tools/audit/check_api_contract_violations.py
          python tools/audit/reality_audit.py
          python frontend/tool/audit_dependency_graph.py
          python tools/quality/run_changed_quality.py --base "$QUALITY_BASE_SHA" --head "$QUALITY_HEAD_SHA"
          python -m pytest \
            backend/tests/economy/test_competition_funding_policy.py \
            backend/tests/economy/test_competition_model_economic_guard.py \
            backend/tests/economy/test_currency_policy.py \
            backend/tests/economy/test_economic_conversion_service.py \
            backend/tests/economy/test_hosted_competition_coin_escrow.py \
            backend/tests/economy/test_hosted_competition_fee_fail_closed.py \
            backend/tests/economy/test_hosted_competition_funding_contract.py \
            backend/tests/economy/test_withdrawal_currency_guard.py \
            backend/tests/gift_engine/test_fan_coin_to_gtex_coin_conversion.py \
            backend/tests/hosted_competition_engine/test_coin_aware_fee_freeze.py \
            backend/tests/hosted_competition_engine/test_coin_aware_service.py \
            backend/tests/agents/test_agent_ledger_service.py \
            backend/tests/agents/test_agent_state_store_fail_closed.py \
            backend/tests/agents/test_agent_wallet_economic_safety.py \
            backend/tests/treasury/test_commission_policy.py -q
      - name: Write certification proof
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          path = Path("docs/implementation/PHASE_A_CERTIFICATION_PROOF.md")
          path.write_text(
              "# Phase A Certification Proof\n\n"
              f"Branch head certified: `{__import__('subprocess').check_output(['git','rev-parse','HEAD'], text=True).strip()}`\n\n"
              f"UTC: {datetime.now(timezone.utc).isoformat()}\n\n"
              "Checks passed in one branch-head runner: runtime alignment, API contracts, strict-live reality, dependency graph, changed-quality Black/Ruff checks, and the Phase A economic regression suite.\n"
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/implementation/PHASE_A_CERTIFICATION_PROOF.md
          git commit -m "docs: record Phase A certification proof"
          git push origin HEAD:phase/a-economic-foundation