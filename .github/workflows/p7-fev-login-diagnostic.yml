name: P7-FEV Login Diagnostic

on:
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - "qa/playwright/**"
      - ".github/workflows/p7-fev-login-diagnostic.yml"

permissions:
  contents: read

jobs:
  login-diagnostic:
    name: Authenticated shell login diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Bootstrap deterministic GTEX browser data
        env:
          DATABASE_URL: "sqlite+pysqlite:////tmp/gtex-p7-fev.db"
          GTE_DATABASE_URL: "sqlite+pysqlite:////tmp/gtex-p7-fev.db"
          GTE_AUTH_SECRET: "p7-fev-login-diagnostic-${{ github.run_id }}"
          GTE_MEDIA_SIGNING_SECRET: "p7-fev-login-media-${{ github.run_id }}"
        run: python backend/scripts/bootstrap_demo.py

      - name: Start FastAPI backend
        env:
          DATABASE_URL: "sqlite+pysqlite:////tmp/gtex-p7-fev.db"
          GTE_DATABASE_URL: "sqlite+pysqlite:////tmp/gtex-p7-fev.db"
          GTE_AUTH_SECRET: "p7-fev-login-diagnostic-${{ github.run_id }}"
          GTE_MEDIA_SIGNING_SECRET: "p7-fev-login-media-${{ github.run_id }}"
        run: |
          nohup bash -lc 'cd backend && uvicorn app.main:app --host 127.0.0.1 --port 8000' > /tmp/gtex-fastapi.log 2>&1 &
          python - <<'PY'
          import time
          import urllib.request
          for _ in range(120):
              try:
                  urllib.request.urlopen("http://127.0.0.1:8000/openapi.json", timeout=1)
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("FastAPI did not start")
          PY

      - name: Install Flutter dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Install Playwright dependencies
        working-directory: qa/playwright
        run: npm ci

      - name: Install Chromium
        working-directory: qa/playwright
        run: npx playwright install chromium

      - name: Generate temporary Flutter login probe
        working-directory: qa/playwright
        run: |
          cat > tests/p7_fe_login_probe.spec.mjs <<'EOF'
          import { test } from "@playwright/test";

          test("inspect Flutter login semantics", async ({ page }) => {
            await page.goto("/auth/login", { waitUntil: "domcontentloaded", timeout: 60_000 });
            await page.waitForTimeout(3_000);

            const snapshot = await page.evaluate(() => ({
              url: location.href,
              inputs: document.querySelectorAll("input").length,
              textareas: document.querySelectorAll("textarea").length,
              buttons: document.querySelectorAll("button").length,
              semantics: document.querySelectorAll("flt-semantics").length,
              semanticsRoles: Array.from(document.querySelectorAll("flt-semantics"))
                .map((node) => ({
                  role: node.getAttribute("role"),
                  label: node.getAttribute("aria-label"),
                  text: node.textContent?.trim(),
                }))
                .filter((entry) => entry.role || entry.label || entry.text)
                .slice(0, 80),
              bodyText: document.body.innerText.slice(0, 4000),
            }));

            console.log("GTEX_LOGIN_PROBE", JSON.stringify(snapshot));

            await page.keyboard.press("Tab");
            await page.waitForTimeout(250);
            const afterTab = await page.evaluate(() => ({
              activeTag: document.activeElement?.tagName,
              activeRole: document.activeElement?.getAttribute("role"),
              activeLabel: document.activeElement?.getAttribute("aria-label"),
              inputs: document.querySelectorAll("input").length,
            }));
            console.log("GTEX_LOGIN_PROBE_AFTER_TAB", JSON.stringify(afterTab));
          });
          EOF

      - name: Run temporary Flutter login probe
        working-directory: qa/playwright
        env:
          GTEX_E2E_API_BASE_URL: http://127.0.0.1:8000
        run: >-
          npx playwright test
          tests/p7_fe_login_probe.spec.mjs
          --project=desktop
          --retries=0
          --reporter=line

          npx playwright test
          tests/p7_fe_authed_shell.spec.mjs
          --project=desktop
          --grep "authenticated shell loads home command center"
          --retries=0
          --reporter=line
