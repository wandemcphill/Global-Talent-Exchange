name: Finalize canonical contract artifacts

on:
  push:
    branches:
      - acceptance/gtex-full-user-journey-20260915

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acceptance/gtex-full-user-journey-20260915
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Regenerate canonical contract artifacts and restore standard workflows
        run: |
          set -euo pipefail
          python tools/audit/generate_contract_audit.py
          python tools/audit/generate_api_contract_bindings.py
          git checkout origin/main -- .github/workflows/quality-gates.yml .github/workflows/final-platform-certification.yml
          rm .github/workflows/_finalize_generated_contracts.yml
          git add \
            docs/ROUTE_MAP.json \
            docs/ROUTE_CLASSIFICATION.md \
            docs/FRONTEND_API_MAP.json \
            docs/WEB_MOBILE_DIFF.md \
            docs/MISMATCH_REPORT.md \
            docs/CRITICAL_ISSUES.md \
            docs/FINAL_API_SCHEMA.json \
            docs/DEPRECATION_MAP.json \
            docs/PRE_DELETION_VALIDATION.md \
            docs/ENV_AUDIT.md \
            shared/api_contract.json \
            frontend/lib/data/generated/gte_api_contract.g.dart \
            .github/workflows/quality-gates.yml \
            .github/workflows/final-platform-certification.yml \
            .github/workflows/_finalize_generated_contracts.yml
          git status --short
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(api-contract): regenerate canonical route artifacts'
          git push origin HEAD:acceptance/gtex-full-user-journey-20260915
