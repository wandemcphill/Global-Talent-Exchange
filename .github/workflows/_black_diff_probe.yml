name: TEMP Black diff probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  black-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Black
        run: python -m pip install black==26.5.1
      - name: Print exact Black diff
        run: |
          python -m black --diff backend/app/models/national_team.py tools/audit/check_api_contract_violations.py
          python -m black --check backend/app/models/national_team.py tools/audit/check_api_contract_violations.py
