name: Temporary Phase A Quality Fix

on:
  push:
    branches:
      - phase/a-economic-foundation

permissions:
  contents: write

jobs:
  quality-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -r backend/requirements.txt black ruff
      - name: Format and autofix touched Phase A Python
        run: |
          python -m black \
            backend/app/admin_engine/schemas.py \
            backend/app/agents/agent_wallet.py \
            backend/app/agents/models/__init__.py \
            backend/app/agents/state_store.py \
            backend/app/config/competition_constants.py \
            backend/app/economy/competition_funding_policy.py \
            backend/app/economy/conversion_service.py \
            backend/app/economy/currency_policy.py \
            backend/app/economy/hosted_competition_coin_escrow.py \
            backend/app/gift_engine/__init__.py \
            backend/app/gift_engine/canonical_service.py \
            backend/app/hosted_competition_engine/coin_aware_service.py \
            backend/app/hosted_competition_engine/router.py \
            backend/app/hosted_competition_engine/schemas.py \
            backend/app/models/admin_rules.py \
            backend/app/models/competition.py \
            backend/app/models/economic_conversion.py \
            backend/app/models/gift_transaction.py \
            backend/app/models/hosted_competition.py \
            backend/migrations/versions/20260821_0107_economic_conversions.py \
            backend/migrations/versions/20260821_0108_gift_currency_semantics.py \
            backend/migrations/versions/20260822_0109_competition_fee_policy_default.py \
            backend/migrations/versions/20260822_0110_agent_wallet_fail_closed.py \
            backend/migrations/versions/20260822_0111_hosted_competition_template_fee_default.py \
            backend/migrations/versions/20260822_0112_hosted_competition_funding_contract.py \
            backend/tests/admin_engine/test_admin_reward_rule_fee_policy.py \
            backend/tests/agents/test_agent_state_store_fail_closed.py \
            backend/tests/agents/test_agent_wallet_economic_safety.py \
            backend/tests/economy/test_competition_funding_policy.py \
            backend/tests/economy/test_competition_model_economic_guard.py \
            backend/tests/economy/test_currency_policy.py \
            backend/tests/economy/test_economic_conversion_service.py \
            backend/tests/economy/test_hosted_competition_coin_escrow.py \
            backend/tests/economy/test_hosted_competition_fee_fail_closed.py \
            backend/tests/economy/test_hosted_competition_funding_contract.py \
            backend/tests/economy/test_withdrawal_currency_guard.py \
            backend/tests/gift_engine/test_fan_coin_to_gtex_coin_conversion.py \
            backend/tests/hosted_competition_engine/test_coin_aware_fee_freeze.py \
            backend/tests/hosted_competition_engine/test_coin_aware_service.py
          python -m ruff check --fix --no-cache \
            backend/app/admin_engine/schemas.py \
            backend/app/agents/agent_wallet.py \
            backend/app/agents/models/__init__.py \
            backend/app/agents/state_store.py \
            backend/app/config/competition_constants.py \
            backend/app/economy/competition_funding_policy.py \
            backend/app/economy/conversion_service.py \
            backend/app/economy/currency_policy.py \
            backend/app/economy/hosted_competition_coin_escrow.py \
            backend/app/gift_engine/__init__.py \
            backend/app/gift_engine/canonical_service.py \
            backend/app/hosted_competition_engine/coin_aware_service.py \
            backend/app/hosted_competition_engine/router.py \
            backend/app/hosted_competition_engine/schemas.py \
            backend/app/models/admin_rules.py \
            backend/app/models/competition.py \
            backend/app/models/economic_conversion.py \
            backend/app/models/gift_transaction.py \
            backend/app/models/hosted_competition.py \
            backend/migrations/versions/20260821_0107_economic_conversions.py \
            backend/migrations/versions/20260821_0108_gift_currency_semantics.py \
            backend/migrations/versions/20260822_0109_competition_fee_policy_default.py \
            backend/migrations/versions/20260822_0110_agent_wallet_fail_closed.py \
            backend/migrations/versions/20260822_0111_hosted_competition_template_fee_default.py \
            backend/migrations/versions/20260822_0112_hosted_competition_funding_contract.py \
            backend/tests/admin_engine/test_admin_reward_rule_fee_policy.py \
            backend/tests/agents/test_agent_state_store_fail_closed.py \
            backend/tests/agents/test_agent_wallet_economic_safety.py \
            backend/tests/economy/test_competition_funding_policy.py \
            backend/tests/economy/test_competition_model_economic_guard.py \
            backend/tests/economy/test_currency_policy.py \
            backend/tests/economy/test_economic_conversion_service.py \
            backend/tests/economy/test_hosted_competition_coin_escrow.py \
            backend/tests/economy/test_hosted_competition_fee_fail_closed.py \
            backend/tests/economy/test_hosted_competition_funding_contract.py \
            backend/tests/economy/test_withdrawal_currency_guard.py \
            backend/tests/gift_engine/test_fan_coin_to_gtex_coin_conversion.py \
            backend/tests/hosted_competition_engine/test_coin_aware_fee_freeze.py \
            backend/tests/hosted_competition_engine/test_coin_aware_service.py
      - name: Commit quality fixes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app backend/tests migrations 2>/dev/null || true
          git add backend/app/admin_engine/schemas.py backend/app/agents/agent_wallet.py backend/app/agents/models/__init__.py backend/app/agents/state_store.py backend/app/config/competition_constants.py backend/app/economy backend/app/gift_engine backend/app/hosted_competition_engine backend/app/models/admin_rules.py backend/app/models/competition.py backend/app/models/economic_conversion.py backend/app/models/gift_transaction.py backend/app/models/hosted_competition.py backend/migrations/versions/20260821_0107_economic_conversions.py backend/migrations/versions/20260821_0108_gift_currency_semantics.py backend/migrations/versions/20260822_0109_competition_fee_policy_default.py backend/migrations/versions/20260822_0110_agent_wallet_fail_closed.py backend/migrations/versions/20260822_0111_hosted_competition_template_fee_default.py backend/migrations/versions/20260822_0112_hosted_competition_funding_contract.py backend/tests/admin_engine/test_admin_reward_rule_fee_policy.py backend/tests/agents/test_agent_state_store_fail_closed.py backend/tests/agents/test_agent_wallet_economic_safety.py backend/tests/economy/test_competition_funding_policy.py backend/tests/economy/test_competition_model_economic_guard.py backend/tests/economy/test_currency_policy.py backend/tests/economy/test_economic_conversion_service.py backend/tests/economy/test_hosted_competition_coin_escrow.py backend/tests/economy/test_hosted_competition_fee_fail_closed.py backend/tests/economy/test_hosted_competition_funding_contract.py backend/tests/economy/test_withdrawal_currency_guard.py backend/tests/gift_engine/test_fan_coin_to_gtex_coin_conversion.py backend/tests/hosted_competition_engine/test_coin_aware_fee_freeze.py backend/tests/hosted_competition_engine/test_coin_aware_service.py
          git commit -m "style: format and lint Phase A economics"
          git push
