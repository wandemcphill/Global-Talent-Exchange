name: Temporary Phase A Black Fix Current

on:
  push:
    branches:
      - phase/a-economic-foundation

permissions:
  contents: write

jobs:
  black-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -r backend/requirements.txt black
      - run: >
          python -m black
          backend/app/economy/competition_funding_policy.py
          backend/app/economy/conversion_service.py
          backend/app/economy/hosted_competition_coin_escrow.py
          backend/app/gift_engine/canonical_service.py
          backend/app/agents/state_store.py
          backend/app/models/admin_rules.py
          backend/app/models/economic_conversion.py
          backend/app/hosted_competition_engine/coin_aware_service.py
          backend/app/hosted_competition_engine/router.py
          backend/migrations/versions/20260821_0108_gift_currency_semantics.py
          backend/migrations/versions/20260822_0109_competition_fee_policy_default.py
          backend/migrations/versions/20260822_0111_hosted_competition_template_fee_default.py
          backend/app/models/gift_transaction.py
          backend/tests/gift_engine/test_fan_coin_to_gtex_coin_conversion.py
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/economy/competition_funding_policy.py backend/app/economy/conversion_service.py backend/app/economy/hosted_competition_coin_escrow.py backend/app/gift_engine/canonical_service.py backend/app/agents/state_store.py backend/app/models/admin_rules.py backend/app/models/economic_conversion.py backend/app/hosted_competition_engine/coin_aware_service.py backend/app/hosted_competition_engine/router.py backend/migrations/versions/20260821_0108_gift_currency_semantics.py backend/migrations/versions/20260822_0109_competition_fee_policy_default.py backend/migrations/versions/20260822_0111_hosted_competition_template_fee_default.py backend/app/models/gift_transaction.py backend/tests/gift_engine/test_fan_coin_to_gtex_coin_conversion.py
          git commit -m "style: apply black formatting to phase A changes"
          git push
# retrigger formatter
