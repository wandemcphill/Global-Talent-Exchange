name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      NODE_ENV: production
      QUALITY_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      QUALITY_HEAD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements.txt black ruff detect-secrets
      - name: Temporarily format catalogue files
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch origin "${GITHUB_HEAD_REF}"
          git checkout "${GITHUB_HEAD_REF}"
          python -m black \
            backend/app/legend_catalogue/schema.py \
            backend/app/legend_catalogue/validation.py \
            backend/app/models/legendary_player.py \
            backend/app/legend_catalogue/wikidata_source.py \
            backend/app/services/legendary_player_launch_service.py \
            backend/scripts/apply_legendary_catalogue_enrichment.py \
            backend/migrations/versions/20260917_0125_legendary_catalogue_governance.py \
            backend/scripts/import_approved_legendary_catalogue.py \
            backend/tests/legend_layer/test_canonical_legendary_pilot.py
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/app/legend_catalogue/schema.py \
            backend/app/legend_catalogue/validation.py \
            backend/app/models/legendary_player.py \
            backend/app/legend_catalogue/wikidata_source.py \
            backend/app/services/legendary_player_launch_service.py \
            backend/scripts/apply_legendary_catalogue_enrichment.py \
            backend/migrations/versions/20260917_0125_legendary_catalogue_governance.py \
            backend/scripts/import_approved_legendary_catalogue.py \
            backend/tests/legend_layer/test_canonical_legendary_pilot.py
          git commit -m "style: format legendary catalogue changes"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
      - run: python tools/check_python_runtime_alignment.py
      - run: python tools/audit/generate_contract_audit.py
      - run: python tools/audit/generate_api_contract_bindings.py
      - run: python tools/audit/check_api_contract_violations.py
      - run: python tools/audit/reality_audit.py
      - run: python frontend/tool/audit_dependency_graph.py
      - run: python backend/scripts/audit_final_platform_release.py
      - run: python backend/scripts/audit_group6_production_readiness.py
      - run: python tools/quality/run_changed_quality.py --base "$QUALITY_BASE_SHA" --head "$QUALITY_HEAD_SHA"
        shell: bash
