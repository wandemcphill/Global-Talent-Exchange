name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      NODE_ENV: production
      QUALITY_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      QUALITY_HEAD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements.txt black ruff detect-secrets
      - name: Temporary Phase A formatting repair
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin phase/a-economic-foundation
          git checkout -B phase/a-economic-foundation origin/phase/a-economic-foundation
          python -m black backend/app/models/wallet.py backend/tests/economy/test_phase_a_hosted_competition_db_roundtrip.py
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add backend/app/models/wallet.py backend/tests/economy/test_phase_a_hosted_competition_db_roundtrip.py
            git commit -m "chore: format phase A economic files"
            git push origin phase/a-economic-foundation
          fi
          echo "QUALITY_HEAD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - run: python tools/check_python_runtime_alignment.py
      - run: python tools/audit/generate_api_contract_bindings.py
      - run: python tools/audit/check_api_contract_violations.py
      - run: python tools/audit/reality_audit.py
      - run: python frontend/tool/audit_dependency_graph.py
      - run: python tools/quality/run_changed_quality.py --base "$QUALITY_BASE_SHA" --head "$QUALITY_HEAD_SHA"
        shell: bash
