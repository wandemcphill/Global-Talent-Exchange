name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      NODE_ENV: production
      QUALITY_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      QUALITY_HEAD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements.txt black ruff detect-secrets
      - run: python tools/check_python_runtime_alignment.py

      - name: Temporary acceptance repair: normalize national rental timestamps
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("backend/app/national_team_engine/tournament_service.py")
          text = p.read_text(encoding="utf-8")
          old_import = "from datetime import date, datetime, timedelta\n"
          new_import = "from datetime import date, datetime, timedelta, timezone\n"
          if old_import not in text:
              raise SystemExit("expected datetime import not found")
          text = text.replace(old_import, new_import, 1)
          old = '''    def _rental_tournament_lock_reason(self, competition: NationalTeamCompetition) -> str | None:\n        now = utcnow()\n        if competition.entry_opens_at is not None and competition.entry_opens_at > now:\n            return "competition_entry_not_open"\n        if competition.entry_closes_at is not None and competition.entry_closes_at < now:\n            return "competition_entry_closed"\n        if str(competition.status).strip().lower() == "live":\n            return "competition_already_live"\n        if competition.kickoff_at is not None and competition.kickoff_at <= now:\n            return "competition_already_live"\n        if competition.linked_competition_id:\n            try:\n                CompetitionLockService(self.session).ensure_rentals_allowed(\n                    competition_id=competition.linked_competition_id\n                )\n            except CompetitionLockError:\n                return "competition_already_live"\n        if competition.completed_at is not None:\n            return "competition_completed"\n        return None\n'''
          new = '''    @staticmethod\n    def _as_utc_datetime(value: datetime | None) -> datetime | None:\n        if value is None:\n            return None\n        if value.tzinfo is None:\n            return value.replace(tzinfo=timezone.utc)\n        return value.astimezone(timezone.utc)\n\n    def _rental_tournament_lock_reason(self, competition: NationalTeamCompetition) -> str | None:\n        now = utcnow()\n        entry_opens_at = self._as_utc_datetime(competition.entry_opens_at)\n        entry_closes_at = self._as_utc_datetime(competition.entry_closes_at)\n        kickoff_at = self._as_utc_datetime(competition.kickoff_at)\n        if entry_opens_at is not None and entry_opens_at > now:\n            return "competition_entry_not_open"\n        if entry_closes_at is not None and entry_closes_at < now:\n            return "competition_entry_closed"\n        if str(competition.status).strip().lower() == "live":\n            return "competition_already_live"\n        if kickoff_at is not None and kickoff_at <= now:\n            return "competition_already_live"\n        if competition.linked_competition_id:\n            try:\n                CompetitionLockService(self.session).ensure_rentals_allowed(\n                    competition_id=competition.linked_competition_id\n                )\n            except CompetitionLockError:\n                return "competition_already_live"\n        if competition.completed_at is not None:\n            return "competition_completed"\n        return None\n'''
          if old not in text:
              raise SystemExit("expected rental lock function not found")
          text = text.replace(old, new, 1)
          p.write_text(text, encoding="utf-8")
          PY

      - name: Exact GTEX user journey acceptance
        run: python -m pytest backend/tests/acceptance/test_gtex_full_user_journey.py -q

      - name: Commit accepted runtime fix and restore temporary CI changes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path(".github/workflows/quality-gates.yml")
          text = p.read_text(encoding="utf-8")
          start = text.index("      - name: Temporary acceptance repair: normalize national rental timestamps\n")
          end = text.index("      - name: Exact GTEX user journey acceptance\n", start)
          # Remove both the temporary patch step and the dedicated acceptance step.
          text = text[:start] + text[text.index("      - name: Commit accepted runtime fix and restore temporary CI changes\n", end):]
          # The cleanup step must be replaced with a concrete shell block below.
          marker = "      - name: Commit accepted runtime fix and restore temporary CI changes\n"
          cleanup = '''      - name: Commit accepted runtime fix and restore temporary CI changes\n        run: |\n          python - <<'PY'\n          from pathlib import Path\n          p = Path(".github/workflows/quality-gates.yml")\n          text = p.read_text(encoding="utf-8")\n          text = text.replace("permissions:\\n  contents: write\\n", "permissions:\\n  contents: read\\n", 1)\n          p.write_text(text, encoding="utf-8")\n\n          final = Path(".github/workflows/final-platform-certification.yml")\n          final_text = final.read_text(encoding="utf-8")\n          start = final_text.index("      - name: Temporary acceptance repair: normalize national rental timestamps\\n")\n          end = final_text.index("      - name: Final read-only platform truth audit\\n", start)\n          final_text = final_text[:start] + final_text[end:]\n          final_text = final_text.replace("permissions:\\n  contents: write\\n", "permissions:\\n  contents: read\\n", 1)\n          final_text = final_text.replace("      - name: Commit accepted timestamp fix and restore certification workflow\\n", "", 1)\n          # Remove the stale cleanup step that only existed for the temporary CI patch.\n          cleanup_start = final_text.find("      - name: Commit accepted timestamp fix and restore certification workflow\\n")\n          if cleanup_start != -1:\n              cleanup_end = final_text.find("      - name: Frontend dependencies\\n", cleanup_start)\n              final_text = final_text[:cleanup_start] + final_text[cleanup_end:]\n          final.write_text(final_text, encoding="utf-8")\n          Path(".github/workflows/repair-rental-datetime.yml").unlink(missing_ok=True)\n          PY\n          git config user.name 'github-actions[bot]'\n          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'\n          git add backend/app/national_team_engine/tournament_service.py .github/workflows/quality-gates.yml .github/workflows/final-platform-certification.yml .github/workflows/repair-rental-datetime.yml\n          git commit -m 'fix(national-team): normalize rental competition timestamps'\n          git push origin HEAD:acceptance/gtex-full-user-journey-20260915

      - run: python tools/audit/generate_api_contract_bindings.py
      - run: python tools/audit/check_api_contract_violations.py
      - run: python tools/audit/reality_audit.py
      - run: python frontend/tool/audit_dependency_graph.py
      - run: python backend/scripts/audit_final_platform_release.py
      - run: python backend/scripts/audit_group6_production_readiness.py
      - run: python tools/quality/run_changed_quality.py --base "$QUALITY_BASE_SHA" --head "$QUALITY_HEAD_SHA"
        shell: bash
