name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase-a-autofix:
    if: github.event_name == 'pull_request' && github.head_ref == 'phase/a-economic-foundation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -r backend/requirements.txt black ruff
      - name: Apply Phase A Agent and hosted-competition closure
        run: |
          python - <<'PY'
          from pathlib import Path

          manager = Path("backend/app/agents/agent_manager.py")
          text = manager.read_text()
          text = text.replace("from dataclasses import dataclass, field\n", "from dataclasses import dataclass, field, replace\n", 1)
          text = text.replace("from datetime import UTC, datetime, timedelta\n", "from datetime import UTC, datetime, timedelta\nfrom decimal import Decimal\n", 1)
          text = text.replace("from app.agents.agent_wallet import AgentWallet, AgentWalletService\n", "from app.agents.agent_wallet import AgentWallet, AgentWalletService\nfrom app.agents.ledger_service import AgentLedgerService\n", 1)
          text = text.replace("from app.core.events import DomainEvent, EventPublisher\n", "from app.core.events import DomainEvent, EventPublisher\nfrom app.models.wallet import LedgerSourceTag, LedgerUnit\n", 1)
          text = text.replace("        self.wallet_service = wallet_service or AgentWalletService()\n", "        self.wallet_service = wallet_service or AgentWalletService()\n        self.agent_ledger_service = AgentLedgerService()\n", 1)
          old_run = '''                boost_decision = self.wallet_service.recommend_boost(\n                    wallet=agent.wallet,\n                    predicted_reward=decision.predicted_reward,\n                    risk_level=decision.risk_level,\n                    feed_pressure=self._feed_pressure(),\n                )\n                agent.profile.strategy.global_exposure_feedback = decision.global_exposure_feedback\n                agent.profile.strategy.shared_brain = decision.shared_brain\n                variants = self.variant_planner.plan(profile=agent.profile, decision=decision)\n                generated = self.content_generator.generate(\n                    profile=agent.profile,\n                    decision=decision,\n                    variants=variants,\n                    boost_amount=boost_decision.boost_amount,\n                )\n                agent.wallet = self.wallet_service.apply_spend(agent.wallet, boost_decision.boost_amount)\n                self._publish_generated_clip(generated)\n'''
          new_run = '''                agent.wallet = replace(\n                    agent.wallet,\n                    balance=float(self._agent_ledger_balance(agent.profile.identity.agent_id)),\n                )\n                boost_decision = self.wallet_service.recommend_boost(\n                    wallet=agent.wallet,\n                    predicted_reward=decision.predicted_reward,\n                    risk_level=decision.risk_level,\n                    feed_pressure=self._feed_pressure(),\n                )\n                agent.profile.strategy.global_exposure_feedback = decision.global_exposure_feedback\n                agent.profile.strategy.shared_brain = decision.shared_brain\n                variants = self.variant_planner.plan(profile=agent.profile, decision=decision)\n                generated = self.content_generator.generate(\n                    profile=agent.profile,\n                    decision=decision,\n                    variants=variants,\n                    boost_amount=boost_decision.boost_amount,\n                )\n                if boost_decision.boost_amount > 0.0:\n                    self._agent_ledger_spend(\n                        agent_id=agent.profile.identity.agent_id,\n                        amount=Decimal(str(boost_decision.boost_amount)),\n                        reference=f"agent-boost:{generated.clip_id}",\n                    )\n                agent.wallet = self._refresh_wallet_projection(\n                    agent, last_spend=boost_decision.boost_amount, last_earnings=0.0\n                )\n                self._publish_generated_clip(generated)\n'''
          if old_run not in text:
              raise SystemExit("run_cycle Agent Wallet mutation block not found")
          text = text.replace(old_run, new_run, 1)
          old_perf = '''            agent.wallet, settlement = self.wallet_service.settle(\n                agent.wallet,\n                earnings=payload.earnings,\n                quality_score=quality_score,\n                trust_score=trust_score,\n                repetition_ratio=repetition_ratio,\n            )\n            agent.save_state()\n'''
          new_perf = '''            agent.wallet, settlement = self.wallet_service.settle(\n                agent.wallet,\n                earnings=payload.earnings,\n                quality_score=quality_score,\n                trust_score=trust_score,\n                repetition_ratio=repetition_ratio,\n            )\n            if settlement.approved and settlement.realized_earnings > 0.0:\n                self._agent_ledger_earn(\n                    agent_id=record.agent_id,\n                    amount=Decimal(str(settlement.realized_earnings)),\n                    reference=f"agent-earnings:{record.clip_id}",\n                )\n            agent.wallet = self._refresh_wallet_projection(\n                agent, last_spend=0.0, last_earnings=settlement.realized_earnings\n            )\n            agent.save_state()\n'''
          if old_perf not in text:
              raise SystemExit("record_performance Agent Wallet mutation block not found")
          text = text.replace(old_perf, new_perf, 1)
          anchor = "    def close(self) -> None:\n        self._closed = True\n\n"
          helpers = '''    def _agent_ledger_balance(self, agent_id: str) -> Decimal:\n        if self.state_store is None:\n            return Decimal("0.0000")\n        with self.state_store.session_factory() as session:\n            return self.agent_ledger_service.balance(session, agent_id=agent_id, unit=LedgerUnit.COIN)\n\n    def _agent_ledger_spend(self, *, agent_id: str, amount: Decimal, reference: str) -> str:\n        if self.state_store is None:\n            raise RuntimeError("Agent ledger persistence is unavailable; refusing economic spend.")\n        with self.state_store.session_factory() as session:\n            sink = self.agent_ledger_service.wallet_service.ensure_platform_account(session, LedgerUnit.COIN)\n            transaction_id = self.agent_ledger_service.spend(\n                session,\n                agent_id=agent_id,\n                amount=amount,\n                funding_sink=sink,\n                reference=reference,\n                actor=None,\n                source_tag=LedgerSourceTag.AGENT_BOOST_SPEND,\n                idempotency_key=reference,\n            )\n            session.commit()\n            return transaction_id\n\n    def _agent_ledger_earn(self, *, agent_id: str, amount: Decimal, reference: str) -> str:\n        if self.state_store is None:\n            raise RuntimeError("Agent ledger persistence is unavailable; refusing economic earnings.")\n        with self.state_store.session_factory() as session:\n            source = self.agent_ledger_service.wallet_service.ensure_platform_account(session, LedgerUnit.COIN)\n            transaction_id = self.agent_ledger_service.earn(\n                session,\n                agent_id=agent_id,\n                amount=amount,\n                funding_source=source,\n                reference=reference,\n                actor=None,\n                source_tag=LedgerSourceTag.AGENT_PERFORMANCE_EARNINGS,\n                idempotency_key=reference,\n            )\n            session.commit()\n            return transaction_id\n\n    def _agent_ledger_total(self, agent_id: str, source_tag: LedgerSourceTag) -> Decimal:\n        if self.state_store is None:\n            return Decimal("0.0000")\n        with self.state_store.session_factory() as session:\n            return self.agent_ledger_service.tagged_total(session, agent_id=agent_id, source_tag=source_tag)\n\n    def _refresh_wallet_projection(\n        self, agent: CreatorAgent, *, last_spend: float, last_earnings: float\n    ) -> AgentWallet:\n        balance = self._agent_ledger_balance(agent.profile.identity.agent_id)\n        cumulative_earnings = self._agent_ledger_total(\n            agent.profile.identity.agent_id, LedgerSourceTag.AGENT_PERFORMANCE_EARNINGS\n        )\n        cumulative_spend = abs(\n            self._agent_ledger_total(agent.profile.identity.agent_id, LedgerSourceTag.AGENT_BOOST_SPEND)\n        )\n        roi = (cumulative_earnings - cumulative_spend) / cumulative_spend if cumulative_spend > 0 else cumulative_earnings\n        return AgentWallet(\n            balance=float(balance),\n            lifetime_earnings=float(cumulative_earnings),\n            boost_spend=float(cumulative_spend),\n            roi=round(float(roi), 4),\n            last_spend=float(last_spend),\n            last_earnings=float(last_earnings),\n            trust_score=agent.wallet.trust_score,\n            quality_score=agent.wallet.quality_score,\n            repetition_ratio=agent.wallet.repetition_ratio,\n            payout_eligible=agent.wallet.payout_eligible,\n            last_block_reason=agent.wallet.last_block_reason,\n        )\n\n'''
          if anchor not in text:
              raise SystemExit("AgentManager helper anchor not found")
          text = text.replace(anchor, helpers + anchor, 1)
          manager.write_text(text)

          state = Path("backend/app/agents/state_store.py")
          s = state.read_text()
          s = s.replace("from app.agents.learning_engine import AgentLearningState, AgentPerformanceSignal\n", "from app.agents.learning_engine import AgentLearningState, AgentPerformanceSignal\nfrom app.agents.ledger_service import AgentLedgerService\n", 1)
          s = s.replace("    AgentWalletRecord,\n)\n", "    AgentWalletRecord,\n)\nfrom app.models.wallet import LedgerSourceTag, LedgerUnit\n", 1)
          old_save = '''            wallet_record.balance = float(agent.wallet.balance)\n            wallet_record.lifetime_earnings = float(agent.wallet.lifetime_earnings)\n            wallet_record.boost_spend = float(agent.wallet.boost_spend)\n'''
          new_save = '''            ledger_service = AgentLedgerService()\n            ledger_account = ledger_service.get_or_create_account(session, agent_id=agent_id, unit=LedgerUnit.COIN)\n            ledger_balance = ledger_service.wallet_service.get_balance(session, ledger_account)\n            lifetime_earnings = ledger_service.tagged_total(\n                session, agent_id=agent_id, source_tag=LedgerSourceTag.AGENT_PERFORMANCE_EARNINGS\n            )\n            boost_spend = abs(\n                ledger_service.tagged_total(\n                    session, agent_id=agent_id, source_tag=LedgerSourceTag.AGENT_BOOST_SPEND\n                )\n            )\n            wallet_record.balance = float(ledger_balance)\n            wallet_record.lifetime_earnings = float(lifetime_earnings)\n            wallet_record.boost_spend = float(boost_spend)\n'''
          if old_save not in s:
              raise SystemExit("AgentStateStore save projection block not found")
          s = s.replace(old_save, new_save, 1)
          old_snapshot = '''        wallet_record = session.get(AgentWalletRecord, agent_id)\n        return AgentStateSnapshot(\n'''
          new_snapshot = '''        wallet_record = session.get(AgentWalletRecord, agent_id)\n        ledger_service = AgentLedgerService()\n        ledger_account = ledger_service.get_or_create_account(session, agent_id=agent_id, unit=LedgerUnit.COIN)\n        ledger_balance = ledger_service.wallet_service.get_balance(session, ledger_account)\n        lifetime_earnings = ledger_service.tagged_total(\n            session, agent_id=agent_id, source_tag=LedgerSourceTag.AGENT_PERFORMANCE_EARNINGS\n        )\n        boost_spend = abs(\n            ledger_service.tagged_total(\n                session, agent_id=agent_id, source_tag=LedgerSourceTag.AGENT_BOOST_SPEND\n            )\n        )\n        return AgentStateSnapshot(\n'''
          if old_snapshot not in s:
              raise SystemExit("AgentStateStore snapshot anchor not found")
          s = s.replace(old_snapshot, new_snapshot, 1)
          s = s.replace("                balance=float(wallet_record.balance if wallet_record is not None else 0.0),\n", "                balance=float(ledger_balance),\n", 1)
          s = s.replace("                lifetime_earnings=float(wallet_record.lifetime_earnings if wallet_record is not None else 0.0),\n", "                lifetime_earnings=float(lifetime_earnings),\n", 1)
          s = s.replace("                boost_spend=float(wallet_record.boost_spend if wallet_record is not None else 0.0),\n", "                boost_spend=float(boost_spend),\n", 1)
          state.write_text(s)

          hosted = Path("backend/app/hosted_competition_engine/coin_aware_service.py")
          h = hosted.read_text()
          old_hosted = '''        if mode is CompetitionFundingMode.FANCOIN_ENTRY_POOL:\n            return super().create_competition(\n                host=host,\n                payload=payload,\n                created_by_admin=created_by_admin,\n                gtex_hosted=gtex_hosted,\n            )\n'''
          new_hosted = '''        if mode is CompetitionFundingMode.FANCOIN_ENTRY_POOL:\n            competition, template, host_participation_created = super().create_competition(\n                host=host,\n                payload=payload,\n                created_by_admin=created_by_admin,\n                gtex_hosted=gtex_hosted,\n            )\n            metadata = dict(competition.metadata_json or {})\n            metadata["funding_mode"] = mode.value\n            metadata["platform_fee_bps"] = self._active_platform_fee_bps()\n            metadata["platform_fee_policy_frozen"] = True\n            competition.funding_mode = mode\n            competition.metadata_json = metadata\n            self.session.flush()\n            return competition, template, host_participation_created\n'''
          if old_hosted not in h:
              raise SystemExit("CoinAware FanCoin delegation block not found")
          hosted.write_text(h.replace(old_hosted, new_hosted, 1))
          PY
          python -m black backend/app/agents/agent_manager.py backend/app/agents/ledger_service.py backend/app/agents/state_store.py backend/app/hosted_competition_engine/coin_aware_service.py backend/app/models/wallet.py
          python -m ruff check --fix --no-cache backend/app/agents/agent_manager.py backend/app/agents/ledger_service.py backend/app/agents/state_store.py backend/app/hosted_competition_engine/coin_aware_service.py backend/app/models/wallet.py
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/agents backend/app/hosted_competition_engine/coin_aware_service.py backend/app/models/wallet.py
          git commit -m "feat(phase-a): make Agent Wallet ledger-authoritative"
          git push origin HEAD:phase/a-economic-foundation
  quality-gates:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      NODE_ENV: production
      QUALITY_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      QUALITY_HEAD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements.txt black ruff detect-secrets
      - run: python tools/check_python_runtime_alignment.py
      - run: python tools/audit/generate_api_contract_bindings.py
      - run: python tools/audit/check_api_contract_violations.py
      - run: python tools/audit/reality_audit.py
      - run: python frontend/tool/audit_dependency_graph.py
      - run: python tools/quality/run_changed_quality.py --base "$QUALITY_BASE_SHA" --head "$QUALITY_HEAD_SHA"
        shell: bash
