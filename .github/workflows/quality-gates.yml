name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      NODE_ENV: production
      QUALITY_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      QUALITY_HEAD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements.lock
      - run: python -m pip install black ruff detect-secrets
      - name: Set up uv
        id: setup_uv
        uses: astral-sh/setup-uv@v5
        continue-on-error: true
      - name: Install uv from PyPI if the release download is unavailable
        if: steps.setup_uv.outcome == 'failure'
        run: python -m pip install --upgrade uv
      - name: Verify requirements.lock is in sync with requirements.txt
        run: |
          cp backend/requirements.lock /tmp/requirements.lock
          uv pip compile backend/requirements.txt \
            --python-version 3.14 \
            --python-platform x86_64-unknown-linux-gnu \
            --generate-hashes \
            -o /tmp/requirements.lock
          diff \
            <(grep -E '^[A-Za-z0-9_.-]+==' backend/requirements.lock | sort) \
            <(grep -E '^[A-Za-z0-9_.-]+==' /tmp/requirements.lock | sort)
      - run: python tools/check_python_runtime_alignment.py
      - name: Validate cinematic gift video installer syntax
        run: python -m py_compile tools/install_gtex_gift_video_assets.py
      - run: python tools/audit/generate_contract_audit.py
      - run: python tools/audit/generate_api_contract_bindings.py
      - run: python tools/audit/check_api_contract_violations.py
      - run: python tools/audit/reality_audit.py
      - run: python frontend/tool/audit_dependency_graph.py
      - run: python backend/scripts/audit_final_platform_release.py
      - run: python backend/scripts/audit_group6_production_readiness.py
      - run: python tools/quality/run_changed_quality.py --base "$QUALITY_BASE_SHA" --head "$QUALITY_HEAD_SHA"
        shell: bash
