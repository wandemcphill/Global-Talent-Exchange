name: React WebGL Operations Centre Verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: react-webgl-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  react-webgl-verification:
    name: React WebGL operations-centre verification
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install playwright pytest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/react-shell/package-lock.json

      - name: Build React production bundle
        working-directory: frontend/react-shell
        env:
          CI: "false"
          NODE_OPTIONS: "--openssl-legacy-provider"
          PUBLIC_URL: "/console"
          REACT_APP_BACKEND_URL: "https://gtex-api-2gtu.onrender.com"
          GTE_API_BASE_URL: "https://gtex-api-2gtu.onrender.com"
        run: |
          npm ci --legacy-peer-deps --include=dev
          npm run build

      - name: Install Playwright browser dependencies
        run: python -m playwright install --with-deps chromium

      - name: Run React WebGL operations-centre verification
        run: python tools/verify_react_webgl_operations_centre.py

      - name: Run React WebGL verification unit & contract tests
        run: python -m pytest backend/tests/tools/test_verify_react_webgl_operations_centre.py -v
