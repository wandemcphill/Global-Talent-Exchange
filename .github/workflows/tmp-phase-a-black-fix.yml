name: Temporary Phase A Black Fix

on:
  push:
    branches:
      - tmp/phase-a-black-diff

permissions:
  contents: write

jobs:
  black-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -r backend/requirements.txt black
      - run: >
          python -m black
          backend/app/economy/competition_funding_policy.py
          backend/app/economy/conversion_service.py
          backend/app/models/economic_conversion.py
          backend/app/models/gift_transaction.py
          backend/migrations/versions/20260821_0108_gift_currency_semantics.py
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/economy/competition_funding_policy.py backend/app/economy/conversion_service.py backend/app/models/economic_conversion.py backend/app/models/gift_transaction.py backend/migrations/versions/20260821_0108_gift_currency_semantics.py
          git commit -m "style: apply black formatting to phase A economics"
          git push
