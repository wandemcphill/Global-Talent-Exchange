name: P7-FEV formatter

on:
  push:
    branches:
      - p7-fev-current-main-verification

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p7-fev-current-main-verification
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format P7-FEV JavaScript
        run: |
          npx prettier --write             qa/playwright/tests/helpers.mjs             qa/playwright/tests/p7_fe_audio_shell.spec.mjs             qa/playwright/tests/p7_fe_authed_shell.spec.mjs             qa/playwright/tests/p7_fe_club_squad.spec.mjs             qa/playwright/tests/p7_fe_competition_match.spec.mjs             qa/playwright/tests/p7_fe_extended.spec.mjs             qa/playwright/tests/p7_fe_market_portfolio.spec.mjs
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Formatting already clean."
            exit 0
          fi
          git add             qa/playwright/tests/helpers.mjs             qa/playwright/tests/p7_fe_audio_shell.spec.mjs             qa/playwright/tests/p7_fe_authed_shell.spec.mjs             qa/playwright/tests/p7_fe_club_squad.spec.mjs             qa/playwright/tests/p7_fe_competition_match.spec.mjs             qa/playwright/tests/p7_fe_extended.spec.mjs             qa/playwright/tests/p7_fe_market_portfolio.spec.mjs
          git commit -m "style(p7-fev): format Playwright verification files"
          git push origin HEAD:p7-fev-current-main-verification
