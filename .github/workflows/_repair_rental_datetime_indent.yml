name: One-shot rental datetime formatting repair

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acceptance/gtex-full-user-journey-20260915
          fetch-depth: 1

      - name: Normalize production block formatting and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          path = Path("backend/app/national_team_engine/tournament_service.py")
          text = path.read_text(encoding="utf-8")

          future_pattern = re.compile(
              r"(?ms)^[ \\t]*@staticmethod\\n"
              r"[ \\t]*def _coerce_datetime_pair\\(.*?"
              r"(?=^[ \\t]*@staticmethod\\n[ \\t]*def _parse_datetime\\()"
          )
          match = future_pattern.search(text)
          if match is None:
              raise SystemExit("malformed rental datetime helper block not found")
          replacement = textwrap.dedent('''
              @staticmethod
              def _coerce_datetime_pair(
                  value: datetime, *, now: datetime
              ) -> tuple[datetime, datetime]:
                  if value.tzinfo is None and now.tzinfo is not None:
                      now = now.replace(tzinfo=None)
                  if value.tzinfo is not None and now.tzinfo is None:
                      value = value.replace(tzinfo=None)
                  return value, now

              @staticmethod
              def _is_future_datetime(value: datetime | None, *, now: datetime | None = None) -> bool:
                  if value is None:
                      return False
                  reference = now or utcnow()
                  value, reference = NationalTeamTournamentService._coerce_datetime_pair(value, now=reference)
                  return value > reference

              @staticmethod
              def _is_past_datetime(value: datetime | None, *, now: datetime | None = None) -> bool:
                  if value is None:
                      return False
                  reference = now or utcnow()
                  value, reference = NationalTeamTournamentService._coerce_datetime_pair(value, now=reference)
                  return value < reference

          ''')
          text = text[:match.start()] + replacement + text[match.end():]

          lock_pattern = re.compile(
              r"(?ms)^[ \\t]*def _rental_tournament_lock_reason\(self, competition: NationalTeamCompetition\) -> str \\| None:\\n"
              r".*?(?=^[ \\t]*@staticmethod\\n[ \\t]*def _pool_metadata\()"
          )
          lock_match = lock_pattern.search(text)
          if lock_match is None:
              raise SystemExit("malformed rental lock block not found")
          lock_replacement = textwrap.dedent('''
              def _rental_tournament_lock_reason(self, competition: NationalTeamCompetition) -> str | None:
                  now = utcnow()
                  if competition.entry_opens_at is not None and self._is_future_datetime(competition.entry_opens_at, now=now):
                      return "competition_entry_not_open"
                  if competition.entry_closes_at is not None and self._is_past_datetime(competition.entry_closes_at, now=now):
                      return "competition_entry_closed"
                  if str(competition.status).strip().lower() == "live":
                      return "competition_already_live"
                  if competition.kickoff_at is not None and not self._is_future_datetime(competition.kickoff_at, now=now):
                      return "competition_already_live"
                  if competition.linked_competition_id:
                      try:
                          CompetitionLockService(self.session).ensure_rentals_allowed(
                              competition_id=competition.linked_competition_id
                          )
                      except CompetitionLockError:
                          return "competition_already_live"
                  if competition.completed_at is not None:
                      return "competition_completed"
                  return None

          ''')
          text = text[:lock_match.start()] + lock_replacement + text[lock_match.end():]
          path.write_text(text, encoding="utf-8")

          compile_check = __import__("subprocess").run(
              ["python", "-m", "py_compile", str(path)],
              capture_output=True,
              text=True,
          )
          if compile_check.returncode != 0:
              raise SystemExit(compile_check.stderr or compile_check.stdout)

          for token in (
              "def _coerce_datetime_pair(",
              "def _is_past_datetime(",
              "self._is_past_datetime(competition.entry_closes_at, now=now)",
              "not self._is_future_datetime(competition.kickoff_at, now=now)",
          ):
              if token not in text:
                  raise SystemExit(f"expected production token missing: {token}")

          Path(".github/workflows/_repair_rental_datetime_indent.yml").unlink()
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/national_team_engine/tournament_service.py .github/workflows/_repair_rental_datetime_indent.yml
          git commit -m 'fix(national-team): normalize rental datetime formatting'
          git push origin HEAD:acceptance/gtex-full-user-journey-20260915
