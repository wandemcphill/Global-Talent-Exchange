name: GTEX shot decision repair

on:
  push:
    branches: [fix/gtex-shot-decision]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/gtex-shot-decision
      - name: Patch shot decision
        shell: bash
        run: |
          set -euo pipefail
          FILE="Gtex_Test_Migration/Assets/Code/GTEX/Simulation/GtexSimSpatialSynthesizer.cs"
          line=$(grep -n 'shotCorridor' "$FILE" | head -1 | cut -d: -f1)
          test -n "$line"
          end=$((line + 10))
          sed -i "${line},${end}s/action = \"carry\";/action = \"shoot\";/" "$FILE"
          start=$(grep -n 'private void ApplyDecisionPlan' "$FILE" | head -1 | cut -d: -f1)
          carry=$(grep -n 'if (plan.Action == \"carry\")' "$FILE" | awk -F: -v s="$start" '$1 > s {print $1; exit}')
          test -n "$start"
          test -n "$carry"
          sed -i "${carry}i\\            if (plan.Action == \"shoot\")\\n            {\\n                var shotTarget = ResolveGoalMouthTarget(source.TeamSide, false);\\n                RegisterEvent(\"shot\", currentMinute, source.TeamSide, \"Shot on goal.\", 0, 0, source.PlayerId);\\n                StartTransit(\\n                    source.PlayerId,\\n                    shotTarget,\\n                    currentMinute,\\n                    ShotDurationMinutes,\\n                    1.0f,\\n                    \"shot\",\\n                    OppositeSide(source.TeamSide) + \"-1\",\\n                    OppositeSide(source.TeamSide));\\n                currentDecision = default;\\n                nextDecisionMinute = currentMinute + 0.26f;\\n                currentCameraPreset = \"broadcast\";\\n                currentCameraPresetUntilMinute = currentMinute + 0.24f;\\n                return;\\n            }\\n" "$FILE"
          git diff --check
          git diff -- "$FILE"
          rm Gtex_Test_Migration/Assets/Code/GTEX/Simulation/README_shot_repair.md
          rm .github/workflows/gtex_shot_decision_repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git add -u .github/workflows/gtex_shot_decision_repair.yml Gtex_Test_Migration/Assets/Code/GTEX/Simulation/README_shot_repair.md
          git commit -m "fix(gtex): execute shot decisions in shipped simulator"
          git push origin HEAD:fix/gtex-shot-decision
