name: GTEX shot decision repair

on:
  push:
    branches: [fix/gtex-shot-decision]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/gtex-shot-decision
      - name: Patch shot decision
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("Gtex_Test_Migration/Assets/Code/GTEX/Simulation/GtexSimSpatialSynthesizer.cs")
          lines = p.read_text(encoding="utf-8").splitlines(True)

          in_plan = False
          shot_fixed = False
          for i, line in enumerate(lines):
              if "private DecisionPlan BuildDecisionPlan" in line:
                  in_plan = True
              if in_plan and "shotCorridor" in line:
                  for j in range(i, min(i + 8, len(lines))):
                      if 'action = "carry";' in lines[j]:
                          lines[j] = lines[j].replace('action = "carry";', 'action = "shoot";')
                          shot_fixed = True
                          break
                  in_plan = False
                  break

          if not shot_fixed:
              raise SystemExit("shot decision assignment not found")

          text = "".join(lines)
          if 'if (plan.Action == "shoot")' not in text:
              marker = '        private void ApplyDecisionPlan(DecisionPlan plan, float currentMinute)\n'
              start = text.find(marker)
              if start < 0:
                  raise SystemExit("ApplyDecisionPlan not found")
              carry_marker = '            if (plan.Action == "carry")\n'
              carry_index = text.find(carry_marker, start)
              if carry_index < 0:
                  raise SystemExit("carry action branch not found")
              shot_branch = '''            if (plan.Action == "shoot")
            {
                var shotTarget = ResolveGoalMouthTarget(source.TeamSide, false);
                RegisterEvent("shot", currentMinute, source.TeamSide, "Shot on goal.", 0, 0, source.PlayerId);
                StartTransit(
                    source.PlayerId,
                    shotTarget,
                    currentMinute,
                    ShotDurationMinutes,
                    1.0f,
                    "shot",
                    OppositeSide(source.TeamSide) + "-1",
                    OppositeSide(source.TeamSide));
                currentDecision = default;
                nextDecisionMinute = currentMinute + 0.26f;
                currentCameraPreset = "broadcast";
                currentCameraPresetUntilMinute = currentMinute + 0.24f;
                return;
            }

'''
              text = text[:carry_index] + shot_branch + text[carry_index:]

          p.write_text(text, encoding="utf-8")
          PY
          rm Gtex_Test_Migration/Assets/Code/GTEX/Simulation/README_shot_repair.md
          rm .github/workflows/gtex_shot_decision_repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Gtex_Test_Migration/Assets/Code/GTEX/Simulation/GtexSimSpatialSynthesizer.cs
          git add -u .github/workflows/gtex_shot_decision_repair.yml Gtex_Test_Migration/Assets/Code/GTEX/Simulation/README_shot_repair.md
          git commit -m "fix(gtex): execute shot decisions in shipped simulator"
          git push origin HEAD:fix/gtex-shot-decision
