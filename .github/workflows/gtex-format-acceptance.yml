name: GTEX Acceptance Formatter

on:
  push:
    branches:
      - acceptance/gtex-full-user-journey-20260915

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - run: python -m pip install black==26.5.1
      - run: python -m black backend/tests/acceptance/test_gtex_full_user_journey.py tools/audit/check_api_contract_violations.py

      - name: Commit formatter output and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/gtex-format-acceptance.yml
          if git diff --cached --quiet; then
            echo "No formatter changes detected."
            exit 0
          fi
          git add backend/tests/acceptance/test_gtex_full_user_journey.py tools/audit/check_api_contract_violations.py
          git commit -m "style(acceptance): apply Black formatting [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
