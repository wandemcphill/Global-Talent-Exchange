name: Temporary fix reality audit render host

on:
  push:
    branches:
      - phase/b-production-hardening

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harden Render config parsing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/audit/reality_audit.py')
          s = p.read_text()
          start = s.index('def _render_config_failures() -> list[str]:')
          end = s.index('\ndef _frontend_dependency_failures()', start)
          replacement = '''def _render_config_failures() -> list[str]:
    render = _read("render.yaml")
    failures: list[str] = []
    env_blocks = {}
    lines = render.splitlines()
    current_service = None
    current_key = None
    current_block = []
    for line in lines + ["__END__"]:
        service_match = re.match(r"^  - name:\s*(.+)$", line)
        key_match = re.match(r"^      - key:\s*([^\\s]+)\\s*$", line)
        if service_match:
            if current_service and current_key:
                env_blocks[(current_service, current_key)] = "\\n".join(current_block)
            current_service = service_match.group(1).strip()
            current_key = None
            current_block = []
            continue
        if key_match:
            if current_service and current_key:
                env_blocks[(current_service, current_key)] = "\\n".join(current_block)
            current_key = key_match.group(1)
            current_block = [line]
            continue
        if current_key:
            current_block.append(line)

    def service_block(service: str, key: str) -> str:
        return env_blocks.get((service, key), "")

    for key in (*KORAPAY_SECRET_ENV_KEYS, *TREASURY_SECRET_ENV_KEYS):
        block = service_block("gtex-api", key)
        if not block:
            failures.append(f"render.yaml is missing secret env declaration for {key}.")
            continue
        if "sync: false" not in block:
            failures.append(f"render.yaml must keep {key} env-only with sync: false.")
        if re.search(r"^\\s+value:", block, re.MULTILINE):
            failures.append(f"render.yaml must not hard-code a value for secret env {key}.")

    notification_block = service_block("gtex-api", "GTE_KORAPAY_NOTIFICATION_URL")
    if "https://gtex-api-opea.onrender.com/integrations/payments/korapay/webhook" not in notification_block:
        failures.append("render.yaml is missing the production KoraPay notification URL.")
    paystack_block = service_block("gtex-api", "GTE_ENABLE_PAYSTACK")
    if 'value: "false"' not in paystack_block and "value: false" not in paystack_block:
        failures.append("render.yaml does not explicitly disable Paystack.")
    api_base_block = service_block("gtex-web", "GTE_API_BASE_URL")
    if "https://gtex-api-opea.onrender.com" not in api_base_block:
        failures.append("render.yaml gtex-web service does not point at the live API base URL.")
    backend_mode_block = service_block("gtex-web", "GTE_BACKEND_MODE")
    if "value: live" not in backend_mode_block and "value: strict_live" not in backend_mode_block:
        failures.append("render.yaml gtex-web service does not force live backend mode.")
    return failures
'''
          p.write_text(s[:start] + replacement + s[end:])
          PY
      - name: Verify and commit permanent audit fix
        run: |
          python -m py_compile tools/audit/reality_audit.py
          grep -q 'https://gtex-api-opea.onrender.com/integrations/payments/korapay/webhook' render.yaml
          grep -q 'https://gtex-api-opea.onrender.com' render.yaml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/audit/reality_audit.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: make render reality audit validate service env blocks'
          git push
