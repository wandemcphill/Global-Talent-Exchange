name: _tmp GTEX acceptance runtime

on:
  push:
    branches:
      - acceptance/gtex-full-user-journey-20260915

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements.txt pytest
      - name: Exact GTEX acceptance command
        run: python -m pytest backend/tests/acceptance/test_gtex_full_user_journey.py -q
