name: Temporary Phase A Hosted Freeze

on:
  push:
    branches:
      - phase/a-economic-foundation

permissions:
  contents: write

jobs:
  hosted-freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -r backend/requirements.txt black ruff pytest
      - name: Freeze FanCoin hosted competition fee at creation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/app/hosted_competition_engine/coin_aware_service.py")
          text = path.read_text()
          old = '''        if mode is CompetitionFundingMode.FANCOIN_ENTRY_POOL:\n            return super().create_competition(\n                host=host,\n                payload=payload,\n                created_by_admin=created_by_admin,\n                gtex_hosted=gtex_hosted,\n            )\n'''
          new = '''        if mode is CompetitionFundingMode.FANCOIN_ENTRY_POOL:\n            competition, template, host_participation_created = super().create_competition(\n                host=host,\n                payload=payload,\n                created_by_admin=created_by_admin,\n                gtex_hosted=gtex_hosted,\n            )\n            metadata = dict(competition.metadata_json or {})\n            metadata["funding_mode"] = mode.value\n            metadata["platform_fee_bps"] = self._active_platform_fee_bps()\n            metadata["platform_fee_policy_frozen"] = True\n            competition.funding_mode = mode\n            competition.metadata_json = metadata\n            self.session.flush()\n            return competition, template, host_participation_created\n'''
          if old not in text:
              raise SystemExit("FanCoin delegation block not found")
          path.write_text(text.replace(old, new, 1))
          PY
          python -m black backend/app/hosted_competition_engine/coin_aware_service.py
          python -m ruff check --fix --no-cache backend/app/hosted_competition_engine/coin_aware_service.py
          cat >> backend/tests/hosted_competition_engine/test_coin_aware_service.py <<'PY'

          def test_fancoin_funding_mode_freezes_admin_fee_at_creation() -> None:
              session = MagicMock()
              wallet = MagicMock()
              service = CoinAwareHostedCompetitionService(session=session, wallet_service=wallet)
              service.get_template_by_key = MagicMock(
                  return_value=SimpleNamespace(id="template-1", is_user_hostable=True, participants=8)
              )
              service._active_platform_fee_bps = MagicMock(side_effect=[3000, 3000])
              service._metadata_with_join_rules = MagicMock(return_value={})
              service._create_entry_participant = MagicMock(return_value=SimpleNamespace())
              service._collect_entry_fee = MagicMock()
              service._normalize_amount = lambda value: Decimal(str(value)).quantize(Decimal("0.0001"))
              payload = SimpleNamespace(
                  funding_mode="fancoin_entry_pool",
                  template_key="user-hosted-cup-8",
                  title="Fan Cup",
                  description="",
                  slug="fan-cup",
                  visibility="public",
                  starts_at=None,
                  lock_at=None,
                  max_participants=8,
                  entry_fee_fancoin=Decimal("100.0000"),
                  reward_pool_fancoin=Decimal("560.0000"),
                  metadata_json={},
                  join_passcode=None,
              )
              host = SimpleNamespace(id="host-1")
              competition, _, _ = service.create_competition(host=host, payload=payload)
              assert competition.funding_mode.value == "fancoin_entry_pool"
              assert competition.metadata_json["platform_fee_bps"] == 3000
              assert competition.metadata_json["platform_fee_policy_frozen"] is True
          PY
          python -m black backend/tests/hosted_competition_engine/test_coin_aware_service.py
          python -m ruff check --fix --no-cache backend/tests/hosted_competition_engine/test_coin_aware_service.py
          python -m pytest backend/tests/hosted_competition_engine/test_coin_aware_service.py backend/tests/economy/test_hosted_competition_funding_contract.py backend/tests/economy/test_hosted_competition_coin_escrow.py backend/tests/economy/test_hosted_competition_fee_fail_closed.py -q
      - name: Commit hosted competition hardening
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/hosted_competition_engine/coin_aware_service.py backend/tests/hosted_competition_engine/test_coin_aware_service.py
          git commit -m "fix(hosted-competitions): freeze participant-funded fee policy"
          git push