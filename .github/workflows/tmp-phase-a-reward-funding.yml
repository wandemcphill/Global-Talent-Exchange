name: Temporary Phase A Reward Funding Guard

on:
  push:
    branches:
      - phase/a-economic-foundation

permissions:
  contents: write

jobs:
  guard-agent-rewards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -r backend/requirements.txt black ruff pytest
      - name: Patch reward funding and add invariant test
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("backend/app/agents/agent_manager.py")
          s = p.read_text()
          old = 'source = self.agent_ledger_service.wallet_service.ensure_platform_account(session, LedgerUnit.COIN)'
          new = 'source = self.agent_ledger_service.wallet_service.ensure_rewards_pool_account(session, LedgerUnit.COIN)'
          if old not in s:
              raise SystemExit("Agent earnings funding source not found")
          p.write_text(s.replace(old, new, 1))
          PY
          python -m black backend/app/agents/agent_manager.py
          python -m ruff check --fix --no-cache backend/app/agents/agent_manager.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/agents/agent_manager.py
          git commit -m "fix(agents): fund performance rewards from non-negative pool"
          git push origin HEAD:phase/a-economic-foundation
      - name: Verify Agent ledger safety and Phase A economics
        run: |
          python -m pytest backend/tests/agents/test_agent_ledger_service.py backend/tests/agents/test_agent_state_store_fail_closed.py backend/tests/agents/test_agent_wallet_economic_safety.py backend/tests/economy/test_economic_conversion_service.py backend/tests/economy/test_hosted_competition_coin_escrow.py backend/tests/economy/test_hosted_competition_funding_contract.py backend/tests/economy/test_withdrawal_currency_guard.py backend/tests/treasury/test_commission_policy.py -q