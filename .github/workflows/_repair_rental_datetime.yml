name: Temporary rental datetime repair

on:
  push:
    branches:
      - acceptance/gtex-full-user-journey-20260915

permissions:
  contents: write

jobs:
  repair:
    if: github.ref == 'refs/heads/acceptance/gtex-full-user-journey-20260915'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Patch canonical rental datetime comparisons
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/app/national_team_engine/tournament_service.py")
          text = path.read_text(encoding="utf-8")

          old = '''    @staticmethod
    def _is_future_datetime(value: datetime | None, *, now: datetime | None = None) -> bool:
        if value is None:
            return False
        reference = now or utcnow()
        if value.tzinfo is None and reference.tzinfo is not None:
            reference = reference.replace(tzinfo=None)
        if value.tzinfo is not None and reference.tzinfo is None:
            value = value.replace(tzinfo=None)
        return value > reference
'''

          new = '''    @staticmethod
    def _coerce_datetime_pair(
        value: datetime, *, now: datetime
    ) -> tuple[datetime, datetime]:
        if value.tzinfo is None and now.tzinfo is not None:
            now = now.replace(tzinfo=None)
        if value.tzinfo is not None and now.tzinfo is None:
            value = value.replace(tzinfo=None)
        return value, now

    @staticmethod
    def _is_future_datetime(value: datetime | None, *, now: datetime | None = None) -> bool:
        if value is None:
            return False
        reference = now or utcnow()
        value, reference = NationalTeamTournamentService._coerce_datetime_pair(value, now=reference)
        return value > reference

    @staticmethod
    def _is_past_datetime(value: datetime | None, *, now: datetime | None = None) -> bool:
        if value is None:
            return False
        reference = now or utcnow()
        value, reference = NationalTeamTournamentService._coerce_datetime_pair(value, now=reference)
        return value < reference
'''

          if old not in text:
              raise SystemExit("expected _is_future_datetime block not found")
          text = text.replace(old, new, 1)

          old_lock = '''    def _rental_tournament_lock_reason(self, competition: NationalTeamCompetition) -> str | None:
        now = utcnow()
        if competition.entry_opens_at is not None and competition.entry_opens_at > now:
            return "competition_entry_not_open"
        if competition.entry_closes_at is not None and competition.entry_closes_at < now:
            return "competition_entry_closed"
        if str(competition.status).strip().lower() == "live":
            return "competition_already_live"
        if competition.kickoff_at is not None and competition.kickoff_at <= now:
            return "competition_already_live"
'''

          new_lock = '''    def _rental_tournament_lock_reason(self, competition: NationalTeamCompetition) -> str | None:
        now = utcnow()
        if competition.entry_opens_at is not None and self._is_future_datetime(competition.entry_opens_at, now=now):
            return "competition_entry_not_open"
        if competition.entry_closes_at is not None and self._is_past_datetime(competition.entry_closes_at, now=now):
            return "competition_entry_closed"
        if str(competition.status).strip().lower() == "live":
            return "competition_already_live"
        if competition.kickoff_at is not None and not self._is_future_datetime(competition.kickoff_at, now=now):
            return "competition_already_live"
'''

          if old_lock not in text:
              raise SystemExit("expected rental lock block not found")
          text = text.replace(old_lock, new_lock, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Run exact acceptance journey
        run: python -m pytest backend/tests/acceptance/test_gtex_full_user_journey.py -q

      - name: Commit repair and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/_repair_rental_datetime.yml
          git add backend/app/national_team_engine/tournament_service.py .github/workflows/_repair_rental_datetime.yml
          git commit -m 'fix(national-team): normalize rental window datetimes'
          git push origin HEAD:acceptance/gtex-full-user-journey-20260915
