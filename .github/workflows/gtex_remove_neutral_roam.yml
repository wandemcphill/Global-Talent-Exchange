name: GTEX remove neutral player roam
on:
  push:
    branches: [fix/gtex-remove-neutral-roam]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/gtex-remove-neutral-roam
      - name: Patch neutral roam
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("Gtex_Test_Migration/Assets/Code/GTEX/Simulation/GtexSimSpatialSynthesizer.cs")
          text = p.read_text(encoding="utf-8")
          old = '''                var roamX = Mathf.Sin(currentMinute * 0.41f + index * 0.67f) * (player.Role == "GK" ? 0.12f : 0.38f);\n                var roamZ = Mathf.Cos(currentMinute * 0.53f + index * 0.49f) * (player.Role == "GK" ? 0.38f : 1.0f);\n                var targetPosition = ClampToPitch(anchor + new Vector3(possessionShift + roamX, 0f, roamZ));'''
          new = '''                var roamX = 0f;\n                var roamZ = 0f;\n                var targetPosition = ClampToPitch(anchor + new Vector3(possessionShift + roamX, 0f, roamZ));'''
          if old not in text:
              raise SystemExit("neutral roam block not found")
          p.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Remove workflow and commit
        run: |
          rm .github/workflows/gtex_remove_neutral_roam.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Gtex_Test_Migration/Assets/Code/GTEX/Simulation/GtexSimSpatialSynthesizer.cs
          git add -u .github/workflows/gtex_remove_neutral_roam.yml
          git commit -m "fix(gtex): remove neutral player drift"
          git push origin HEAD:fix/gtex-remove-neutral-roam
