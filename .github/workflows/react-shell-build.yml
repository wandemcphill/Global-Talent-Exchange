name: GTEX React shell build

on:
  pull_request:
    paths:
      - "frontend/react-shell/**"
      - ".github/workflows/react-shell-build.yml"
  push:
    branches: [main]
    paths:
      - "frontend/react-shell/**"
      - ".github/workflows/react-shell-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/react-shell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Build React shell
        env:
          CI: "false"
          NODE_OPTIONS: "--openssl-legacy-provider"
          REACT_APP_BACKEND_URL: "https://gtex-api-opea.onrender.com"
        run: npm run build
