name: Temporary GTEX 3D playback migration runner

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.head.ref == 'fix/gtex-authoritative-3d-playback' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: fix/gtex-authoritative-3d-playback
          fetch-depth: 0

      - name: Apply authoritative playback migration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/apply_gtex_authoritative_playback_fix_v2.py')
          if p.exists():
              s = p.read_text(encoding='utf-8')
              s = '\n'.join(line for line in s.splitlines() if "assert m and 'ResolveBehaviorDrivenFieldPosition' not in m.group(0)" not in line) + '\n'
              p.write_text(s, encoding='utf-8')
          else:
              raise SystemExit('migration patcher missing from PR branch')
          PY
          python3 tools/apply_gtex_authoritative_playback_fix_v2.py

      - name: Finalize source migration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          ROOT = Path.cwd()

          def replace_method(text, pattern, replacement):
              m = re.search(pattern, text, re.MULTILINE)
              if not m:
                  raise SystemExit(f'method not found: {pattern}')
              start = m.start()
              brace = text.find('{', m.end())
              depth = 0
              for i in range(brace, len(text)):
                  if text[i] == '{': depth += 1
                  elif text[i] == '}':
                      depth -= 1
                      if depth == 0:
                          return text[:start] + replacement.rstrip() + text[i+1:]
              raise SystemExit(f'closing brace not found: {pattern}')

          runtime_path = ROOT / 'Gtex_Test_Migration/Assets/Code/GTEX/GtexMatchRuntime.cs'
          runtime = runtime_path.read_text(encoding='utf-8')
          marker = '''        private void TryTriggerLiveBallAction(MatchResponse previousState, MatchResponse nextState)\n        {\n            var liveBallEvent ='''
          replacement = '''        private void TryTriggerLiveBallAction(MatchResponse previousState, MatchResponse nextState)\n        {\n            if (previousState == null || nextState == null || previousState.ballPosition == null || nextState.ballPosition == null)\n            {\n                return;\n            }\n\n            var liveBallEvent ='''
          runtime = runtime.replace(marker, replacement, 1)
          runtime = replace_method(runtime, r'\s*private void DriveBall\(', '''        private void DriveBall()\n        {\n            if (currentState == null || currentState.ballPosition == null || !GtexMatchController.BallAdapter.IsAvailable)\n            {\n                ClearSyntheticBallTransit();\n                hasFilteredBallTarget = false;\n                runtimeTraceBallSpeed = 0f;\n                return;\n            }\n\n            var ballHolder = ResolveBallHolder(currentState.ballPosition);\n            var ballConversion = ConvertIncomingPlaybackPosition(currentState.ballPosition, currentState);\n            var suppressBoundaryMotion = ShouldSuppressBoundaryMotion(currentState);\n            var authoritativeTarget = ballHolder != null || suppressBoundaryMotion\n                ? ballConversion.ClampedWorld\n                : ResolvePredictedFieldPosition(currentState.ballPosition, ResolveLivePredictionSeconds());\n            var ballVelocity = ResolvePlaybackBallVelocity(currentState.ballPosition, suppressBoundaryMotion);\n            runtimeTraceBallSpeed = new Vector3(ballVelocity.x, 0f, ballVelocity.z).magnitude;\n            var desiredPosition = authoritativeTarget;\n\n            if (ballHolder == null && !suppressBoundaryMotion)\n            {\n                var currentBallPosition = GtexMatchController.BallAdapter.Position;\n                var distance = Vector3.Distance(currentBallPosition, authoritativeTarget);\n                if (distance > 0.01f)\n                {\n                    var shotLike = IsShotLikeEventType(ResolveActiveEventTypeToken());\n                    var minSpeed = shotLike ? 5f : 4f;\n                    var maxSpeed = shotLike ? LiveBallPlaybackMaxShotSpeed : LiveBallPlaybackMaxPassSpeed;\n                    var velocitySpeed = new Vector3(ballVelocity.x, 0f, ballVelocity.z).magnitude;\n                    var presentationSpeed = Mathf.Min(maxSpeed, Mathf.Max(minSpeed, Mathf.Max(velocitySpeed, distance / 0.16f)));\n                    desiredPosition = Vector3.MoveTowards(currentBallPosition, authoritativeTarget, presentationSpeed * Mathf.Max(Time.deltaTime, LiveTraceDtFloorSeconds));\n                }\n            }\n\n            desiredPosition = ClampToFieldBounds(desiredPosition, true);\n            GtexMatchController.BallAdapter.ApplyExternalState(desiredPosition, ballVelocity, ballHolder);\n        }\n''')

          camera_path = ROOT / 'Gtex_Test_Migration/Assets/Code/MatchEngine/Camera/CameraSystem.cs'
          camera = camera_path.read_text(encoding='utf-8-sig')
          camera = replace_method(camera, r'\s*private void Update\(\)', '''        private void Update()\n        {\n            if (target == null && Ball.Current != null) target = Ball.Current.transform;\n            if (target == null) return;\n            var dt = Mathf.Max(0.001f, Time.unscaledDeltaTime);\n            if (CurrentCamera == null) return;\n\n            if (IsBroadcastCamera && Ball.Current != null)\n            {\n                var focus = Ball.Current.transform.position;\n                var velocity = Ball.Current.Velocity;\n                velocity.y = 0f;\n                if (velocity.sqrMagnitude > 0.0001f)\n                    focus += Vector3.ClampMagnitude(velocity.normalized * broadcastLookAheadDistance, broadcastLookAheadDistance);\n                focus.x = Mathf.Clamp(focus.x, -45.5f, 45.5f);\n                focus.z = Mathf.Clamp(focus.z, -27f, 27f);\n                focus.y = 0.8f;\n                var desiredPosition = focus + new Vector3(0f, 34f, -43f);\n                var desiredRotation = Quaternion.LookRotation(focus - desiredPosition, Vector3.up);\n                const float broadcastFov = 46f;\n                if (instantTransitionInNextFrame)\n                {\n                    instantTransitionInNextFrame = false;\n                    transform.SetPositionAndRotation(desiredPosition, desiredRotation);\n                    camera.fieldOfView = broadcastFov;\n                }\n                else\n                {\n                    transform.position = Vector3.Lerp(transform.position, desiredPosition, Mathf.Clamp01(dt * broadcastPositionSpeed * 1.35f));\n                    transform.rotation = Quaternion.Slerp(transform.rotation, desiredRotation, Mathf.Clamp01(dt * broadcastRotationSpeed * 1.2f));\n                    camera.fieldOfView = Mathf.Lerp(camera.fieldOfView, broadcastFov, Mathf.Clamp01(dt * CameraZoomSpeed));\n                }\n                TargetPosition = null;\n                return;\n            }\n\n            var targetPos = TargetPosition ?? target.position;\n            var (position, rotation, zoom) = CurrentCamera.Behave(in dt, targetPos);\n            if (instantTransitionInNextFrame)\n            {\n                instantTransitionInNextFrame = false;\n                transform.position = position;\n                transform.rotation = rotation;\n                camera.fieldOfView = zoom / (ZoomMultiplier + 1);\n            }\n            else\n            {\n                transform.position = Vector3.Lerp(transform.position, position, Mathf.Clamp01(dt * CameraPositionSpeed));\n                transform.rotation = Quaternion.Lerp(transform.rotation, rotation, Mathf.Clamp01(dt * CameraRotationSpeed));\n                camera.fieldOfView = Mathf.Lerp(camera.fieldOfView, zoom / (ZoomMultiplier + 1), Mathf.Clamp01(dt * CameraZoomSpeed));\n            }\n        }\n''')
          camera_path.write_text(camera + '\n', encoding='utf-8')

          gk_path = ROOT / 'Gtex_Test_Migration/Assets/Code/GTEX/Engine/GtexGoalkeeperBehavior.cs'
          gk = gk_path.read_text(encoding='utf-8-sig')
          if 'using FStudio.GTEX.Core;' not in gk:
              gk = gk.replace('using FStudio.GTEX;\n', 'using FStudio.GTEX;\nusing FStudio.GTEX.Core;\n', 1)
          gk = gk.replace(
              '            if (GtexRuntimeFlags.IsOriginalVisualRuntime)\n',
              '            if (GtexRuntimeState.ActiveMode == GtexRuntimeMode.LivePlayback || GtexRuntimeFlags.IsOriginalVisualRuntime)\n',
              1)
          gk_path.write_text(gk + '\n', encoding='utf-8')

          subprocess.run(['git', 'checkout', 'origin/main', '--', 'README.md'], check=True)

          r = runtime_path.read_text(encoding='utf-8')
          p = (ROOT / 'Gtex_Test_Migration/Assets/Code/MatchEngine/Players/PlayerBase.cs').read_text(encoding='utf-8')
          b = (ROOT / 'Gtex_Test_Migration/Assets/Code/MatchEngine/Ball/Ball.cs').read_text(encoding='utf-8')
          c = camera_path.read_text(encoding='utf-8-sig')
          g = gk_path.read_text(encoding='utf-8-sig')
          phy = (ROOT / 'Gtex_Test_Migration/Assets/Code/GTEX/Engine/GtexPlaybackPhysicsUtil.cs').read_text(encoding='utf-8')
          assert '/api/v2/ws/match/' in r
          assert 'GtexRuntimeState.MarkStarted(GtexRuntimeMode.LivePlayback' in r
          assert 'ResolveBehaviorDrivenFieldPosition' not in r[r.find('private float ApplyLivePlayerState'):r.find('private Vector3 ResolveBehaviorAnchorPosition')]
          assert 'GtexRuntimeState.ActiveMode == GtexRuntimeMode.LivePlayback' in p
          assert 'rb.MovePosition(nextPosition)' not in phy
          assert 'ResolveExternalPlaybackTeleportDistance()' not in b[b.find('public void ApplyExternalState'):b.find('public Vector3 ResolveExternalPlaybackReleaseAnchor')]
          assert 'new Vector3(0f, 34f, -43f)' in c
          assert 'GtexRuntimeState.ActiveMode == GtexRuntimeMode.LivePlayback' in g
          subprocess.run(['git', 'diff', '--check'], check=True)
          PY

      - name: Commit migration and remove temporary tooling from branch
        run: |
          git config user.name "GTEX Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f tools/apply_gtex_authoritative_playback_fix.py tools/apply_gtex_authoritative_playback_fix_v2.py .github/workflows/gtex_authoritative_3d_patch.yml || true
          git add -A
          git diff --cached --check
          git commit -m "fix: make GTEX 3D playback authoritative and intentional"
          git push origin HEAD:fix/gtex-authoritative-3d-playback
