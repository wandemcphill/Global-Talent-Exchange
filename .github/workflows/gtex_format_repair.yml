name: GTEX spatial source formatter

on:
  push:
    branches:
      - fix/gtex-authoritative-spatial-simulation

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gtex-authoritative-spatial-simulation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install black
      - run: python -m black backend/app/services/authoritative_spatial_simulation.py backend/tests/test_authoritative_spatial_simulation.py
      - run: python - <<'PY'
          from pathlib import Path
          path = Path("backend/app/services/authoritative_spatial_simulation.py")
          text = path.read_text(encoding="utf-8").replace("from math import cos, hypot, sin, sqrt, tau", "from math import cos, hypot, sin, tau")
          path.write_text(text, encoding="utf-8")
        shell: bash
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/services/authoritative_spatial_simulation.py backend/tests/test_authoritative_spatial_simulation.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(gtex): format authoritative spatial simulation"
          git push origin HEAD:fix/gtex-authoritative-spatial-simulation
