name: Temporary Legendary Catalogue Black

on:
  push:
    branches:
      - feature/legendary-2000-catalogue-pipeline

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Black
        run: python -m pip install black
      - name: Format changed Python files
        run: >-
          python -m black
          backend/app/legend_catalogue/schema.py
          backend/app/legend_catalogue/validation.py
          backend/app/models/legendary_player.py
          backend/app/legend_catalogue/wikidata_source.py
          backend/app/services/legendary_player_launch_service.py
          backend/scripts/apply_legendary_catalogue_enrichment.py
          backend/migrations/versions/20260917_0125_legendary_catalogue_governance.py
          backend/scripts/import_approved_legendary_catalogue.py
          backend/tests/legend_layer/test_canonical_legendary_pilot.py
      - name: Commit formatted files
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Black made no changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/app/legend_catalogue/schema.py \
            backend/app/legend_catalogue/validation.py \
            backend/app/models/legendary_player.py \
            backend/app/legend_catalogue/wikidata_source.py \
            backend/app/services/legendary_player_launch_service.py \
            backend/scripts/apply_legendary_catalogue_enrichment.py \
            backend/migrations/versions/20260917_0125_legendary_catalogue_governance.py \
            backend/scripts/import_approved_legendary_catalogue.py \
            backend/tests/legend_layer/test_canonical_legendary_pilot.py
          git commit -m "style: format legendary catalogue changes"
          git push
