name: TEMP - Format public club profile files

on:
  push:
    branches:
      - chatgpt/gtex-club-profile-hq-continuation

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install formatter
        run: python -m pip install black

      - name: Format the new Python files
        run: >-
          python -m black
          backend/app/segments/clubs/segment_clubs.py
          backend/app/services/club_public_profile_service.py
          backend/tests/owner_console/test_public_club_profile.py

      - name: Commit the formatting-only changes
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          if git diff --quiet; then
            echo "The target files are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/segments/clubs/segment_clubs.py backend/app/services/club_public_profile_service.py backend/tests/owner_console/test_public_club_profile.py
          git commit -m "style(clubs): apply Black formatting to public profile"
          git push origin "HEAD:${BRANCH_NAME}"
