name: Phase A gift adapter

on:
  push:
    branches:
      - phase/a-economic-foundation
    paths:
      - '.github/workflows/phase-a-gift-adapter.yml'
      - 'backend/app/gift_engine/canonical_service.py'

authorizations:
  contents: write

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout phase branch
        uses: actions/checkout@v4
        with:
          ref: phase/a-economic-foundation
          fetch-depth: 0

      - name: Patch live gift router to canonical adapter
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/app/gift_engine/router.py')
          s = p.read_text()
          old = 'from app.gift_engine.service import GiftEngineError, GiftEngineService\n'
          new = (
              'from app.gift_engine.canonical_service import CanonicalGiftEngineService\n'
              'from app.gift_engine.service import GiftEngineError\n'
          )
          if old not in s:
              raise SystemExit('expected GiftEngineService import not found')
          s = s.replace(old, new, 1)
          s = s.replace('GiftEngineService(session)', 'CanonicalGiftEngineService(session)')
          p.write_text(s)
          PY

      - name: Format changed Python files
        working-directory: backend
        run: |
          python -m black app/gift_engine/canonical_service.py app/gift_engine/router.py

      - name: Run focused gift tests
        working-directory: backend
        run: |
          pytest -q tests/gift_engine

      - name: Commit integration and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/phase-a-gift-adapter.yml
          git config user.name 'gtex-phase-a-bot'
          git config user.email 'gtex-phase-a-bot@users.noreply.github.com'
          git add backend/app/gift_engine/router.py backend/app/gift_engine/canonical_service.py .github/workflows/phase-a-gift-adapter.yml
          git commit -m 'fix: route gifts through canonical currency conversion'
          git push origin HEAD:phase/a-economic-foundation
