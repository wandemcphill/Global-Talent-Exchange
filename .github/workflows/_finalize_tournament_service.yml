name: Finalize tournament service

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acceptance/gtex-full-user-journey-20260915
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install black
      - name: Restore static parser contract, format, validate and self-remove
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("backend/app/national_team_engine/tournament_service.py")
          text = path.read_text(encoding="utf-8")
          malformed = "    def _parse_date(self, value: Any) -> date | None:\n"
          correct = "    @staticmethod\n    def _parse_date(value: Any) -> date | None:\n"
          if text.count(malformed) != 1:
              raise SystemExit(f"expected one malformed _parse_date signature, found {text.count(malformed)}")
          path.write_text(text.replace(malformed, correct, 1), encoding="utf-8")
          PY
          black backend/app/national_team_engine/tournament_service.py
          python -m py_compile backend/app/national_team_engine/tournament_service.py
          grep -A2 -B1 'def _parse_date' backend/app/national_team_engine/tournament_service.py
          rm .github/workflows/_finalize_tournament_service.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/national_team_engine/tournament_service.py .github/workflows/_finalize_tournament_service.yml
          git commit -m 'fix(national-team): preserve static date parser contract'
          git push origin HEAD:acceptance/gtex-full-user-journey-20260915
