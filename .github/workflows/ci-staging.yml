name: CI and Staging Deploy

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: rm -rf build/unit_test_assets build/native_assets
      - run: python tool/check_analyzer_hard_errors.py
      - run: |
          if [ -d test ]; then
            rm -rf build/unit_test_assets build/native_assets
            flutter test
          fi

  frontend-live-fallback-regressions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: |
          rm -rf build/unit_test_assets build/native_assets
          flutter test test/secondary_api_backend_mode_test.dart -r compact
      - run: >
          rm -rf build/unit_test_assets build/native_assets &&
          flutter test
          test/live_clients_provider_test.dart
          --plain-name "active-shell routed providers clamp liveThenFixture down to live"
          -r compact
      - run: >
          rm -rf build/unit_test_assets build/native_assets &&
          flutter test
          test/gte_api_repository_test.dart
          --plain-name "does not fall back"
          -r compact
      - run: >
          rm -rf build/unit_test_assets build/native_assets &&
          flutter test
          test/gte_api_repository_test.dart
          --plain-name "fail closed in live mode without consulting fixtures"
          -r compact
      - run: >
          rm -rf build/unit_test_assets build/native_assets &&
          flutter test
          test/gte_api_repository_test.dart
          --plain-name "policy document reads no longer fall back to fixtures in live-then-fixture mode"
          -r compact
      - run: >
          rm -rf build/unit_test_assets build/native_assets &&
          flutter test
          test/gte_api_repository_test.dart
          --plain-name "policy acceptance reads no longer fall back to fixtures in live-then-fixture mode"
          -r compact

  frontend-route-integrity-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: |
          rm -rf build/unit_test_assets build/native_assets
          flutter test test/guardrails/forbidden_text_guard_test.dart -r compact
      - run: >
          rm -rf build/unit_test_assets build/native_assets &&
          flutter test
          test/match_center/canonical_match_center_test.dart
          test/match_center/live_match_realtime_test.dart
          -r compact
      - run: |
          rm -rf build/unit_test_assets build/native_assets
          flutter test test/navigation_surface_truth_test.dart -r compact
      - run: |
          rm -rf build/unit_test_assets build/native_assets
          flutter test test/match/match_screen_broadcast_test.dart -r compact
      - run: >
          rm -rf build/unit_test_assets build/native_assets &&
          flutter test
          test/active_shell_route_mount_test.dart
          --plain-name "router mounts live 2D routes, live broadcast, redirects quarantined match lanes, and profile admin"
          -r compact
      - run: >
          rm -rf build/unit_test_assets build/native_assets &&
          flutter test
          test/surface_runtime_proof_test.dart
          --plain-name "router mounts federations, national teams, and transfer center routes"
          -r compact

  frontend-android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug

  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend test dependencies
        run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements.txt pytest
      - name: Verify backend pytest collection
        run: python -m pytest --collect-only -q
      - name: Verify backend config smoke
        run: >
          python -m pytest
          backend/tests/app/test_config.py
          -k "runtime_secrets or placeholder_runtime_secrets or incomplete_bootstrap_admin_config or run_startup_seeding or cors_env_overrides or default_cors_origins_and_regex"
          -q
      - name: Verify backend core smoke slice
        run: >
          python -m pytest
          backend/tests/test_health_diagnostics.py
          backend/tests/app/test_email_config.py
          backend/tests/admin_godmode/test_bootstrap_admin.py
          backend/tests/backbone/test_outbox_relay.py
          backend/tests/leaderboards/test_ranking_service.py
          backend/tests/wallets/test_wallet_event_backbone.py
          -q
      - name: Verify canonical 2D/payment guardrails
        run: python -m pytest backend/tests/ops/test_canonical_production_guards.py -q

  backend-app-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend test dependencies
        run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements.txt pytest
      - name: Verify backend app contract harness
        run: >
          python -m pytest
          backend/tests/app/test_main.py
          backend/tests/app/test_module_registration_openapi.py
          backend/tests/app/test_module_registration_routes.py
          backend/tests/app/test_module_registration_hydration.py
          -q

  backend-live-match-center-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements.txt pytest
      - run: >
          python -m pytest
          backend/tests/live_matches/test_live_match_router.py
          backend/tests/live_matches/test_live_match_hot_path_cache.py
          backend/tests/live_matches/test_live_match_sampling.py
          backend/tests/match_engine/test_live_match_experience_contract.py
          backend/tests/realtime/test_match_websocket_gateway.py
          backend/tests/app/test_realtime_match_stream.py
          backend/tests/test_match_timeline_service.py
          -q

  backend-payment-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements.txt pytest
      - run: >
          python -m pytest
          backend/tests/admin_godmode/test_payment_rails_truth.py::test_payment_rails_drop_stale_non_live_defaults
          backend/tests/admin_godmode/test_payment_rails_truth.py::test_payment_rail_update_rejects_unsupported_provider
          backend/tests/admin_finance/test_payment_webhook_fraud_regressions.py::test_korapay_webhook_rejects_invalid_signature_when_secret_is_configured
          backend/tests/wallets/test_wallet_http.py::test_wallet_overview_surfaces_provider_status_and_live_restrictions
          backend/tests/wallets/test_wallet_http.py::test_provider_webhook_rejects_stub_provider
          backend/tests/wallets/test_wallet_http.py::test_purchase_order_quote_rejects_stub_provider
          -q

  backend-referral-durability:
    runs-on: ubuntu-latest
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements.txt pytest
      - run: >
          python -m pytest
          backend/tests/referrals/test_api_creator_profiles.py::test_creator_profile_survives_app_restart
          backend/tests/referrals/test_api_creator_profiles.py::test_creator_profile_updates_are_visible_across_app_instances
          backend/tests/referrals/test_api_attribution.py::test_attribution_survives_restart_and_progresses_on_fresh_instance
          backend/tests/referrals/test_api_attribution.py::test_attribution_and_competition_views_stay_consistent_across_app_instances
          backend/tests/referrals/test_referrals_admin_analytics.py::test_admin_referral_state_survives_restart
          -q

  backend-highlight-regressions:
    runs-on: ubuntu-latest
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements.txt pytest
      - run: >
          python -m pytest
          backend/tests/highlights/test_service.py::test_prepare_manifest_returns_unavailable_when_no_source_footage_is_configured
          backend/tests/highlights/test_service.py::test_prepare_manifest_returns_pending_when_source_footage_is_not_ready
          backend/tests/highlights/test_worker.py::test_highlight_worker_requeues_pending_source_jobs_without_storing_placeholder
          backend/tests/highlights/test_worker.py::test_highlight_worker_marks_missing_source_as_unavailable_without_storing_asset
          backend/tests/match_engine/test_match_engine_api.py::test_match_engine_highlights_route_exposes_clip_manifests
          -q

  backend-migration-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements.txt pytest
      - run: >
          python -m pytest
          backend/tests/app/test_database_schema_heads.py
          -k "ensure_database_schema_current or history_engagement_schema_repair or head_upgrade_materializes_model_tables_and_columns or head_upgrade_has_no_unmapped_tables_or_columns or head_upgrade_has_expected_index_coverage"
          -q

  deploy-staging:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.frontend-tests.result == 'success' &&
      needs.frontend-live-fallback-regressions.result == 'success' &&
      needs.frontend-route-integrity-regressions.result == 'success' &&
      needs.backend-tests.result == 'success' &&
      needs.backend-app-contract-tests.result == 'success' &&
      needs.backend-live-match-center-tests.result == 'success' &&
      needs.backend-payment-regressions.result == 'success' &&
      needs.backend-referral-durability.result == 'success' &&
      needs.backend-highlight-regressions.result == 'success' &&
      needs.backend-migration-integrity.result == 'success'
    needs:
      - frontend-tests
      - frontend-live-fallback-regressions
      - frontend-route-integrity-regressions
      - backend-tests
      - backend-app-contract-tests
      - backend-live-match-center-tests
      - backend-payment-regressions
      - backend-referral-durability
      - backend-highlight-regressions
      - backend-migration-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: gtex-staging-deploy
      cancel-in-progress: false
    environment:
      name: staging
      url: ${{ vars.RENDER_HEALTH_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install httpx websockets
      - run: python -m py_compile ops/render/deploy.py ops/render/verify_match_center_routes.py
      - name: Verify canonical staging ops guardrails
        run: python tools/quality/run_gtex_canonical_acceptance.py --diff-base=
      - name: Check Render deploy config
        id: render-config
        shell: bash
        env:
          RENDER_DEPLOY_MODE: hook-only
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_API: ${{ secrets.RENDER_SERVICE_API }}
          RENDER_DEPLOY_HOOK_API: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
          RENDER_SERVICE_WEB: ${{ secrets.RENDER_SERVICE_WEB }}
          RENDER_DEPLOY_HOOK_WEB: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
          RENDER_HEALTH_URL: ${{ vars.RENDER_HEALTH_URL }}
        run: |
          missing=()
          [[ -n "$RENDER_API_KEY" ]] || missing+=("RENDER_API_KEY")
          [[ -n "$RENDER_SERVICE_API" ]] || missing+=("RENDER_SERVICE_API")
          [[ -n "$RENDER_DEPLOY_HOOK_API" ]] || missing+=("RENDER_DEPLOY_HOOK_API")
          [[ -n "$RENDER_SERVICE_WEB" ]] || missing+=("RENDER_SERVICE_WEB")
          [[ -n "$RENDER_DEPLOY_HOOK_WEB" ]] || missing+=("RENDER_DEPLOY_HOOK_WEB")
          [[ -n "$RENDER_HEALTH_URL" ]] || missing+=("RENDER_HEALTH_URL")

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Skipping staging deploy. Missing: ${missing[*]}"
            exit 0
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"
      - run: python ops/render/deploy.py
        if: steps.render-config.outputs.configured == 'true'
        env:
          RENDER_DEPLOY_MODE: hook-only
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_API: ${{ secrets.RENDER_SERVICE_API }}
          RENDER_DEPLOY_HOOK_API: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
          RENDER_SERVICE_WEB: ${{ secrets.RENDER_SERVICE_WEB }}
          RENDER_DEPLOY_HOOK_WEB: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
          RENDER_SERVICE_ORDER: ${{ vars.RENDER_SERVICE_ORDER }}
          RENDER_HEALTH_URL: ${{ vars.RENDER_HEALTH_URL }}
          RENDER_VERIFY_MATCH_CENTER_ROUTES: "true"
