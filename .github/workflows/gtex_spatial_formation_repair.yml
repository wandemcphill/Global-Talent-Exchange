name: GTEX spatial formation repair

on:
  push:
    branches:
      - fix/gtex-spatial-formation-resilience

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/gtex-spatial-formation-resilience
          fetch-depth: 0

      - name: Patch formation line sizing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("backend/app/services/authoritative_spatial_simulation.py")
          text = path.read_text(encoding="utf-8")
          start = text.index("def _line_sizes")
          end = text.index("\ndef _anchors", start)
          replacement = '''def _line_sizes(runtime: Any) -> list[int]:
              outfield = runtime.lineup[1:]
              total = len(outfield)
              if total <= 0:
                  return []

              try:
                  values = [
                      max(0, int(part))
                      for part in str(runtime.current_formation).split("-")
                  ]
              except ValueError:
                  values = []
              if values and sum(values) == total and all(value > 0 for value in values):
                  return values

              defenders = sum(
                  runtime.players_by_id[item].role is PlayerRole.DEFENDER
                  for item in outfield
              )
              midfielders = sum(
                  runtime.players_by_id[item].role is PlayerRole.MIDFIELDER
                  for item in outfield
              )
              forwards = sum(
                  runtime.players_by_id[item].role is PlayerRole.FORWARD
                  for item in outfield
              )
              role_sizes = [size for size in (defenders, midfielders, forwards) if size > 0]
              if role_sizes and sum(role_sizes) == total:
                  return role_sizes

              defaults = {
                  1: [1],
                  2: [1, 1],
                  3: [1, 1, 1],
                  4: [2, 1, 1],
                  5: [2, 2, 1],
                  6: [3, 2, 1],
                  7: [3, 2, 2],
                  8: [3, 3, 2],
                  9: [4, 3, 2],
                  10: [4, 3, 3],
                  11: [4, 4, 3],
              }
              if total in defaults:
                  return defaults[total]

              if total == 1:
                  return [1]
              defenders = min(4, max(1, total - 2))
              forwards = min(3, max(1, total - defenders - 1))
              midfielders = total - defenders - forwards
              if midfielders < 1:
                  midfielders = 1
                  defenders = max(1, total - forwards - midfielders)
              return [defenders, midfielders, forwards]
          '''
          text = text[:start] + replacement.rstrip() + text[end:]
          path.write_text(text, encoding="utf-8")
          PY

          python -m compileall -q backend/app/services/authoritative_spatial_simulation.py
          git diff --check

      - name: Run focused regression
        run: |
          python -m pip install -r backend/requirements.txt pytest
          python -m pytest backend/tests/test_match_timeline_service.py::test_match_timeline_service_handles_stress_profiles_back_to_back -q

      - name: Commit repair and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/gtex_spatial_formation_repair.yml
          git add -A
          git commit -m "fix(gtex): handle reduced lineups in spatial anchors"
          git push origin HEAD:fix/gtex-spatial-formation-resilience
