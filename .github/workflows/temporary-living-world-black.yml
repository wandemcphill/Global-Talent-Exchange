name: Temporary Living World Black Formatting
on:
  push:
    branches:
      - feat/gtex-living-football-world
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout living-world PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/gtex-living-football-world
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Black
        run: python -m pip install black
      - name: Format the files flagged by Quality Gates
        run: |
          python -m black "backend/app/ads_engine/router.py" \
            "backend/app/auth/dependencies.py" \
            "backend/app/ads_engine/commercial_router.py" \
            "backend/app/models/brand_ad_campaign.py" \
            "backend/app/storage/__init__.py" \
            "backend/app/models/commercial_network.py" \
            "backend/app/storage/s3.py" \
            "backend/migrations/versions/20261107_0228_gtex_commercial_network.py" \
            "backend/app/wallets/providers/korapay.py" \
            "backend/app/ads_engine/commercial_service.py" \
            "backend/tests/ads_engine/test_commercial_security_remediation.py"
      - name: Commit formatter changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "backend/app/ads_engine/router.py" \
              "backend/app/auth/dependencies.py" \
              "backend/app/ads_engine/commercial_router.py" \
              "backend/app/models/brand_ad_campaign.py" \
              "backend/app/storage/__init__.py" \
              "backend/app/models/commercial_network.py" \
              "backend/app/storage/s3.py" \
              "backend/migrations/versions/20261107_0228_gtex_commercial_network.py" \
              "backend/app/wallets/providers/korapay.py" \
              "backend/app/ads_engine/commercial_service.py" \
              "backend/tests/ads_engine/test_commercial_security_remediation.py"
            git commit -m "style: format living world commercial backend files"
            git push origin HEAD:feat/gtex-living-football-world
          else
            echo "All targeted files already satisfy Black."
          fi
