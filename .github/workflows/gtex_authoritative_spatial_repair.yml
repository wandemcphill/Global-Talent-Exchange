name: GTEX authoritative spatial repair

on:
  push:
    branches:
      - fix/gtex-authoritative-spatial-simulation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/gtex-authoritative-spatial-simulation

      - name: Apply spatial repair
        run: python tools/apply_gtex_authoritative_spatial_repair.py

      - name: Compile spatial simulator
        run: python -m py_compile backend/app/services/authoritative_spatial_simulation.py backend/app/services/match_timeline_service.py tools/apply_gtex_authoritative_spatial_repair.py backend/tests/test_authoritative_spatial_simulation.py

      - name: Run focused match timeline tests
        working-directory: backend
        run: python -m pytest tests/test_authoritative_spatial_simulation.py tests/test_match_timeline_service.py tests/live_matches/test_live_match_sampling.py tests/match_engine -q

      - name: Commit repaired source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/services/match_timeline_service.py backend/app/services/authoritative_spatial_simulation.py tools/apply_gtex_authoritative_spatial_repair.py
          if git diff --cached --quiet; then
            echo "No source changes produced."
            exit 0
          fi
          git commit -m "fix(gtex): replace waypoint playback with continuous spatial simulation"
          git push origin HEAD:fix/gtex-authoritative-spatial-simulation
