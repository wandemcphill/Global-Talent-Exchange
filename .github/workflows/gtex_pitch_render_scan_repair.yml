name: GTEX pitch render scan repair

on:
  push:
    branches: [fix/gtex-pitch-render-scan]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/gtex-pitch-render-scan
      - name: Remove per-frame pitch scene scan
        shell: bash
        run: |
          set -euo pipefail
          FILE="Gtex_Test_Migration/Assets/Code/GTEX/Presentation/GtexLivePitchPresentation.cs"
          python - <<'PY'
          from pathlib import Path
          p = Path("Gtex_Test_Migration/Assets/Code/GTEX/Presentation/GtexLivePitchPresentation.cs")
          text = p.read_text(encoding="utf-8")
          anchor = '        private float lastWidth = -1f;\n'
          if anchor not in text:
              raise SystemExit("field anchor not found")
          text = text.replace(anchor, anchor + '        private bool legacyPitchRenderersHidden;\n', 1)
          old = '''            EnsurePresentation(pitch);\n            HideLegacyPitchRenderers();'''
          new = '''            EnsurePresentation(pitch);\n            if (!legacyPitchRenderersHidden)\n            {\n                HideLegacyPitchRenderers();\n                legacyPitchRenderersHidden = true;\n            }'''
          if old not in text:
              raise SystemExit("LateUpdate hide block not found")
          text = text.replace(old, new, 1)
          old2 = '''                BuildPitch(pitch);\n                lastLength = pitch.Length;'''
          new2 = '''                BuildPitch(pitch);\n                legacyPitchRenderersHidden = false;\n                lastLength = pitch.Length;'''
          if old2 not in text:
              raise SystemExit("BuildPitch cache reset anchor not found")
          text = text.replace(old2, new2, 1)
          p.write_text(text, encoding="utf-8")
          PY
          git diff --check
          git diff -- "$FILE"
          rm .github/workflows/gtex_pitch_render_scan_repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git add -u .github/workflows/gtex_pitch_render_scan_repair.yml
          git commit -m "perf(gtex): avoid per-frame legacy pitch scene scan"
          git push origin HEAD:fix/gtex-pitch-render-scan
