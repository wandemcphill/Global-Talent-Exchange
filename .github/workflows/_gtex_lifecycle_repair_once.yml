name: GTEX one-shot lifecycle repair

on:
  push:
    branches:
      - fix/gtex-authoritative-lifecycle-repair-7434281220425082328

permissions:
  contents: write

jobs:
  repair:
    if: github.actor == 'wandemcphill'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/gtex-authoritative-lifecycle-repair-7434281220425082328
          fetch-depth: 0

      - name: Apply authoritative lifecycle repairs
        working-directory: backend
        run: |
          python - <<'PY'
          from pathlib import Path

          service = Path('app/club_growth/service.py')
          text = service.read_text()

          old_import = 'from app.ingestion.models import ImageModerationStatus, Player, PlayerImageMetadata\n'
          new_import = old_import + 'from app.models.player_contract import PlayerContract\n'
          if old_import not in text:
              raise SystemExit('academy import anchor not found')
          if 'from app.models.player_contract import PlayerContract' not in text:
              text = text.replace(old_import, new_import, 1)

          old_promote = '''        senior_player = self._ensure_senior_player_for_prospect(club_id=club_id, prospect=prospect)\n        SquadTierService(self.session).ensure_membership(\n'''
          new_promote = '''        senior_player = self._ensure_senior_player_for_prospect(club_id=club_id, prospect=prospect)\n        self._ensure_academy_player_contract(\n            club_id=club_id,\n            prospect=prospect,\n            senior_player=senior_player,\n        )\n        SquadTierService(self.session).ensure_membership(\n'''
          if old_promote not in text:
              raise SystemExit('academy promotion anchor not found')
          text = text.replace(old_promote, new_promote, 1)

          anchor = '''    def _select_academy_portrait_asset_ref(self, *, seed: str, nationality: str | None) -> str:\n'''
          helper = '''    def _ensure_academy_player_contract(\n        self,\n        *,\n        club_id: str,\n        prospect: AcademyProspect,\n        senior_player: Player,\n    ) -> PlayerContract:\n        """Bridge the accepted academy offer into the canonical player-contract model.\n\n        The academy offer persists ``wage_minor`` as the authoritative contract amount\n        supplied by the existing academy API. PlayerContract stores that same economic\n        amount as Decimal and is consumed directly by payroll/club-wage aggregations.\n        """\n        accepted_offer = self.session.scalar(\n            select(AcademyRegenContractOffer)\n            .where(\n                AcademyRegenContractOffer.club_id == club_id,\n                AcademyRegenContractOffer.prospect_id == prospect.id,\n                AcademyRegenContractOffer.status == "accepted",\n            )\n            .order_by(AcademyRegenContractOffer.updated_at.desc(), AcademyRegenContractOffer.created_at.desc())\n        )\n        if accepted_offer is None:\n            raise ClubGrowthError("academy_acceptance_missing")\n\n        existing = self.session.scalar(\n            select(PlayerContract)\n            .where(\n                PlayerContract.player_id == senior_player.id,\n                PlayerContract.club_id == club_id,\n                PlayerContract.status.in_(("active", "expiring")),\n            )\n            .order_by(PlayerContract.starts_on.desc(), PlayerContract.created_at.desc())\n        )\n        if existing is not None:\n            return existing\n\n        conflicting = self.session.scalars(\n            select(PlayerContract).where(\n                PlayerContract.player_id == senior_player.id,\n                PlayerContract.status.in_(("active", "expiring")),\n            )\n        ).all()\n        for contract in conflicting:\n            contract.status = "terminated"\n            contract.ends_on = min(contract.ends_on, utcnow().date())\n\n        starts_on = utcnow().date()\n        months = max(1, int(accepted_offer.duration_months))\n        month_index = starts_on.month - 1 + months\n        end_year = starts_on.year + month_index // 12\n        end_month = month_index % 12 + 1\n        next_month_days = [31, 29 if end_year % 4 == 0 and (end_year % 100 != 0 or end_year % 400 == 0) else 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31]\n        end_day = min(starts_on.day, next_month_days[end_month - 1])\n        ends_on = date(end_year, end_month, end_day) - timedelta(days=1)\n\n        contract = PlayerContract(\n            player_id=senior_player.id,\n            club_id=club_id,\n            status="active",\n            wage_amount=Decimal(accepted_offer.wage_minor),\n            bonus_terms="academy_promotion",\n            release_clause_amount=None,\n            signed_on=starts_on,\n            starts_on=starts_on,\n            ends_on=ends_on,\n        )\n        self.session.add(contract)\n        self.session.flush()\n        senior_player.current_club_profile_id = club_id\n        return contract\n\n'''
          if anchor not in text:
              raise SystemExit('academy helper anchor not found')
          if 'def _ensure_academy_player_contract(' not in text:
              text = text.replace(anchor, helper + anchor, 1)
          service.write_text(text)

          legacy = Path('app/api_v1/service.py')
          text = legacy.read_text()
          old = '''    def rent_player(self, user: User, *, tournament_id: str, player_id: str) -> dict[str, Any]:\n        self._require_demo_fixture_support("tournament rentals")\n'''
          new = '''    def rent_player(self, user: User, *, tournament_id: str, player_id: str) -> dict[str, Any]:\n        raise GlobalApiV1RuntimeUnavailableError(\n            "Legacy tournament rentals are disabled; use the NationalTeamTournamentService rental lifecycle."\n        )\n'''
          if old not in text:
              raise SystemExit('legacy rental anchor not found')
          text = text.replace(old, new, 1)
          legacy.write_text(text)
          PY

      - name: Add academy regression assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/tests/club_growth/test_club_growth_router.py')
          text = path.read_text()

          import_anchor = 'from app.models.user import KycStatus, User, UserRole\n'
          if 'from app.models.player_contract import PlayerContract\n' not in text:
              text = text.replace(import_anchor, 'from app.models.player_contract import PlayerContract\n' + import_anchor, 1)

          table_anchor = '            PlayerImageMetadata.__table__,\n'
          if '            PlayerContract.__table__,\n' not in text:
              text = text.replace(table_anchor, table_anchor + '            PlayerContract.__table__,\n', 1)

          assertion_anchor = '''    assert session.get(Player, promoted.json()["senior_player_id"]) is not None\n'''
          assertion = '''    assert session.get(Player, promoted.json()["senior_player_id"]) is not None\n    contracts = list(\n        session.scalars(\n            select(PlayerContract).where(\n                PlayerContract.player_id == promoted.json()["senior_player_id"],\n                PlayerContract.club_id == club.id,\n                PlayerContract.status == "active",\n            )\n        )\n    )\n    assert len(contracts) == 1\n    assert contracts[0].wage_amount == 1000\n    assert contracts[0].starts_on <= contracts[0].ends_on\n    assert contracts[0].player_id == promoted.json()["senior_player_id"]\n'''
          if assertion_anchor not in text:
              raise SystemExit('academy test assertion anchor not found')
          if 'assert len(contracts) == 1' not in text:
              text = text.replace(assertion_anchor, assertion, 1)
          path.write_text(text)
          PY

      - name: Add legacy rental regression test
        run: |
          cat > backend/tests/national_team_engine/test_legacy_rental_quarantine.py <<'PY'
          from __future__ import annotations

          from fastapi import FastAPI
          from fastapi.testclient import TestClient

          from app.api_v1.router import router as api_v1_router
          from app.auth.dependencies import get_current_user
          from app.models.user import User


          def test_legacy_tournament_rental_is_quarantined() -> None:
              app = FastAPI()
              app.include_router(api_v1_router, prefix="/api/v2")
              user = User(id="legacy-rental-user", email="legacy@example.com", username="legacy", password_hash="x")
              app.dependency_overrides[get_current_user] = lambda: user
              client = TestClient(app)

              response = client.post("/api/v2/tournaments/legacy/rent", json={"player_id": "player-1"})

              assert response.status_code == 503
              assert "Legacy tournament rentals are disabled" in response.json()["detail"]
          PY

      - name: Run focused backend tests
        working-directory: backend
        run: |
          python -m pytest -q tests/club_growth/test_club_growth_router.py tests/national_team_engine/test_legacy_rental_quarantine.py

      - name: Remove one-shot workflow and commit repairs
        env:
          BRANCH: fix/gtex-authoritative-lifecycle-repair-7434281220425082328
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f .github/workflows/_gtex_lifecycle_repair_once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/club_growth/service.py backend/app/api_v1/service.py backend/tests/club_growth/test_club_growth_router.py backend/tests/national_team_engine/test_legacy_rental_quarantine.py .github/workflows/_gtex_lifecycle_repair_once.yml
          git commit -m "fix(lifecycle): bridge academy contracts and quarantine legacy rentals"
          git push origin "$BRANCH"
