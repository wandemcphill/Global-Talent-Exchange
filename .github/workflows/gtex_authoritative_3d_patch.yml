name: GTEX authoritative 3D playback migration

on:
  push:
    branches: [fix/gtex-authoritative-3d-playback]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/gtex-authoritative-3d-playback
          fetch-depth: 0

      - name: Apply base authoritative playback patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/apply_gtex_authoritative_playback_fix_v2.py')
          s = p.read_text(encoding='utf-8')
          lines = s.splitlines()
          lines = [line for line in lines if "assert m and 'ResolveBehaviorDrivenFieldPosition' not in m.group(0)" not in line]
          p.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python3 tools/apply_gtex_authoritative_playback_fix_v2.py

      - name: Harden ball, action dedupe, camera, and goalkeeper playback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          ROOT = Path.cwd()

          def replace_method(text, pattern, replacement):
              m = re.search(pattern, text, re.MULTILINE)
              if not m:
                  raise SystemExit(f'method not found: {pattern}')
              start = m.start()
              brace = text.find('{', m.end())
              if brace < 0:
                  raise SystemExit(f'opening brace not found: {pattern}')
              depth = 0
              for i in range(brace, len(text)):
                  if text[i] == '{':
                      depth += 1
                  elif text[i] == '}':
                      depth -= 1
                      if depth == 0:
                          return text[:start] + replacement.rstrip() + text[i+1:]
              raise SystemExit(f'closing brace not found: {pattern}')

          runtime_path = ROOT / 'Gtex_Test_Migration/Assets/Code/GTEX/GtexMatchRuntime.cs'
          runtime = runtime_path.read_text(encoding='utf-8')

          runtime = runtime.replace(
              '''        private void TryTriggerLiveBallAction(MatchResponse previousState, MatchResponse nextState)
        {
            var liveBallEvent =''',
              '''        private void TryTriggerLiveBallAction(MatchResponse previousState, MatchResponse nextState)
        {
            if (previousState == null ||
                nextState == null ||
                previousState.ballPosition == null ||
                nextState.ballPosition == null)
            {
                return;
            }

            var liveBallEvent =''',
              1)

          runtime = replace_method(
              runtime,
              r'\s*private void DriveBall\(',
              '''        private void DriveBall()
        {
            if (currentState == null ||
                currentState.ballPosition == null ||
                !GtexMatchController.BallAdapter.IsAvailable)
            {
                ClearSyntheticBallTransit();
                hasFilteredBallTarget = false;
                runtimeTraceBallSpeed = 0f;
                return;
            }

            var ballHolder = ResolveBallHolder(currentState.ballPosition);
            var ballConversion = ConvertIncomingPlaybackPosition(currentState.ballPosition, currentState);
            var suppressBoundaryMotion = ShouldSuppressBoundaryMotion(currentState);
            var authoritativeTarget = ballHolder != null || suppressBoundaryMotion
                ? ballConversion.ClampedWorld
                : ResolvePredictedFieldPosition(currentState.ballPosition, ResolveLivePredictionSeconds());
            var ballVelocity = ResolvePlaybackBallVelocity(currentState.ballPosition, suppressBoundaryMotion);
            runtimeTraceBallSpeed = new Vector3(ballVelocity.x, 0f, ballVelocity.z).magnitude;

            // Presentation interpolation only. The backend remains the sole source
            // of the actual football trajectory and action decision.
            var desiredPosition = authoritativeTarget;
            if (ballHolder == null && !suppressBoundaryMotion)
            {
                var currentBallPosition = GtexMatchController.BallAdapter.Position;
                var delta = authoritativeTarget - currentBallPosition;
                var distance = delta.magnitude;
                if (distance > 0.01f)
                {
                    var eventType = ResolveActiveEventTypeToken();
                    var shotLike = IsShotLikeEventType(eventType);
                    var minSpeed = shotLike ? 5f : 4f;
                    var maxSpeed = shotLike ? LiveBallPlaybackMaxShotSpeed : LiveBallPlaybackMaxPassSpeed;
                    var velocitySpeed = new Vector3(ballVelocity.x, 0f, ballVelocity.z).magnitude;
                    var catchupSpeed = Mathf.Min(
                        maxSpeed,
                        Mathf.Max(minSpeed, Mathf.Max(velocitySpeed, distance / 0.16f)));
                    desiredPosition = Vector3.MoveTowards(
                        currentBallPosition,
                        authoritativeTarget,
                        catchupSpeed * Mathf.Max(Time.deltaTime, LiveTraceDtFloorSeconds));
                }
            }

            desiredPosition = ClampToFieldBounds(desiredPosition, true);
            if (Time.unscaledTime - runtimeTraceLastBallSampleAt >= PlaybackTraceSampleIntervalSeconds)
            {
                runtimeTraceLastBallSampleAt = Time.unscaledTime;
                TraceBallPitchSample(ballConversion, desiredPosition, ballHolder);
            }

            GtexMatchController.BallAdapter.ApplyExternalState(
                desiredPosition,
                ballVelocity,
                ballHolder);
        }
''')

          ball_path = ROOT / 'Gtex_Test_Migration/Assets/Code/MatchEngine/Ball/Ball.cs'
          ball = ball_path.read_text(encoding='utf-8')
          ball = re.sub(
              r'''\s*if \(holderChanged\s*\|\|\s*Vector3\.Distance\(rigidbody\.position, ResolveExternalPlaybackHolderAnchor\(holder\)\)\s*>=\s*ResolveExternalPlaybackHolderSnapDistance\(\) \* 1\.75f\)\s*\{\s*SnapExternalPlaybackHolderAnchor\(holder\);\s*\}''',
              '''
                var holderAnchor = ResolveExternalPlaybackHolderAnchor(holder);
                transform.position = holderAnchor;
                rigidbody.position = holderAnchor;''',
              ball,
              count=1)
          if 'ResolveExternalPlaybackHolderSnapDistance() * 1.75f' in ball:
              raise SystemExit('holder snap gate still present')
          ball_path.write_text(ball + '\n', encoding='utf-8')

          camera_path = ROOT / 'Gtex_Test_Migration/Assets/Code/MatchEngine/Camera/CameraSystem.cs'
          camera = camera_path.read_text(encoding='utf-8-sig')
          camera = replace_method(
              camera,
              r'\s*private void Update\(\)',
              '''        private void Update()
        {
            if (target == null && Ball.Current != null)
            {
                target = Ball.Current.transform;
            }

            if (target == null)
            {
                return;
            }

            var dt = Mathf.Max(0.001f, Time.unscaledDeltaTime);
            if (isInTransition)
            {
                transitionValue += dt * transitionSpeed;
                if (transitionValue >= 1f)
                {
                    isInTransition = false;
                }
            }
            else
            {
                transitionValue = 1f;
            }

            if (CurrentCamera == null)
            {
                return;
            }

            if (IsBroadcastCamera && Ball.Current != null)
            {
                var focus = Ball.Current.transform.position;
                var velocity = Ball.Current.Velocity;
                velocity.y = 0f;
                if (velocity.sqrMagnitude > 0.0001f)
                {
                    focus += Vector3.ClampMagnitude(
                        velocity.normalized * broadcastLookAheadDistance,
                        broadcastLookAheadDistance);
                }

                // GTEX runtime pitch space is centred at the world origin.
                focus.x = Mathf.Clamp(focus.x, -45.5f, 45.5f);
                focus.z = Mathf.Clamp(focus.z, -27f, 27f);
                focus.y = 0.8f;

                var desiredPosition = focus + new Vector3(0f, 34f, -43f);
                var desiredRotation = Quaternion.LookRotation(focus - desiredPosition, Vector3.up);
                const float broadcastFov = 46f;

                if (instantTransitionInNextFrame)
                {
                    instantTransitionInNextFrame = false;
                    transform.SetPositionAndRotation(desiredPosition, desiredRotation);
                    camera.fieldOfView = broadcastFov;
                }
                else
                {
                    transform.position = Vector3.Lerp(
                        transform.position,
                        desiredPosition,
                        Mathf.Clamp01(dt * broadcastPositionSpeed * 1.35f));
                    transform.rotation = Quaternion.Slerp(
                        transform.rotation,
                        desiredRotation,
                        Mathf.Clamp01(dt * broadcastRotationSpeed * 1.2f));
                    camera.fieldOfView = Mathf.Lerp(
                        camera.fieldOfView,
                        broadcastFov,
                        Mathf.Clamp01(dt * CameraZoomSpeed));
                }

                TargetPosition = null;
                return;
            }

            var targetPos = TargetPosition ?? target.position;
            var (position, rotation, zoom) = CurrentCamera.Behave(in dt, targetPos);
            if (instantTransitionInNextFrame)
            {
                instantTransitionInNextFrame = false;
                transform.position = position;
                transform.rotation = rotation;
                camera.fieldOfView = zoom / (ZoomMultiplier + 1);
            }
            else
            {
                var rawPositionDifference = Vector3.Distance(transform.position, position) + 1f;
                var rawRotationDifference = Quaternion.Angle(transform.rotation, rotation) + 1f;
                var positionDifference = Mathf.Clamp(rawPositionDifference, 1f, 8f) * transitionValue;
                var rotationDifference = Mathf.Clamp(rawRotationDifference, 1f, 24f) * transitionValue;
                var positionLerp = Mathf.Clamp01(
                    dt * CameraPositionSpeed * positionDifference * positionDifferencePower);
                var rotationLerp = Mathf.Clamp01(
                    dt * CameraRotationSpeed * rotationDifference * rotationDifferencePower);
                transform.position = Vector3.Lerp(transform.position, position, positionLerp);
                transform.rotation = Quaternion.Lerp(transform.rotation, rotation, rotationLerp);
                camera.fieldOfView = Mathf.Lerp(
                    camera.fieldOfView,
                    zoom / (ZoomMultiplier + 1),
                    Mathf.Clamp01(dt * CameraZoomSpeed));
            }
        }
''')
          camera_path.write_text(camera + '\n', encoding='utf-8')

          gk_path = ROOT / 'Gtex_Test_Migration/Assets/Code/GTEX/Engine/GtexGoalkeeperBehavior.cs'
          gk = gk_path.read_text(encoding='utf-8-sig')
          if 'using FStudio.GTEX.Core;' not in gk:
              gk = gk.replace('using FStudio.GTEX;\n', 'using FStudio.GTEX;\nusing FStudio.GTEX.Core;\n', 1)
          gk = gk.replace(
              '''        private void LateUpdate()
        {
            if (GtexRuntimeFlags.IsOriginalVisualRuntime)
            {''',
              '''        private void LateUpdate()
        {
            if (GtexRuntimeState.ActiveMode == GtexRuntimeMode.LivePlayback ||
                GtexRuntimeFlags.IsOriginalVisualRuntime)
            {''',
              1)
          gk_path.write_text(gk + '\n', encoding='utf-8')

          subprocess.run(['git', 'checkout', 'origin/main', '--', 'README.md'], check=True)

          r = runtime_path.read_text(encoding='utf-8')
          p = (ROOT / 'Gtex_Test_Migration/Assets/Code/MatchEngine/Players/PlayerBase.cs').read_text(encoding='utf-8')
          b = ball_path.read_text(encoding='utf-8')
          c = camera_path.read_text(encoding='utf-8-sig')
          g = gk_path.read_text(encoding='utf-8-sig')
          phy = (ROOT / 'Gtex_Test_Migration/Assets/Code/GTEX/Engine/GtexPlaybackPhysicsUtil.cs').read_text(encoding='utf-8')

          assert '/api/v2/ws/match/' in r
          assert 'GtexRuntimeState.MarkStarted(GtexRuntimeMode.LivePlayback' in r
          start = r.find('private float ApplyLivePlayerState')
          end = r.find('private Vector3 ResolveBehaviorAnchorPosition')
          assert start >= 0 and end > start
          apply_method = r[start:end]
          assert 'ResolveBehaviorDrivenFieldPosition' not in apply_method
          assert 'ApplyStructuredTeamSpacing' not in apply_method
          assert 'FilterLivePlayerTarget' not in apply_method
          assert 'GtexRuntimeState.ActiveMode == GtexRuntimeMode.LivePlayback' in p
          assert 'rb.MovePosition(nextPosition)' not in phy
          span = b[b.find('public void ApplyExternalState'):b.find('public Vector3 ResolveExternalPlaybackReleaseAnchor')]
          assert 'ResolveExternalPlaybackTeleportDistance()' not in span
          assert 'TVBroadcast' in c and 'new Vector3(0f, 34f, -43f)' in c
          assert 'GtexRuntimeState.ActiveMode == GtexRuntimeMode.LivePlayback' in g
          assert 'lastLiveBallActionKey' in r and 'lastLiveEventActionKey' in r
          assert 'private void TryDriveSyntheticBallTransit' in r
          subprocess.run(['git', 'diff', '--check'], check=True)
          PY

      - name: Commit and push final source
        run: |
          git config user.name "GTEX Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm -f .github/workflows/gtex_authoritative_3d_patch.yml tools/apply_gtex_authoritative_playback_fix.py tools/apply_gtex_authoritative_playback_fix_v2.py || true
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m "fix: make GTEX 3D playback authoritative and intentional"
          git push origin HEAD:fix/gtex-authoritative-3d-playback
