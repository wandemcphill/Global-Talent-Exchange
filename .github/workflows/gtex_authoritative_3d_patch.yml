name: GTEX authoritative 3D playback migration

on:
  push:
    branches: [fix/gtex-authoritative-3d-playback]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/gtex-authoritative-3d-playback
          fetch-depth: 0

      - name: Apply and validate patch
        run: python3 tools/apply_gtex_authoritative_playback_fix_v2.py

      - name: Commit, remove migration tooling, and push
        run: |
          git config user.name "GTEX Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Gtex_Test_Migration/Assets/Code/GTEX/GtexMatchRuntime.cs \
                  Gtex_Test_Migration/Assets/Code/MatchEngine/Players/PlayerBase.cs \
                  Gtex_Test_Migration/Assets/Code/GTEX/Engine/GtexPlaybackPhysicsUtil.cs \
                  Gtex_Test_Migration/Assets/Code/MatchEngine/Ball/Ball.cs
          git rm -f .github/workflows/gtex_authoritative_3d_patch.yml tools/apply_gtex_authoritative_playback_fix.py tools/apply_gtex_authoritative_playback_fix_v2.py || true
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m "fix: make GTEX 3D playback authoritative and intentional"
          git push origin HEAD:fix/gtex-authoritative-3d-playback
