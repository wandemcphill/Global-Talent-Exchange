name: GTEX authoritative 3D playback migration

on:
  push:
    branches:
      - fix/gtex-authoritative-3d-playback

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/gtex-authoritative-3d-playback
          fetch-depth: 0

      - name: Apply authoritative playback fixes
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          ROOT = Path.cwd()

          def replace_method(text: str, signature_pattern: str, replacement: str) -> str:
              match = re.search(signature_pattern, text, re.MULTILINE)
              if not match:
                  raise SystemExit(f"method not found: {signature_pattern}")
              start = match.start()
              brace = text.find('{', match.end())
              if brace < 0:
                  raise SystemExit(f"method opening brace not found: {signature_pattern}")
              depth = 0
              end = None
              for i in range(brace, len(text)):
                  ch = text[i]
                  if ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              if end is None:
                  raise SystemExit(f"method closing brace not found: {signature_pattern}")
              return text[:start] + replacement.rstrip() + text[end:]

          runtime_path = ROOT / 'Gtex_Test_Migration/Assets/Code/GTEX/GtexMatchRuntime.cs'
          runtime = runtime_path.read_text(encoding='utf-8-sig')

          runtime = runtime.replace(
              'return normalized + "/api/v1/ws/match/" + Uri.EscapeDataString(matchId) + "?format=unity";',
              'return normalized + "/api/v2/ws/match/" + Uri.EscapeDataString(matchId) + "?format=unity";',
          )

          runtime = replace_method(
              runtime,
              r'\s*private float ApplyLivePlayerState\(',
              r'''        private float ApplyLivePlayerState(
            PlayerPosition livePlayer,
            GtexLegacyPlayerHandle player,
            float dt,
            float predictionSeconds,
            bool snap,
            bool traceSample,
            bool suppressBoundaryMotion)
        {
            if (livePlayer == null || player == null || !player.IsValid)
            {
                return 0f;
            }

            var currentPosition = player.Position;
            var directIncoming = ConvertIncomingPlaybackPosition(livePlayer, currentState);
            var liveVelocity = snap ? Vector3.zero : ResolveLiveFieldVelocity(livePlayer);
            liveVelocity.y = 0f;

            // LivePlayback is presentation of the authoritative match state.
            // Do not invent attack runs, support runs, pressing, spacing, roaming,
            // dribbling targets or any other tactical decision on the client.
            var targetPosition = snap
                ? directIncoming.ClampedWorld
                : ResolvePredictedFieldPosition(livePlayer, predictionSeconds);

            if (suppressBoundaryMotion)
            {
                targetPosition = directIncoming.ClampedWorld;
            }

            targetPosition = ClampToFieldBounds(targetPosition, false);

            var delta = targetPosition - currentPosition;
            delta.y = 0f;
            var distance = delta.magnitude;
            var hardSnapDistance = ResolveHardSnapDistance(suppressBoundaryMotion);
            var hardSnap = snap || distance >= hardSnapDistance;
            var speed = liveVelocity.magnitude;

            if (!hardSnap)
            {
                var minimumPresentationSpeed = livePlayer.active ? LivePlayerMinSpeedUnitsPerSecond : 0f;
                var maximumPresentationSpeed = Mathf.Max(LivePlayerMaxSpeedUnitsPerSecond, minimumPresentationSpeed);
                speed = Mathf.Clamp(speed, minimumPresentationSpeed, maximumPresentationSpeed);
                var catchupSpeed = Mathf.Max(speed, distance / Mathf.Max(LivePlayerCatchUpSeconds, 0.05f));
                var step = Mathf.Min(distance, catchupSpeed * Mathf.Max(dt, 0f));
                currentPosition = Vector3.MoveTowards(currentPosition, targetPosition, step);
            }
            else
            {
                currentPosition = targetPosition;
            }

            currentPosition = ClampToFieldBounds(currentPosition, false);

            Vector3 lookDirection = new Vector3(livePlayer.facingX, 0f, livePlayer.facingZ);
            if (lookDirection.sqrMagnitude <= 0.0001f)
            {
                lookDirection = delta.sqrMagnitude > 0.0001f ? delta : player.Forward;
                lookDirection.y = 0f;
            }

            Quaternion rotation = player.Rotation;
            if (lookDirection.sqrMagnitude > 0.0001f)
            {
                var desiredRotation = Quaternion.LookRotation(lookDirection.normalized, Vector3.up);
                rotation = hardSnap
                    ? desiredRotation
                    : Quaternion.Slerp(
                        player.Rotation,
                        desiredRotation,
                        Mathf.Clamp01(Mathf.Max(dt, 0f) * LivePlayerRotationLerpSpeed));
            }

            if (traceSample)
            {
                AppendRuntimeTrace(
                    "authoritative-pose",
                    "player=" + DescribeLivePlayer(livePlayer) +
                    " raw=" + FormatPlaybackVector(directIncoming.RawIncoming) +
                    " target=" + FormatPlaybackVector(targetPosition) +
                    " applied=" + FormatPlaybackVector(currentPosition) +
                    " velocity=" + FormatPlaybackVector(liveVelocity) +
                    " snap=" + hardSnap);
            }

            player.SetExternalPlaybackPose(currentPosition, rotation, hardSnap);

            ApplyLiveAnimatorState(
                livePlayer,
                player,
                currentPosition - player.Position,
                liveVelocity,
                dt,
                hardSnap,
                ((livePlayer.state ?? string.Empty).Trim().ToLowerInvariant()),
                1f,
                false);

            if (hardSnap || dt <= 0f)
            {
                return hardSnap ? 0f : speed;
            }

            return (currentPosition - player.Position).magnitude / Mathf.Max(dt, LiveTraceDtFloorSeconds);
        }
''',
          )

          runtime = replace_method(
              runtime,
              r'\s*private void TryStartSyntheticBallTransit\(',
              r'''        private void TryStartSyntheticBallTransit(MatchResponse previousState, MatchResponse nextState, bool forceSnap)
        {
            // The authoritative backend already provides the ball path/velocity.
            // Never synthesize a second trajectory in LivePlayback.
            ClearSyntheticBallTransit();
        }
''',
          )

          runtime = replace_method(
              runtime,
              r'\s*private bool TryDriveSyntheticBallTransit\(',
              r'''        private bool TryDriveSyntheticBallTransit()
        {
            // Kept for API shape compatibility. Authoritative ball playback is
            // driven directly from the current backend frame in DriveBall().
            return false;
        }
''',
          )

          runtime = replace_method(
              runtime,
              r'\s*private void DriveBall\(',
              r'''        private void DriveBall()
        {
            if (currentState == null ||
                currentState.ballPosition == null ||
                !GtexMatchController.BallAdapter.IsAvailable)
            {
                ClearSyntheticBallTransit();
                hasFilteredBallTarget = false;
                runtimeTraceBallSpeed = 0f;
                return;
            }

            var ballHolder = ResolveBallHolder(currentState.ballPosition);
            var ballConversion = ConvertIncomingPlaybackPosition(currentState.ballPosition, currentState);
            var suppressBoundaryMotion = ShouldSuppressBoundaryMotion(currentState);
            var targetPosition = ballHolder != null || suppressBoundaryMotion
                ? ballConversion.ClampedWorld
                : ResolvePredictedFieldPosition(currentState.ballPosition, ResolveLivePredictionSeconds());
            var ballVelocity = ResolvePlaybackBallVelocity(currentState.ballPosition, suppressBoundaryMotion);
            runtimeTraceBallSpeed = new Vector3(ballVelocity.x, 0f, ballVelocity.z).magnitude;

            // No low-pass target invention and no second trajectory solver.
            // The ball adapter receives the authoritative position/velocity every frame.
            targetPosition = ClampToFieldBounds(targetPosition, true);

            if (Time.unscaledTime - runtimeTraceLastBallSampleAt >= PlaybackTraceSampleIntervalSeconds)
            {
                runtimeTraceLastBallSampleAt = Time.unscaledTime;
                TraceBallPitchSample(ballConversion, targetPosition, ballHolder);
            }

            GtexMatchController.BallAdapter.ApplyExternalState(
                targetPosition,
                ballVelocity,
                ballHolder);
        }
''',
          )

          runtime_path.write_text(runtime + '\n', encoding='utf-8')

          player_path = ROOT / 'Gtex_Test_Migration/Assets/Code/MatchEngine/Players/PlayerBase.cs'
          player = player_path.read_text(encoding='utf-8-sig')
          marker = '''        public void ProcessBehaviours (in float time) {
'''
          guard = '''        public void ProcessBehaviours (in float time) {
            // GTEX LivePlayback is authoritative playback, not a second local AI
            // simulation. Keep the original AI available for the standalone asset
            // and other modes, but never let it issue competing football decisions
            // while backend state is driving this match.
            if (GtexRuntimeState.ActiveMode == GtexRuntimeMode.LivePlayback)
            {
                ActiveBehaviour = null;
                NextBehaviour = 0;
                return;
            }
'''
          if marker not in player:
              raise SystemExit('PlayerBase ProcessBehaviours marker not found')
          if guard not in player:
              player = player.replace(marker, guard, 1)
          player_path.write_text(player + '\n', encoding='utf-8')

          physics_path = ROOT / 'Gtex_Test_Migration/Assets/Code/GTEX/Engine/GtexPlaybackPhysicsUtil.cs'
          physics = physics_path.read_text(encoding='utf-8-sig')
          old = '''        public static void ApplyExternalPlaybackPosition(
            Transform target,
            Rigidbody rb,
            Vector3 nextPosition,
            Quaternion nextRotation,
            bool snap = false)
        {
            if (target == null)
            {
                return;
            }

            if (rb != null)
            {
                if (snap)
                {
                    rb.position = nextPosition;
                    rb.rotation = nextRotation;
                    target.SetPositionAndRotation(nextPosition, nextRotation);
                    return;
                }

                rb.MovePosition(nextPosition);
                rb.MoveRotation(nextRotation);
                return;
            }

            target.SetPositionAndRotation(nextPosition, nextRotation);
        }
'''
          new = '''        public static void ApplyExternalPlaybackPosition(
            Transform target,
            Rigidbody rb,
            Vector3 nextPosition,
            Quaternion nextRotation,
            bool snap = false)
        {
            if (target == null)
            {
                return;
            }

            // Live GTEX playback is visual state application, not physics simulation.
            // Write the authoritative pose immediately so Update/LateUpdate and
            // FixedUpdate cannot create a second clock or a delayed MovePosition queue.
            if (rb != null)
            {
                rb.position = nextPosition;
                rb.rotation = nextRotation;
                target.SetPositionAndRotation(nextPosition, nextRotation);
                return;
            }

            target.SetPositionAndRotation(nextPosition, nextRotation);
        }
'''
          if old not in physics:
              raise SystemExit('GtexPlaybackPhysicsUtil method shape not found')
          physics_path.write_text(physics.replace(old, new, 1) + '\n', encoding='utf-8')

          ball_path = ROOT / 'Gtex_Test_Migration/Assets/Code/MatchEngine/Ball/Ball.cs'
          ball = ball_path.read_text(encoding='utf-8-sig')
          ball = replace_method(
              ball,
              r'\s*private void FixedUpdate\(\)',
              r'''        private void FixedUpdate()
        {
            // During GTEX external playback the render/update loop is the single
            // authority. Never run a second FixedUpdate movement solver here.
            if (ExternalPlaybackEnabled)
            {
                return;
            }
        }
''',
          )

          old_holder = '''                if (holderChanged ||
                    Vector3.Distance(rigidbody.position, ResolveExternalPlaybackHolderAnchor(holder)) >= ResolveExternalPlaybackHolderSnapDistance() * 1.75f)
                {
                    SnapExternalPlaybackHolderAnchor(holder);
                }

                return;
'''
          new_holder = '''                var holderAnchor = ResolveExternalPlaybackHolderAnchor(holder);
                transform.SetPositionAndRotation(holderAnchor, ResolveExternalPlaybackRotation(targetVelocity));
                rigidbody.position = holderAnchor;
                rigidbody.rotation = transform.rotation;

                return;
'''
          if old_holder not in ball:
              raise SystemExit('Ball external holder branch not found')
          ball = ball.replace(old_holder, new_holder, 1)
          ball_path.write_text(ball + '\n', encoding='utf-8')

          # Remove the temporary migration workflow before committing the actual fixes.
          wf = ROOT / '.github/workflows/gtex_authoritative_3d_patch.yml'
          wf.unlink(missing_ok=True)

          # Source-level assertions for the intended ownership boundary.
          runtime_after = runtime_path.read_text(encoding='utf-8')
          assert '/api/v2/ws/match/' in runtime_after
          assert 'ResolveBehaviorDrivenFieldPosition' not in re.search(r'private float ApplyLivePlayerState\\([\\s\\S]*?private Vector3 ResolveBehaviorAnchorPosition', runtime_after).group(0)
          assert 'TryDriveSyntheticBallTransit' in runtime_after
          assert 'return false;' in re.search(r'private bool TryDriveSyntheticBallTransit\\([\\s\\S]*?\\n        }', runtime_after).group(0)
          assert 'GtexRuntimeState.ActiveMode == GtexRuntimeMode.LivePlayback' in player
          assert 'rb.MovePosition(nextPosition)' not in physics_path.read_text(encoding='utf-8')
          assert 'if (ExternalPlaybackEnabled)' in ball_path.read_text(encoding='utf-8')

          # Keep the working tree auditable.
          subprocess.run(['git', 'diff', '--check'], check=True)
          subprocess.run(['git', 'status', '--short'], check=True)
          subprocess.run(['git', 'diff', '--stat'], check=True)

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "GTEX Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Gtex_Test_Migration/Assets/Code/GTEX/GtexMatchRuntime.cs \
                  Gtex_Test_Migration/Assets/Code/MatchEngine/Players/PlayerBase.cs \
                  Gtex_Test_Migration/Assets/Code/GTEX/Engine/GtexPlaybackPhysicsUtil.cs \
                  Gtex_Test_Migration/Assets/Code/MatchEngine/Ball/Ball.cs
          git commit -m "fix: make GTEX 3D playback authoritative and intentional"
          git push origin HEAD:fix/gtex-authoritative-3d-playback
