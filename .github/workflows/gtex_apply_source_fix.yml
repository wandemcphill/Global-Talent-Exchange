name: GTEX source fix

on:
  push:
    branches:
      - fix/gtex-authoritative-3d-playback
  pull_request:

permissions:
  contents: write

jobs:
  repair:
    if: "!contains(github.event.head_commit.message || '', '[gtex-source-final]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gtex-authoritative-3d-playback
          fetch-depth: 0
      - name: Patch source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ROOT = Path('.')

          def replace_method(text: str, needle: str, replacement: str) -> str:
              start = text.find(needle)
              if start < 0:
                  raise SystemExit(f'missing method: {needle}')
              brace = text.find('{', start)
              if brace < 0:
                  raise SystemExit(f'missing opening brace: {needle}')
              depth = 0
              end = None
              for i in range(brace, len(text)):
                  if text[i] == '{':
                      depth += 1
                  elif text[i] == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              if end is None:
                  raise SystemExit(f'unclosed method: {needle}')
              return text[:start] + replacement.rstrip() + text[end:]

          # 1. Runtime: backend sample is authoritative. Unity interpolates only.
          rp = ROOT / 'Gtex_Test_Migration/Assets/Code/GTEX/GtexMatchRuntime.cs'
          r = rp.read_text(encoding='utf-8-sig')
          authoritative_player_method = '''        private float ApplyLivePlayerState(
            PlayerPosition livePlayer,
            GtexLegacyPlayerHandle player,
            float dt,
            float predictionSeconds,
            bool snap,
            bool traceSample,
            bool suppressBoundaryMotion)
        {
            if (livePlayer == null || player == null || !player.IsValid)
            {
                return 0f;
            }

            var currentPosition = player.Position;
            var conversion = ConvertIncomingPlaybackPosition(livePlayer, currentState);
            var liveVelocity = snap ? Vector3.zero : ResolveLiveFieldVelocity(livePlayer);
            liveVelocity.y = 0f;

            var targetPosition = snap || suppressBoundaryMotion
                ? conversion.ClampedWorld
                : ResolvePredictedFieldPosition(livePlayer, predictionSeconds);
            targetPosition = ClampToFieldBounds(targetPosition, false);

            var targetDelta = targetPosition - currentPosition;
            targetDelta.y = 0f;
            var targetDistance = targetDelta.magnitude;
            var requiresHardSnap = snap || targetDistance >= LivePlayerSnapDistance;

            var desiredLookDirection = ResolveLookDirection(livePlayer, targetDelta, player);
            var rotation = player.Rotation;
            if (desiredLookDirection.sqrMagnitude > 0.0001f)
            {
                var desiredRotation = Quaternion.LookRotation(desiredLookDirection.normalized, Vector3.up);
                rotation = requiresHardSnap
                    ? desiredRotation
                    : Quaternion.Slerp(
                        player.Rotation,
                        desiredRotation,
                        1f - Mathf.Exp(-LivePlayerRotationLerpSpeed * Mathf.Max(dt, 0f)));
            }

            Vector3 appliedPosition;
            if (requiresHardSnap)
            {
                appliedPosition = targetPosition;
            }
            else
            {
                var presentationSpeed = Mathf.Max(
                    liveVelocity.magnitude,
                    Mathf.Min(
                        LivePlayerMaxSpeedUnitsPerSecond,
                        targetDistance / Mathf.Max(LivePlayerCatchUpSeconds, LiveTraceDtFloorSeconds)));
                appliedPosition = Vector3.MoveTowards(
                    currentPosition,
                    targetPosition,
                    presentationSpeed * Mathf.Max(dt, 0f));
            }
            appliedPosition = ClampToFieldBounds(appliedPosition, false);

            if (traceSample)
            {
                AppendRuntimeTrace(
                    "pitch-sample",
                    "player=" + DescribeLivePlayer(livePlayer) +
                    " raw=" + FormatPlaybackVector(conversion.RawIncoming) +
                    " converted=" + FormatPlaybackVector(conversion.ConvertedWorld) +
                    " clamped=" + FormatPlaybackVector(conversion.ClampedWorld));
            }

            player.SetExternalPlaybackPose(appliedPosition, rotation, requiresHardSnap);
            ApplyLiveAnimatorState(
                livePlayer,
                player,
                appliedPosition - currentPosition,
                liveVelocity,
                dt,
                requiresHardSnap,
                (livePlayer.state ?? string.Empty).Trim().ToLowerInvariant(),
                1f,
                false);

            if (requiresHardSnap || dt <= 0f)
            {
                return 0f;
            }

            var frameMovement = appliedPosition - currentPosition;
            frameMovement.y = 0f;
            return frameMovement.magnitude / Mathf.Max(dt, LiveTraceDtFloorSeconds);
        }
'''
          r = replace_method(r, 'private float ApplyLivePlayerState(', authoritative_player_method)

          r = replace_method(r, 'private void TryStartSyntheticBallTransit(', '''        private void TryStartSyntheticBallTransit(MatchResponse previousState, MatchResponse nextState, bool forceSnap)
        {
            ClearSyntheticBallTransit();
        }
''')

          r = replace_method(r, 'private bool TryDriveSyntheticBallTransit(', '''        private bool TryDriveSyntheticBallTransit()
        {
            return false;
        }
''')

          authoritative_ball_method = '''        private void DriveBall()
        {
            if (currentState == null ||
                currentState.ballPosition == null ||
                !GtexMatchController.BallAdapter.IsAvailable)
            {
                ClearSyntheticBallTransit();
                hasFilteredBallTarget = false;
                runtimeTraceBallSpeed = 0f;
                return;
            }

            var holder = ResolveBallHolder(currentState.ballPosition);
            var conversion = ConvertIncomingPlaybackPosition(currentState.ballPosition, currentState);
            var velocity = ResolvePlaybackBallVelocity(currentState.ballPosition, false);
            runtimeTraceBallSpeed = new Vector3(velocity.x, 0f, velocity.z).magnitude;

            GtexMatchController.BallAdapter.ApplyExternalState(
                conversion.ClampedWorld,
                velocity,
                holder);
        }
'''
          r = replace_method(r, 'private void DriveBall(', authoritative_ball_method)
          r = r.replace('/api/v1/ws/match/', '/api/v2/ws/match/', 1)
          if 'GtexRuntimeState.MarkStarted(GtexRuntimeMode.LivePlayback' not in r:
              r = r.replace(
                  '            matchLoaded = true;\n',
                  '            matchLoaded = true;\n            GtexRuntimeState.MarkStarted(GtexRuntimeMode.LivePlayback, nameof(GtexMatchRuntime));\n',
                  1,
              )
          rp.write_text(r + '\n', encoding='utf-8')

          # 2. PlayerBase: disable local behaviour decisions during LivePlayback.
          pp = ROOT / 'Gtex_Test_Migration/Assets/Code/MatchEngine/Players/PlayerBase.cs'
          p = pp.read_text(encoding='utf-8-sig')
          marker = '        public void ProcessBehaviours (in float time) {\n'
          guard = marker + '''            if (GtexRuntimeState.ActiveMode == GtexRuntimeMode.LivePlayback)
            {
                ActiveBehaviour = null;
                NextBehaviour = 0;
                return;
            }
'''
          if marker not in p:
              raise SystemExit('PlayerBase ProcessBehaviours marker missing')
          if guard not in p:
              p = p.replace(marker, guard, 1)
          pp.write_text(p + '\n', encoding='utf-8')

          # 3. Ball: no second FixedUpdate playback solver and no implicit distance gate.
          bp = ROOT / 'Gtex_Test_Migration/Assets/Code/MatchEngine/Ball/Ball.cs'
          b = bp.read_text(encoding='utf-8-sig')
          b = replace_method(b, 'private void FixedUpdate()', '''        private void FixedUpdate()
        {
            if (ExternalPlaybackEnabled)
            {
                return;
            }
        }
''')
          token = 'ResolveExternalPlaybackTeleportDistance()'
          while token in b:
              idx = b.find(token)
              start = b.rfind('if', 0, idx)
              brace = b.find('{', idx)
              if start < 0 or brace < 0:
                  raise SystemExit('ball teleport gate structure not found')
              depth = 0
              end = None
              for i in range(brace, len(b)):
                  if b[i] == '{': depth += 1
                  elif b[i] == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              if end is None:
                  raise SystemExit('ball teleport gate not closed')
              b = b[:start] + '''GtexPlaybackPhysicsUtil.ApplyExternalPlaybackPosition(
                transform,
                rigidbody,
                targetPosition,
                externalPlaybackTargetRotation);''' + b[end:]
          bp.write_text(b + '\n', encoding='utf-8')

          # 4. Camera alias, only when this source predates the merged Phase 1 fix.
          cp = ROOT / 'Gtex_Test_Migration/Assets/Code/MatchEngine/Camera/CameraSystem.cs'
          if cp.exists():
              c = cp.read_text(encoding='utf-8-sig')
              if 'private static string ResolveCameraAlias' not in c:
                  c = c.replace(
                      '        public async Task SwitchCamera(string cameraType, bool instant = true) {\n',
                      '''        public async Task SwitchCamera(string cameraType, bool instant = true) {
            var resolvedCameraType = ResolveCameraAlias(cameraType);
''',
                      1,
                  )
                  c = c.replace('matchCameras.FindAsync(cameraType)', 'matchCameras.FindAsync(resolvedCameraType)', 1)
                  c = c.replace('CurrentCameraType = cameraType;', 'CurrentCameraType = resolvedCameraType;', 1)
                  insertion = '''
        private static string ResolveCameraAlias(string cameraType) {
            var normalized = (cameraType ?? string.Empty).Trim();
            return string.Equals(normalized, "Broadcast", System.StringComparison.OrdinalIgnoreCase)
                ? "TVBroadcast"
                : normalized;
        }
'''
                  marker = '        private async void Start() {'
                  c = c.replace(marker, insertion + '\n' + marker, 1)
                  c = c.replace('await SwitchCamera("Stadium");', 'await SwitchCamera("TVBroadcast");', 1)
              cp.write_text(c + '\n', encoding='utf-8')

          # 5. Remove the redundant parallel authoritative guard if it exists.
          gp = ROOT / 'Gtex_Test_Migration/Assets/Code/GTEX/Authoritative/GtexAuthoritativePlaybackGuard.cs'
          if gp.exists():
              gp.unlink()

          print('GTEX authoritative source repair applied')
          PY
      - name: Validate source
        run: |
          set -e
          git diff --check
          ! grep -q 'ResolveExternalPlaybackTeleportDistance()' Gtex_Test_Migration/Assets/Code/MatchEngine/Ball/Ball.cs
          grep -q '/api/v2/ws/match/' Gtex_Test_Migration/Assets/Code/GTEX/GtexMatchRuntime.cs
          grep -q 'GtexRuntimeState.ActiveMode == GtexRuntimeMode.LivePlayback' Gtex_Test_Migration/Assets/Code/MatchEngine/Players/PlayerBase.cs
          ! grep -A120 -B4 'private float ApplyLivePlayerState' Gtex_Test_Migration/Assets/Code/GTEX/GtexMatchRuntime.cs | grep -Eq 'ResolveBehaviorDrivenFieldPosition|ApplyStructuredTeamSpacing|FilterLivePlayerTarget|ResolveLiveMovementUrgency|ResolveLivePlayerMoveSpeed|ResolveLegalPlayerVelocity'
      - name: Commit permanent source repair
        run: |
          rm -f .github/workflows/gtex_apply_source_fix.yml
          git config user.name "GTEX Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: finalize GTEX authoritative 3D playback [gtex-source-final]"
          git push origin HEAD:fix/gtex-authoritative-3d-playback
