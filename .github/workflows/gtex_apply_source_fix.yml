name: GTEX source fix

on:
  push:
    branches:
      - fix/gtex-authoritative-3d-playback
  pull_request:

permissions:
  contents: write

jobs:
  repair:
    if: "!contains(github.event.head_commit.message || '', '[gtex-source-final]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gtex-authoritative-3d-playback
          fetch-depth: 0
      - name: Inspect repair target
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Gtex_Test_Migration/Assets/Code/GTEX/GtexMatchRuntime.cs')
          s=p.read_text(encoding='utf-8-sig')
          bad = [x for x in ('ResolveBehaviorDrivenFieldPosition','ApplyStructuredTeamSpacing','FilterLivePlayerTarget','ResolveLiveMovementUrgency') if x in s]
          print('live playback client-decision helpers present:', bad)
          print('api v1 present:', '/api/v1/ws/match/' in s)
          print('api v2 present:', '/api/v2/ws/match/' in s)
          PY
