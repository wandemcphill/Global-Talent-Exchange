name: GTEX source fix

on:
  push:
    branches:
      - fix/gtex-authoritative-3d-playback

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gtex-authoritative-3d-playback
          fetch-depth: 0
      - name: Inspect source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Gtex_Test_Migration/Assets/Code/GTEX/GtexMatchRuntime.cs')
          s=p.read_text(encoding='utf-8-sig')
          print('runtime bytes', len(s.encode()))
          print('has ApplyLivePlayerState', 'private float ApplyLivePlayerState(' in s)
          print('has synthetic transit', 'private void TryStartSyntheticBallTransit(' in s)
          print('has v1 socket', '/api/v1/ws/match/' in s)
          PY
