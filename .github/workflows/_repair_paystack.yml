name: Temporary Paystack Contract Repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Repair Paystack readiness contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          service = Path('backend/app/admin_godmode/service.py')
          text = service.read_text()
          old = 'def _paystack_enabled() -> bool:\n    return False\n'
          new = 'def _paystack_enabled() -> bool:\n    return provider_live_deposit_ready("paystack")\n'
          if old not in text:
              raise SystemExit('Expected _paystack_enabled implementation not found')
          service.write_text(text.replace(old, new, 1))
          PY
      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/admin_godmode/service.py
          git commit -m 'fix: align admin Paystack rail with provider readiness'
          git push
