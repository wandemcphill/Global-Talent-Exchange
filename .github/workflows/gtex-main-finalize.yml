name: GTEX main 3D renderer finalizer

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: "!contains(github.event.head_commit.message || '', '[gtex-main-final]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Apply permanent GTEX 3D renderer repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('.')
          def replace_method(text,sig,repl):
              s=text.find(sig)
              if s<0: raise SystemExit(f'missing method: {sig}')
              b=text.find('{',s); d=0; e=-1
              for i in range(b,len(text)):
                  if text[i]=='{': d+=1
                  elif text[i]=='}':
                      d-=1
                      if d==0: e=i+1; break
              if e<0: raise SystemExit(f'unclosed method: {sig}')
              return text[:s]+repl.rstrip()+text[e:]
          def write(p,t): p.write_text(t.rstrip()+'\n',encoding='utf-8')

          p=root/'Gtex_Test_Migration/Assets/Code/GTEX/GtexMatchRuntime.cs'
          t=p.read_text(encoding='utf-8-sig')
          if 'filteredPlayerVelocities' not in t:
              t=t.replace('private readonly Dictionary<string, Vector3> filteredPlayerTargets = new();','private readonly Dictionary<string, Vector3> filteredPlayerTargets = new();\n        private readonly Dictionary<string, Vector3> filteredPlayerVelocities = new();',1)
          t=replace_method(t,'private float ApplyLivePlayerState(','''        private float ApplyLivePlayerState(
            PlayerPosition livePlayer,
            GtexLegacyPlayerHandle player,
            float dt,
            float predictionSeconds,
            bool snap,
            bool traceSample,
            bool suppressBoundaryMotion)
        {
            if (livePlayer == null || player == null || !player.IsValid) return 0f;
            var safeDt=Mathf.Max(dt,LiveTraceDtFloorSeconds);
            var current=player.Position;
            var conversion=ConvertIncomingPlaybackPosition(livePlayer,currentState);
            var target=ClampToFieldBounds(conversion.ClampedWorld,false);
            var backendVelocity=snap?Vector3.zero:ResolveLiveFieldVelocity(livePlayer);
            backendVelocity.y=0f;
            var delta=target-current; delta.y=0f;
            var key=livePlayer.playerId??string.Empty;
            var velocityRef=filteredPlayerVelocities.TryGetValue(key,out var saved)?saved:Vector3.zero;
            var maxSpeed=Mathf.Clamp(Mathf.Max(backendVelocity.magnitude*1.25f,delta.magnitude/safeDt,LivePlayerMinSpeedUnitsPerSecond),LivePlayerMinSpeedUnitsPerSecond,10.5f);
            Vector3 applied;
            if(snap||!filteredPlayerTargets.ContainsKey(key)){applied=target;velocityRef=Vector3.zero;}
            else{applied=Vector3.SmoothDamp(current,target,ref velocityRef,0.10f,maxSpeed,safeDt);}
            applied=ClampToFieldBounds(applied,false);
            var presentationVelocity=(applied-current)/safeDt; presentationVelocity.y=0f;
            filteredPlayerTargets[key]=target;
            filteredPlayerVelocities[key]=velocityRef;
            var look=presentationVelocity.sqrMagnitude>0.01f?presentationVelocity.normalized:(backendVelocity.sqrMagnitude>0.0001f?backendVelocity.normalized:player.Forward);
            look.y=0f;
            var rotation=player.Rotation;
            if(look.sqrMagnitude>0.0001f) rotation=Quaternion.Slerp(player.Rotation,Quaternion.LookRotation(look,Vector3.up),1f-Mathf.Exp(-LivePlayerRotationLerpSpeed*safeDt));
            if(traceSample) AppendRuntimeTrace("pitch-sample","player="+DescribeLivePlayer(livePlayer)+" raw="+FormatPlaybackVector(conversion.RawIncoming)+" converted="+FormatPlaybackVector(conversion.ConvertedWorld)+" clamped="+FormatPlaybackVector(target));
            player.SetExternalPlaybackPose(applied,rotation,snap);
            ApplyLiveAnimatorState(livePlayer,player,applied-current,presentationVelocity,safeDt,snap,(livePlayer.state??string.Empty).Trim().ToLowerInvariant(),1f,false);
            return presentationVelocity.magnitude;
        }
''')
          t=replace_method(t,'private void TryStartSyntheticBallTransit(','''        private void TryStartSyntheticBallTransit(MatchResponse previousState, MatchResponse nextState, bool forceSnap)
        {
            ClearSyntheticBallTransit();
        }
''')
          t=replace_method(t,'private bool TryDriveSyntheticBallTransit(','''        private bool TryDriveSyntheticBallTransit()
        {
            return false;
        }
''')
          t=replace_method(t,'private void DriveBall(','''        private void DriveBall()
        {
            if(currentState==null||currentState.ballPosition==null||!GtexMatchController.BallAdapter.IsAvailable){ClearSyntheticBallTransit();hasFilteredBallTarget=false;runtimeTraceBallSpeed=0f;return;}
            var target=ClampToFieldBounds(ConvertIncomingPlaybackPosition(currentState.ballPosition,currentState).ClampedWorld,true);
            var velocity=ResolvePlaybackBallVelocity(currentState.ballPosition,false); velocity.y=0f; runtimeTraceBallSpeed=velocity.magnitude;
            GtexMatchController.BallAdapter.ApplyExternalState(target,velocity,ResolveBallHolder(currentState.ballPosition));
        }
''')
          t=replace_method(t,'private Vector3 ResolveReferenceCameraTarget(','''        private Vector3 ResolveReferenceCameraTarget(MatchResponse state)
        {
            EnsurePitchSpaceResolved();
            var focus=state!=null&&state.ballPosition!=null?ConvertIncomingPlaybackPosition(state.ballPosition,state).ClampedWorld:(pitchSpace!=null?pitchSpace.Center:Vector3.zero);
            var velocity=state!=null&&state.ballPosition!=null?ResolvePlaybackBallVelocity(state.ballPosition,false):Vector3.zero; velocity.y=0f;
            if(velocity.sqrMagnitude>0.0001f) focus+=Vector3.ClampMagnitude(velocity.normalized*3.5f,3.5f);
            if(pitchZones!=null) focus=pitchZones.GetSafeCameraFocusPoint(focus);
            focus.y=pitchSpace!=null?pitchSpace.GrassY:0f;
            lastLiveCameraTarget=ClampToFieldBounds(focus,false);
            return lastLiveCameraTarget;
        }
''')
          t=t.replace('/api/v1/ws/match/','/api/v2/ws/match/',1)
          if 'GtexRuntimeState.MarkStarted(GtexRuntimeMode.LivePlayback' not in t and '            matchLoaded = true;\n' in t:
              t=t.replace('            matchLoaded = true;\n','            matchLoaded = true;\n            GtexRuntimeState.MarkStarted(GtexRuntimeMode.LivePlayback, nameof(GtexMatchRuntime));\n',1)
          write(p,t)

          p=root/'Gtex_Test_Migration/Assets/Code/MatchEngine/Players/PlayerBase.cs'; t=p.read_text(encoding='utf-8-sig')
          marker='        public void ProcessBehaviours (in float time) {\n'
          guard=marker+'''            if (GtexRuntimeState.ActiveMode == GtexRuntimeMode.LivePlayback)
            {
                ActiveBehaviour = null;
                NextBehaviour = 0;
                return;
            }
'''
          if marker not in t: raise SystemExit('PlayerBase ProcessBehaviours marker missing')
          if 'GtexRuntimeState.ActiveMode == GtexRuntimeMode.LivePlayback' not in t[t.find(marker):t.find(marker)+700]: t=t.replace(marker,guard,1)
          write(p,t)

          p=root/'Gtex_Test_Migration/Assets/Code/MatchEngine/Ball/Ball.cs'; t=p.read_text(encoding='utf-8-sig')
          if 'private Vector3 externalPlaybackPresentationVelocity;' not in t:
              t=t.replace('        private float nextExternalPlaybackValidationAt;\n','        private float nextExternalPlaybackValidationAt;\n        private Vector3 externalPlaybackPresentationVelocity;\n',1)
          t=replace_method(t,'private void FixedUpdate()','''        private void FixedUpdate()
        {
            if (ExternalPlaybackEnabled && GtexRuntimeState.ActiveMode == GtexRuntimeMode.LivePlayback)
            {
                return;
            }
            if (!ExternalPlaybackEnabled || rigidbody == null) return;
            if (HolderPlayer != null) { DriveExternalPlaybackHolderAnchor(); return; }
            if (!hasExternalPlaybackTarget) return;
            var nextPosition=Vector3.MoveTowards(rigidbody.position,externalPlaybackTargetPosition,externalPlaybackMoveSpeed*Time.fixedDeltaTime);
            GtexPlaybackPhysicsUtil.ApplyExternalPlaybackPosition(transform,rigidbody,nextPosition,externalPlaybackTargetRotation);
        }
''')
          old='''            if (!hasExternalPlaybackTarget ||
                Vector3.Distance(rigidbody.position, targetPosition) >= ResolveExternalPlaybackTeleportDistance()) {
                GtexPlaybackPhysicsUtil.ApplyExternalPlaybackPosition(
                    transform,
                    rigidbody,
                    targetPosition,
                    externalPlaybackTargetRotation);
            }

            hasExternalPlaybackTarget = true;'''
          new='''            if (GtexRuntimeState.ActiveMode == GtexRuntimeMode.LivePlayback)
            {
                if (!hasExternalPlaybackTarget)
                {
                    GtexPlaybackPhysicsUtil.ApplyExternalPlaybackPosition(transform,rigidbody,targetPosition,externalPlaybackTargetRotation,true);
                    externalPlaybackPresentationVelocity=Vector3.zero;
                }
                else
                {
                    var maxVisualSpeed=Mathf.Clamp(Mathf.Max(externalPlaybackVelocity.magnitude*1.35f,18f),18f,28f);
                    var smoothed=Vector3.SmoothDamp(transform.position,targetPosition,ref externalPlaybackPresentationVelocity,0.055f,maxVisualSpeed,Mathf.Max(Time.unscaledDeltaTime,1f/60f));
                    smoothed.y=targetPosition.y;
                    GtexPlaybackPhysicsUtil.ApplyExternalPlaybackPosition(transform,rigidbody,smoothed,externalPlaybackTargetRotation,false);
                }
            }
            else if (!hasExternalPlaybackTarget || Vector3.Distance(rigidbody.position,targetPosition) >= ResolveExternalPlaybackTeleportDistance())
            {
                GtexPlaybackPhysicsUtil.ApplyExternalPlaybackPosition(transform,rigidbody,targetPosition,externalPlaybackTargetRotation);
            }
            hasExternalPlaybackTarget=true;'''
          if old not in t: raise SystemExit('Ball external playback tail missing')
          t=t.replace(old,new,1)
          write(p,t)

          p=root/'Gtex_Test_Migration/Assets/Code/MatchEngine/Camera/CameraSystem.cs'; t=p.read_text(encoding='utf-8-sig')
          needle='                var (position, rotation, zoom) = CurrentCamera.Behave(in dT, targetPos);'
          hook='''                if (IsBroadcastCamera && Ball.Current != null)
                {
                    ApplyGtexBroadcastCamera(targetPos,dT);
                    return;
                }

                var (position, rotation, zoom) = CurrentCamera.Behave(in dT, targetPos);'''
          if needle not in t: raise SystemExit('CameraSystem behaviour call missing')
          t=t.replace(needle,hook,1)
          if 'private void ApplyGtexBroadcastCamera(' not in t:
              idx=t.rfind('    }\n}')
              helper='''\n        private void ApplyGtexBroadcastCamera(Vector3 targetPos,float dT)
        {
            var ball=Ball.Current; if(ball==null) return;
            var velocity=ball.Velocity; velocity.y=0f;
            var direction=velocity.sqrMagnitude>0.04f?velocity.normalized:Vector3.right;
            var target=targetPos; target.y=0f;
            var desiredPosition=new Vector3(target.x-Mathf.Clamp(direction.x*3.5f,-3.5f,3.5f),18f,Mathf.Clamp(target.z-27f,-46f,46f));
            var lookAt=target+Vector3.up*0.8f;
            var desiredRotation=Quaternion.LookRotation(lookAt-desiredPosition,Vector3.up);
            var pT=1f-Mathf.Exp(-7.5f*Mathf.Max(dT,0.001f));
            var rT=1f-Mathf.Exp(-12f*Mathf.Max(dT,0.001f));
            transform.position=Vector3.Lerp(transform.position,desiredPosition,pT);
            transform.rotation=Quaternion.Slerp(transform.rotation,desiredRotation,rT);
            var desiredFov=Mathf.Lerp(52f,47f,Mathf.Clamp01(velocity.magnitude/12f));
            camera.fieldOfView=Mathf.Lerp(camera.fieldOfView,desiredFov,Mathf.Clamp01(dT*CameraZoomSpeed));
        }
'''
              t=t[:idx]+'    }\n'+helper+'}'
          write(p,t)

          print('GTEX 3D renderer repair applied')
          PY

      - name: Verify source contract
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          r=Path('Gtex_Test_Migration/Assets/Code/GTEX/GtexMatchRuntime.cs').read_text(encoding='utf-8-sig')
          b=Path('Gtex_Test_Migration/Assets/Code/MatchEngine/Ball/Ball.cs').read_text(encoding='utf-8-sig')
          p=Path('Gtex_Test_Migration/Assets/Code/MatchEngine/Players/PlayerBase.cs').read_text(encoding='utf-8-sig')
          c=Path('Gtex_Test_Migration/Assets/Code/MatchEngine/Camera/CameraSystem.cs').read_text(encoding='utf-8-sig')
          assert '/api/v2/ws/match/' in r
          assert 'GtexRuntimeState.ActiveMode == GtexRuntimeMode.LivePlayback' in p
          assert 'Vector3.SmoothDamp' in b
          assert 'ApplyGtexBroadcastCamera' in c
          s=r[r.index('private float ApplyLivePlayerState('):]
          s=s[:s.index('\n        private ',1)]
          for bad in ('ResolveBehaviorDrivenFieldPosition','ApplyStructuredTeamSpacing','ResolveLiveMovementUrgency','ResolveLivePlayerMoveSpeed','ResolveLegalPlayerVelocity'):
              assert bad not in s
          print('GTEX 3D renderer source contract PASS')
          PY
          git diff --check

      - name: Run focused source regression tests
        run: |
          python3 -m pytest tools/test_gtex_authoritative_playback_source.py -q

      - name: Commit permanent source repair and remove bootstrap workflows
        shell: bash
        run: |
          rm -f .github/workflows/gtex-main-finalize.yml .github/workflows/gtex-authoritative-finalize.yml .github/workflows/gtex-3d-renderer-repair.yml .github/workflows/gtex-3d-pr-finalize.yml tools/.gtex-renderer-repair-trigger
          git config user.name 'GTEX Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Gtex_Test_Migration/Assets/Code/GTEX/GtexMatchRuntime.cs Gtex_Test_Migration/Assets/Code/MatchEngine/Players/PlayerBase.cs Gtex_Test_Migration/Assets/Code/MatchEngine/Players/PlayerController/CodeBasedController.cs Gtex_Test_Migration/Assets/Code/MatchEngine/Ball/Ball.cs Gtex_Test_Migration/Assets/Code/MatchEngine/Camera/CameraSystem.cs tools/test_gtex_authoritative_playback_source.py .github/workflows/gtex-main-finalize.yml .github/workflows/gtex-authoritative-finalize.yml .github/workflows/gtex-3d-renderer-repair.yml .github/workflows/gtex-3d-pr-finalize.yml tools/.gtex-renderer-repair-trigger
          git diff --cached --check
          git commit -m 'fix: repair GTEX authoritative 3D playback [gtex-main-final]'
          git push origin main
