name: GTEX main authoritative playback finalizer

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: "!contains(github.event.head_commit.message || '', '[gtex-main-final]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Apply the authoritative source repair
        shell: bash
        run: |
          set -e
          test -f .github/workflows/gtex-authoritative-finalize.yml
          awk '/^[[:space:]]*python3 - '\''PY'\''$/{flag=1; next} flag && /^[[:space:]]*PY$/{exit} flag{sub(/^          /, ""); print}' .github/workflows/gtex-authoritative-finalize.yml > /tmp/gtex_finalize.py
          test -s /tmp/gtex_finalize.py
          python3 /tmp/gtex_finalize.py

      - name: Run source regression checks
        shell: bash
        run: |
          set -e
          python3 -m pytest tools/test_gtex_authoritative_playback_source.py -q
          git diff --check

      - name: Commit permanent repair and clean bootstrap workflows
        shell: bash
        run: |
          rm -f .github/workflows/gtex-authoritative-finalize.yml .github/workflows/gtex-main-finalize.yml tools/.gtex-finalizer-trigger
          git config user.name 'GTEX Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Gtex_Test_Migration/Assets/Code/GTEX/GtexMatchRuntime.cs \
                  Gtex_Test_Migration/Assets/Code/MatchEngine/Players/PlayerBase.cs \
                  Gtex_Test_Migration/Assets/Code/MatchEngine/Players/PlayerController/CodeBasedController.cs \
                  Gtex_Test_Migration/Assets/Code/MatchEngine/Ball/Ball.cs \
                  tools/test_gtex_authoritative_playback_source.py \
                  .github/workflows/gtex-authoritative-finalize.yml \
                  .github/workflows/gtex-main-finalize.yml \
                  tools/.gtex-finalizer-trigger
          git diff --cached --check
          git commit -m 'fix: finalize authoritative GTEX 3D playback [gtex-main-final]'
          git push origin main
