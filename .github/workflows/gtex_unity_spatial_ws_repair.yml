name: GTEX Unity spatial websocket repair

on:
  push:
    branches: [fix/gtex-unity-spatial-websocket]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/gtex-unity-spatial-websocket
      - name: Add dedicated Unity spatial websocket
        shell: bash
        run: |
          set -euo pipefail
          FILE="backend/app/live_matches/router.py"
          python - <<'PY'
          from pathlib import Path
          p = Path("backend/app/live_matches/router.py")
          text = p.read_text(encoding="utf-8")
          anchor = '@legacy_router.websocket("/{match_id}/stream")\n@api_router.websocket("/{match_id}/stream")\nasync def stream_match'
          if anchor not in text:
              raise SystemExit("live-match websocket anchor not found")
          route = '''@router.websocket("/api/v2/ws/match/{match_id}")\nasync def stream_unity_spatial_match(match_id: str, websocket: WebSocket) -> None:\n    app = websocket.scope["app"]\n    _require_unity_live_access_for_websocket(websocket, match_id=match_id)\n    await websocket.accept()\n    frame_interval = 0.05\n    try:\n        while True:\n            payload = build_unity_live_payload_for_app(app, match_id, include_full_timeline=False, event_limit=24)\n            await websocket.send_json(payload)\n            if not bool(payload.get("isLive", False)):\n                return\n            await asyncio.sleep(frame_interval)\n    except WebSocketDisconnect:\n        return\n\n\n'''
          text = text.replace(anchor, route + anchor, 1)
          p.write_text(text, encoding="utf-8")
          PY
          git diff --check
          grep -n -A26 -B2 'stream_unity_spatial_match' "$FILE"
          rm .github/workflows/gtex_unity_spatial_ws_repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git add -u .github/workflows/gtex_unity_spatial_ws_repair.yml
          git commit -m "fix(gtex): add dedicated Unity spatial websocket"
          git push origin HEAD:fix/gtex-unity-spatial-websocket
