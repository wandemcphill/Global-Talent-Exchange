name: Temporary Phase A Agent Ledger Closure

on:
  push:
    branches:
      - phase/a-economic-foundation

permissions:
  contents: write

jobs:
  agent-ledger-close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -r backend/requirements.txt black ruff pytest
      - name: Convert Agent Wallet to ledger-backed projection
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          manager = Path("backend/app/agents/agent_manager.py")
          text = manager.read_text()
          text = text.replace(
              "from datetime import UTC, datetime, timedelta\n",
              "from datetime import UTC, datetime, timedelta\nfrom decimal import Decimal\n",
              1,
          )
          text = text.replace(
              "from app.agents.agent_wallet import AgentWallet, AgentWalletService\n",
              "from app.agents.agent_wallet import AgentWallet, AgentWalletService\nfrom app.agents.ledger_service import AgentLedgerService\n",
              1,
          )
          text = text.replace(
              "from app.core.events import DomainEvent, EventPublisher\n",
              "from app.core.events import DomainEvent, EventPublisher\nfrom app.models.wallet import LedgerUnit\n",
              1,
          )
          text = text.replace(
              "        self.wallet_service = wallet_service or AgentWalletService()\n",
              "        self.wallet_service = wallet_service or AgentWalletService()\n        self.agent_ledger_service = AgentLedgerService()\n",
              1,
          )
          old = '''                boost_decision = self.wallet_service.recommend_boost(\n                    wallet=agent.wallet,\n                    predicted_reward=decision.predicted_reward,\n                    risk_level=decision.risk_level,\n                    feed_pressure=self._feed_pressure(),\n                )\n                agent.profile.strategy.global_exposure_feedback = decision.global_exposure_feedback\n                agent.profile.strategy.shared_brain = decision.shared_brain\n                variants = self.variant_planner.plan(profile=agent.profile, decision=decision)\n                generated = self.content_generator.generate(\n                    profile=agent.profile,\n                    decision=decision,\n                    variants=variants,\n                    boost_amount=boost_decision.boost_amount,\n                )\n                agent.wallet = self.wallet_service.apply_spend(agent.wallet, boost_decision.boost_amount)\n                self._publish_generated_clip(generated)\n'''
          new = '''                ledger_balance = self._agent_ledger_balance(agent.profile.identity.agent_id)\n                agent.wallet = agent.wallet.__class__(\n                    **{**agent.wallet.__dict__, "balance": float(ledger_balance)}\n                ) if hasattr(agent.wallet, "__dict__") else agent.wallet\n                boost_decision = self.wallet_service.recommend_boost(\n                    wallet=agent.wallet,\n                    predicted_reward=decision.predicted_reward,\n                    risk_level=decision.risk_level,\n                    feed_pressure=self._feed_pressure(),\n                )\n                agent.profile.strategy.global_exposure_feedback = decision.global_exposure_feedback\n                agent.profile.strategy.shared_brain = decision.shared_brain\n                variants = self.variant_planner.plan(profile=agent.profile, decision=decision)\n                generated = self.content_generator.generate(\n                    profile=agent.profile,\n                    decision=decision,\n                    variants=variants,\n                    boost_amount=boost_decision.boost_amount,\n                )\n                if boost_decision.boost_amount > 0.0:\n                    self._agent_ledger_spend(\n                        agent_id=agent.profile.identity.agent_id,\n                        amount=Decimal(str(boost_decision.boost_amount)),\n                        reference=f"agent-boost:{generated.clip_id}",\n                    )\n                agent.wallet = self._refresh_wallet_projection(\n                    agent, last_spend=boost_decision.boost_amount, last_earnings=0.0\n                )\n                self._publish_generated_clip(generated)\n'''
          if old not in text:
              raise SystemExit("run_cycle Agent Wallet mutation block not found")
          text = text.replace(old, new, 1)
          old2 = '''            agent.wallet, settlement = self.wallet_service.settle(\n                agent.wallet,\n                earnings=payload.earnings,\n                quality_score=quality_score,\n                trust_score=trust_score,\n                repetition_ratio=repetition_ratio,\n            )\n            agent.save_state()\n'''
          new2 = '''            agent.wallet, settlement = self.wallet_service.settle(\n                agent.wallet,\n                earnings=payload.earnings,\n                quality_score=quality_score,\n                trust_score=trust_score,\n                repetition_ratio=repetition_ratio,\n            )\n            if settlement.approved and settlement.realized_earnings > 0.0:\n                self._agent_ledger_earn(\n                    agent_id=record.agent_id,\n                    amount=Decimal(str(settlement.realized_earnings)),\n                    reference=f"agent-earnings:{record.clip_id}",\n                )\n            agent.wallet = self._refresh_wallet_projection(\n                agent, last_spend=0.0, last_earnings=settlement.realized_earnings\n            )\n            agent.save_state()\n'''
          if old2 not in text:
              raise SystemExit("record_performance Agent Wallet settlement block not found")
          text = text.replace(old2, new2, 1)
          anchor = '''    def close(self) -> None:\n        self._closed = True\n\n'''
          helpers = '''    def _agent_ledger_balance(self, agent_id: str) -> Decimal:\n        if self.state_store is None:\n            return Decimal("0.0000")\n        with self.state_store.session_factory() as session:\n            return self.agent_ledger_service.balance(session, agent_id=agent_id, unit=LedgerUnit.COIN)\n\n    def _agent_ledger_spend(self, *, agent_id: str, amount: Decimal, reference: str) -> str:\n        if self.state_store is None:\n            raise RuntimeError("Agent ledger persistence is unavailable; refusing economic spend.")\n        with self.state_store.session_factory() as session:\n            sink = self.agent_ledger_service.wallet_service.ensure_platform_account(session, LedgerUnit.COIN)\n            transaction_id = self.agent_ledger_service.spend(\n                session,\n                agent_id=agent_id,\n                amount=amount,\n                funding_sink=sink,\n                reference=reference,\n                source_tag=__import__("app.models.wallet", fromlist=["LedgerSourceTag"]).LedgerSourceTag.AGENT_BOOST_SPEND,\n                idempotency_key=reference,\n            )\n            session.commit()\n            return transaction_id\n\n    def _agent_ledger_earn(self, *, agent_id: str, amount: Decimal, reference: str) -> str:\n        if self.state_store is None:\n            raise RuntimeError("Agent ledger persistence is unavailable; refusing economic earnings.")\n        with self.state_store.session_factory() as session:\n            source = self.agent_ledger_service.wallet_service.ensure_platform_account(session, LedgerUnit.COIN)\n            transaction_id = self.agent_ledger_service.earn(\n                session,\n                agent_id=agent_id,\n                amount=amount,\n                funding_source=source,\n                reference=reference,\n                source_tag=__import__("app.models.wallet", fromlist=["LedgerSourceTag"]).LedgerSourceTag.AGENT_PERFORMANCE_EARNINGS,\n                idempotency_key=reference,\n            )\n            session.commit()\n            return transaction_id\n\n    def _refresh_wallet_projection(\n        self, agent: CreatorAgent, *, last_spend: float, last_earnings: float\n    ) -> AgentWallet:\n        balance = self._agent_ledger_balance(agent.profile.identity.agent_id)\n        cumulative_earnings = self._agent_ledger_total(\n            agent.profile.identity.agent_id, __import__("app.models.wallet", fromlist=["LedgerSourceTag"]).LedgerSourceTag.AGENT_PERFORMANCE_EARNINGS\n        )\n        cumulative_spend = abs(\n            self._agent_ledger_total(\n                agent.profile.identity.agent_id, __import__("app.models.wallet", fromlist=["LedgerSourceTag"]).LedgerSourceTag.AGENT_BOOST_SPEND\n            )\n        )\n        roi = (cumulative_earnings - cumulative_spend) / cumulative_spend if cumulative_spend > 0 else cumulative_earnings\n        return AgentWallet(\n            balance=float(balance),\n            lifetime_earnings=float(cumulative_earnings),\n            boost_spend=float(cumulative_spend),\n            roi=round(float(roi), 4),\n            last_spend=float(last_spend),\n            last_earnings=float(last_earnings),\n            trust_score=agent.wallet.trust_score,\n            quality_score=agent.wallet.quality_score,\n            repetition_ratio=agent.wallet.repetition_ratio,\n            payout_eligible=agent.wallet.payout_eligible,\n            last_block_reason=agent.wallet.last_block_reason,\n        )\n\n    def _agent_ledger_total(self, agent_id: str, source_tag) -> Decimal:\n        if self.state_store is None:\n            return Decimal("0.0000")\n        with self.state_store.session_factory() as session:\n            return self.agent_ledger_service.tagged_total(session, agent_id=agent_id, source_tag=source_tag)\n\n'''
          if anchor not in text:
              raise SystemExit("agent manager helper anchor not found")
          text = text.replace(anchor, helpers + anchor, 1)
          # Remove the temporary __dict__ path by importing replace and using it consistently.
          text = text.replace(
              "from dataclasses import dataclass, field\n",
              "from dataclasses import dataclass, field, replace\n",
              1,
          )
          text = text.replace(
              '''                agent.wallet = agent.wallet.__class__(\n                    **{**agent.wallet.__dict__, "balance": float(ledger_balance)}\n                ) if hasattr(agent.wallet, "__dict__") else agent.wallet\n''',
              '''                agent.wallet = replace(agent.wallet, balance=float(ledger_balance))\n''',
              1,
          )
          manager.write_text(text)

          state = Path("backend/app/agents/state_store.py")
          s = state.read_text()
          s = s.replace("from decimal import Decimal\n", "from decimal import Decimal\n", 0)
          if "from app.agents.ledger_service import AgentLedgerService" not in s:
              s = s.replace(
                  "from app.agents.learning_engine import AgentLearningState, AgentPerformanceSignal\n",
                  "from app.agents.learning_engine import AgentLearningState, AgentPerformanceSignal\nfrom app.agents.ledger_service import AgentLedgerService\n",
                  1,
              )
          s = s.replace(
              "from sqlalchemy import inspect, select\n",
              "from sqlalchemy import func, inspect, select\n",
              1,
          )
          s = s.replace(
              "    AgentWalletRecord,\n)",
              "    AgentWalletRecord,\n)\nfrom app.models.wallet import LedgerEntry, LedgerSourceTag, LedgerUnit\n",
              1,
          )
          old_wallet = '''            wallet_record.balance = float(agent.wallet.balance)\n            wallet_record.lifetime_earnings = float(agent.wallet.lifetime_earnings)\n            wallet_record.boost_spend = float(agent.wallet.boost_spend)\n'''
          new_wallet = '''            ledger_service = AgentLedgerService()\n            ledger_account = ledger_service.get_or_create_account(\n                session, agent_id=agent_id, unit=LedgerUnit.COIN\n            )\n            ledger_balance = ledger_service.wallet_service.get_balance(session, ledger_account)\n            lifetime_earnings = ledger_service.tagged_total(\n                session, agent_id=agent_id, source_tag=LedgerSourceTag.AGENT_PERFORMANCE_EARNINGS\n            )\n            boost_spend = abs(\n                ledger_service.tagged_total(\n                    session, agent_id=agent_id, source_tag=LedgerSourceTag.AGENT_BOOST_SPEND\n                )\n            )\n            wallet_record.balance = float(ledger_balance)\n            wallet_record.lifetime_earnings = float(lifetime_earnings)\n            wallet_record.boost_spend = float(boost_spend)\n'''
          if old_wallet not in s:
              raise SystemExit("state store wallet projection block not found")
          s = s.replace(old_wallet, new_wallet, 1)
          state.write_text(s)
          PY

          python -m black backend/app/agents/agent_manager.py backend/app/agents/ledger_service.py backend/app/agents/state_store.py backend/app/models/wallet.py backend/tests/agents/test_agent_ledger_service.py
          python -m ruff check --fix --no-cache backend/app/agents/agent_manager.py backend/app/agents/ledger_service.py backend/app/agents/state_store.py backend/app/models/wallet.py backend/tests/agents/test_agent_ledger_service.py
      - name: Extend ledger projection tests
        run: |
          cat >> backend/tests/agents/test_agent_ledger_service.py <<'PY'

          def test_agent_spend_and_earn_are_idempotent_and_ledger_authoritative() -> None:
              with make_session() as session:
                  service = AgentLedgerService(WalletService())
                  platform = service.wallet_service.ensure_platform_account(session, LedgerUnit.COIN)
                  agent = service.get_or_create_account(session, agent_id="agent-2", unit=LedgerUnit.COIN)
                  service.wallet_service.append_transaction(
                      session,
                      postings=[
                          __import__("app.wallets.service", fromlist=["LedgerPosting"]).LedgerPosting(
                              account=platform, amount=-Decimal("10.0000")
                          ),
                          __import__("app.wallets.service", fromlist=["LedgerPosting"]).LedgerPosting(
                              account=agent, amount=Decimal("10.0000")
                          ),
                      ],
                      reason=__import__("app.models.wallet", fromlist=["LedgerEntryReason"]).LedgerEntryReason.ADJUSTMENT,
                      reference="seed-agent-2",
                      external_reference="seed-agent-2",
                      actor=None,
                      idempotency_key="seed-agent-2",
                  )
                  session.commit()

                  service.spend(
                      session,
                      agent_id="agent-2",
                      amount=Decimal("2.0000"),
                      funding_sink=platform,
                      reference="agent-boost:test-clip",
                      idempotency_key="agent-boost:test-clip",
                  )
                  session.commit()
                  service.spend(
                      session,
                      agent_id="agent-2",
                      amount=Decimal("2.0000"),
                      funding_sink=platform,
                      reference="agent-boost:test-clip",
                      idempotency_key="agent-boost:test-clip",
                  )
                  session.commit()

                  assert service.balance(session, agent_id="agent-2") == Decimal("8.0000")
                  assert service.tagged_total(
                      session,
                      agent_id="agent-2",
                      source_tag=__import__("app.models.wallet", fromlist=["LedgerSourceTag"]).LedgerSourceTag.AGENT_BOOST_SPEND,
                  ) == Decimal("-2.0000")
          PY
          python -m black backend/tests/agents/test_agent_ledger_service.py
          python -m ruff check --fix --no-cache backend/tests/agents/test_agent_ledger_service.py
          python -m pytest backend/tests/agents/test_agent_ledger_service.py backend/tests/agents/test_agent_state_store_fail_closed.py backend/tests/agents/test_agent_wallet_economic_safety.py -q
      - name: Commit Agent ledger closure
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/agents backend/app/models/wallet.py backend/tests/agents
          git commit -m "feat(agents): make wallet balance ledger-authoritative"
          git push