name: Temporary Living World Prettier Fix
on:
  push:
    branches:
      - feat/gtex-living-football-world
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out living-world PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/gtex-living-football-world
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install repository dependencies
        run: npm ci --include=dev
      - name: Format the file flagged by Quality Gates
        run: npm exec -- prettier --write qa/playwright/stage1_browser_smoke.mjs
      - name: Commit formatter changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add qa/playwright/stage1_browser_smoke.mjs
            git commit -m "style: format living world browser smoke check"
            git push origin HEAD:feat/gtex-living-football-world
          else
            echo "The file already satisfies Prettier."
          fi
