name: Engineering Health

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  frontend-health:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: python tool/check_analyzer_hard_errors.py

  backend-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements.txt pytest
      - run: python -m pytest --collect-only -q
      - run: python -m pytest backend/tests/backbone/test_outbox_relay.py backend/tests/leaderboards/test_ranking_service.py backend/tests/wallets/test_wallet_event_backbone.py -q
