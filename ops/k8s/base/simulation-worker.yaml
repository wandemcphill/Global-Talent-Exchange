apiVersion: apps/v1
kind: Deployment
metadata:
  name: gtex-simulation-worker
  labels:
    app.kubernetes.io/name: gtex-simulation-worker
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: gtex-simulation-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gtex-simulation-worker
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: simulation-worker
          image: ghcr.io/your-org/gtex-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.backbone.simulation_worker_main"]
          envFrom:
            - configMapRef:
                name: gtex-shared-config
            - secretRef:
                name: gtex-secrets
          env:
            - name: GTE_KAFKA_CLIENT_ID
              value: gtex-simulation-worker
            - name: GTE_OUTBOX_RELAY_ENABLED
              value: "false"
            - name: GTE_KAFKA_API_QUEUE_CONSUMER_ENABLED
              value: "false"
            - name: GTE_KAFKA_SIMULATION_CONSUMER_ENABLED
              value: "true"
            - name: GTE_PROJECTION_WORKERS_ENABLED
              value: "false"
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi

