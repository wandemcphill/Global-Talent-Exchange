apiVersion: apps/v1
kind: Deployment
metadata:
  name: gtex-outbox-relay
  labels:
    app.kubernetes.io/name: gtex-outbox-relay
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gtex-outbox-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gtex-outbox-relay
        app.kubernetes.io/component: worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "9103"
    spec:
      containers:
        - name: outbox-relay
          image: ghcr.io/your-org/gtex-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.backbone.outbox_relay_main"]
          ports:
            - name: metrics
              containerPort: 9103
          envFrom:
            - configMapRef:
                name: gtex-shared-config
            - secretRef:
                name: gtex-secrets
          env:
            - name: GTE_KAFKA_CLIENT_ID
              value: gtex-outbox-relay
            - name: GTE_OUTBOX_RELAY_ENABLED
              value: "true"
            - name: GTE_KAFKA_API_QUEUE_CONSUMER_ENABLED
              value: "false"
            - name: GTE_KAFKA_SIMULATION_CONSUMER_ENABLED
              value: "false"
            - name: GTE_PROJECTION_WORKERS_ENABLED
              value: "false"
            - name: GTE_METRICS_PORT
              value: "9103"
            - name: GTE_OTEL_SERVICE_NAME
              value: gtex-outbox-relay
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
