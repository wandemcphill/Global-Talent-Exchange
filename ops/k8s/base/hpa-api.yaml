apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gtex-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gtex-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gtex-simulation-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gtex-simulation-worker
  minReplicas: 2
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gtex-projection-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gtex-projection-worker
  minReplicas: 1
