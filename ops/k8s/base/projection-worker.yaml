apiVersion: apps/v1
kind: Deployment
metadata:
  name: gtex-projection-worker
  labels:
    app.kubernetes.io/name: gtex-projection-worker
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gtex-projection-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gtex-projection-worker
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: projection-worker
          image: ghcr.io/your-org/gtex-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.backbone.projection_worker_main"]
          envFrom:
            - configMapRef:
                name: gtex-shared-config
            - secretRef:
                name: gtex-secrets
          env:
            - name: GTE_KAFKA_CLIENT_ID
              value: gtex-projection-worker
            - name: GTE_OUTBOX_RELAY_ENABLED
              value: "false"
            - name: GTE_KAFKA_API_QUEUE_CONSUMER_ENABLED
              value: "false"
            - name: GTE_KAFKA_SIMULATION_CONSUMER_ENABLED
              value: "false"
            - name: GTE_PROJECTION_WORKERS_ENABLED
              value: "true"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi

