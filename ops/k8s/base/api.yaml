apiVersion: apps/v1
kind: Deployment
metadata:
  name: gtex-api
  labels:
    app.kubernetes.io/name: gtex-api
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: gtex-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gtex-api
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: api
          image: ghcr.io/your-org/gtex-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: gtex-shared-config
            - secretRef:
                name: gtex-secrets
          env:
            - name: GTE_KAFKA_CLIENT_ID
              value: gtex-api
            - name: GTE_OUTBOX_RELAY_ENABLED
              value: "false"
            - name: GTE_KAFKA_API_QUEUE_CONSUMER_ENABLED
              value: "false"
            - name: GTE_KAFKA_SIMULATION_CONSUMER_ENABLED
              value: "false"
            - name: GTE_PROJECTION_WORKERS_ENABLED
              value: "false"
            - name: GTE_OTEL_SERVICE_NAME
              value: gtex-api
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: gtex-api
  labels:
    app.kubernetes.io/name: gtex-api
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/name: gtex-api
  ports:
    - name: http
      port: 80
      targetPort: http
