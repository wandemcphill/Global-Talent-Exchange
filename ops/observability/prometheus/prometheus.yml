global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: gtex-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8000

  - job_name: gtex-simulation-worker
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:9101

  - job_name: gtex-projection-worker
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:9102

  - job_name: gtex-outbox-relay
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:9103

  - job_name: otel-collector
    static_configs:
      - targets:
          - otel-collector:8888
