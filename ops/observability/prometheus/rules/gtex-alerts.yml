groups:
  - name: gtex-control-tower
    rules:
      - record: gtex:matches_per_minute:rate5m
        expr: sum(rate(gtex_matches_total[5m])) * 60

      - record: gtex:api_error_rate:ratio5m
        expr: |
          sum(rate(gtex_http_requests_total{job="gtex-api",status_code=~"5.."}[5m]))
          /
          clamp_min(sum(rate(gtex_http_requests_total{job="gtex-api"}[5m])), 1)

      - alert: GTexWithdrawalFailureRateHigh
        expr: |
          sum(rate(gtex_withdrawal_transitions_total{job="gtex-api",status="failed"}[5m]))
          /
          clamp_min(sum(rate(gtex_withdrawal_transitions_total{job="gtex-api",status=~"requested|paid|failed"}[5m])), 1)
          > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Withdrawal failures exceed 5%
          description: Investigate payout rails, treasury processing, and release events.

      - alert: GTexMatchQueueDelayHigh
        expr: max_over_time(gtex_match_queue_delay_seconds{job="gtex-simulation-worker"}[5m]) > 10
        for: 2m
        labels:
          severity: critical
          action: scale_workers
        annotations:
          summary: Match queue delay exceeded 10 seconds
          description: Simulation workers are falling behind and should be scaled.

      - alert: GTexTreasuryBalanceCritical
        expr: min_over_time(gtex_treasury_balance{job="gtex-api",account_code="platform:coin:treasury",unit="coin"}[5m]) < 1000
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Treasury balance fell below the red-alert threshold
          description: GTex treasury balance is under 1000 coin. Investigate immediately.

      - alert: GTexUnityLiveRefreshFailuresHigh
        expr: sum(rate(gtex_unity_live_access_total{job="gtex-api",action="refresh",result!="success"}[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Unity live token refresh failures detected
          description: Refresh token issuance or revalidation is failing for the Unity live lane.

      - alert: GTexUnityLivePayloadFailuresHigh
        expr: sum(rate(gtex_unity_live_payload_total{job="gtex-api",result=~"unavailable|error|not_found"}[5m])) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Unity live payload bridge failures detected
          description: The GTEX live payload bridge is returning unavailable, missing, or error states.

      - alert: GTexUnityLiveStaleStateDetected
        expr: sum(rate(gtex_unity_live_websocket_events_total{job="gtex-api",event="stale_state",result="detected"}[5m])) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Unity live websocket state appears stale
          description: Websocket sessions are remaining live without frame advancement long enough to trigger stale-state detection.

      - alert: GTexUnityLiveWebsocketRejectsHigh
        expr: sum(rate(gtex_unity_live_websocket_events_total{job="gtex-api",event="reject"}[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Unity live websocket rejects detected
          description: Unity live websocket bootstrap or auth rejects are occurring on the GTEX live lane.

      - alert: GTexUnityLiveReconnectChurnHigh
        expr: |
          sum(rate(gtex_unity_live_websocket_events_total{job="gtex-api",event="closed",result!="terminal"}[5m]))
          /
          clamp_min(sum(rate(gtex_unity_live_websocket_events_total{job="gtex-api",event="accepted",result="success"}[5m])), 1)
          > 1.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Unity live websocket reconnect churn is high
          description: Non-terminal websocket closes are outpacing accepted Unity live sessions, indicating reconnect degradation.

      - alert: GTexUnityLiveMatchGenerationFailuresHigh
        expr: sum(rate(gtex_unity_live_generated_match_total{job="gtex-api",result="missing_stream"}[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: GTEX generated live matches failed to bootstrap
          description: Generated live match requests are failing to resolve a backing stream for Unity playback.
