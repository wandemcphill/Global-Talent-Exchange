plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'dev.flutter.flutter-gradle-plugin'
}

def unityLibraryPresent = findProject(':unityLibrary') != null
def unityMinSdk = unityLibraryPresent ? 25 : 0

android {
    namespace = 'com.gtex.exchange'
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId = 'com.gtex.exchange'
        minSdk = Math.max((flutter.minSdkVersion as int), unityMinSdk)
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

dependencies {
    if (unityLibraryPresent) {
        implementation project(':unityLibrary')
    }
}

flutter {
    source = '../..'
}
