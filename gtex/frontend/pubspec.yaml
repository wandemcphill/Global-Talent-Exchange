name: gte_frontend
description: Global Talent Exchange Flutter MVP scaffold
publish_to: none

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  go_router: ^14.8.1
  http: ^1.2.2
  phosphor_flutter: ^2.0.0
  fl_chart: ^0.68.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  intl: ^0.19.0
  dio: ^5.4.0
  file_picker: ^10.3.10
  image_picker: ^1.0.0
  flutter_svg: ^2.1.0
  flutter_secure_storage: ^9.2.2
  flutter_animate: ^4.5.0
  just_audio: ^0.10.0
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.0
  video_player: ^2.9.2
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.1

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/media/
  fonts:
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-Regular.ttf
          weight: 400
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
    - family: DMMono
      fonts:
        - asset: assets/fonts/DMMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMMono-Medium.ttf
          weight: 500
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
          weight: 400
        - asset: assets/fonts/Inter.ttf
          weight: 600
