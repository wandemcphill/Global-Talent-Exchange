<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Global Talent Exchange: a premium football talent trading, live match center, and wallet experience.">
  <meta name="theme-color" content="#03060C">
  <meta property="og:title" content="Global Talent Exchange">
  <meta property="og:description" content="Trade football upside, run the matchday universe, and manage capital in one premium app.">
  <meta property="og:image" content="icons/Icon-512.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="GTEX">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Global Talent Exchange</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #03060c;
    }

    body {
      color: #f5f8fc;
      font-family: "Segoe UI", sans-serif;
    }

    #gtex-boot {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #03060c;
      isolation: isolate;
      z-index: 9999;
    }

    #gtex-boot::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(2, 5, 8, 0.86) 0%, rgba(2, 5, 8, 0.58) 42%, rgba(2, 5, 8, 0.2) 100%),
        linear-gradient(180deg, rgba(2, 5, 8, 0.08) 0%, rgba(2, 5, 8, 0.22) 46%, rgba(2, 5, 8, 0.82) 100%),
        radial-gradient(circle at 24% 72%, rgba(185, 255, 44, 0.16), transparent 28%);
      pointer-events: none;
      z-index: 1;
    }

    #gtex-boot.is-hidden {
      opacity: 0;
      pointer-events: none;
      transition: opacity 220ms ease;
    }

    .gtex-boot-card {
      position: absolute;
      left: clamp(1.25rem, 6vw, 5.5rem);
      bottom: clamp(1.75rem, 8vh, 5.5rem);
      width: min(100% - 2.5rem, 25rem);
      z-index: 2;
    }

    .gtex-boot-background {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      opacity: 0.78;
      filter: saturate(0.95) contrast(0.98);
      z-index: 0;
    }

    .gtex-boot-card img {
      width: 3.25rem;
      height: 3.25rem;
      margin: 0 0 1rem;
      border-radius: 0.9rem;
      object-fit: cover;
      box-shadow: 0 18px 46px rgba(0, 0, 0, 0.45);
    }

    .gtex-boot-card strong {
      display: block;
      margin-bottom: 0.6rem;
      color: #b9ff2c;
      font-size: clamp(2rem, 7vw, 4.8rem);
      line-height: 0.95;
      letter-spacing: 0;
    }

    .gtex-boot-card span {
      display: block;
      color: #d9e6e1;
      font-size: clamp(1rem, 2vw, 1.2rem);
      line-height: 1.5;
      max-width: 28rem;
    }

    .gtex-boot-progress {
      margin-top: 1.4rem;
      width: min(14rem, 70vw);
      height: 0.25rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      overflow: hidden;
    }

    .gtex-boot-progress::before {
      content: "";
      display: block;
      width: 42%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #b9ff2c, #63f4b1);
      animation: gtexBootPulse 1.2s ease-in-out infinite alternate;
    }

    @keyframes gtexBootPulse {
      from { transform: translateX(-8%); }
      to { transform: translateX(150%); }
    }

    @media (max-width: 720px) {
      #gtex-boot::before {
        background:
          linear-gradient(180deg, rgba(2, 5, 8, 0.2) 0%, rgba(2, 5, 8, 0.58) 50%, rgba(2, 5, 8, 0.92) 100%),
          radial-gradient(circle at 28% 72%, rgba(185, 255, 44, 0.14), transparent 30%);
      }

      .gtex-boot-card {
        left: 1.25rem;
        right: 1.25rem;
        bottom: 2rem;
        width: auto;
      }
    }
  </style>
</head>
<body>
  <div id="gtex-boot" aria-hidden="true">
    <img
      class="gtex-boot-background"
      src="assets/assets/media/gtex_boot_matchday.png"
      alt=""
    >
    <div class="gtex-boot-card">
      <img src="assets/assets/branding/gtex_icon.png" alt="">
      <strong>GTEX</strong>
      <span>The global football talent marketplace is loading.</span>
      <div class="gtex-boot-progress"></div>
    </div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        registrations.forEach(function (registration) {
          registration.unregister();
        });
      });
    }
    if ('caches' in window) {
      caches.keys().then(function (keys) {
        keys.forEach(function (key) {
          caches.delete(key);
        });
      });
    }

    function hideGtexBoot() {
      var boot = document.getElementById('gtex-boot');
      if (boot) {
        boot.classList.add('is-hidden');
        window.setTimeout(function () {
          boot.remove();
        }, 260);
      }
    }

    window.addEventListener('flutter-first-frame', hideGtexBoot);
    window.setTimeout(hideGtexBoot, 3600);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
