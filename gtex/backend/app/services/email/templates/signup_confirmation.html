<!DOCTYPE html>
<html lang="en">
  <body style="margin: 0; padding: 0; background: #f3f4f6; font-family: Arial, sans-serif; color: #111827;">
    <div style="max-width: 560px; margin: 0 auto; padding: 32px 16px;">
      <div style="background: #ffffff; border-radius: 16px; padding: 32px; border: 1px solid #e5e7eb;">
        <p style="margin: 0 0 8px; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #2563eb;">$brand_name</p>
        <h1 style="margin: 0 0 16px; font-size: 24px; line-height: 1.3;">$headline</h1>
        <p style="margin: 0 0 16px; font-size: 16px; line-height: 1.6;">Hi $recipient_name,</p>
        <p style="margin: 0 0 24px; font-size: 15px; line-height: 1.7;">$intro</p>
        <div style="background: #f9fafb; border: 1px solid #d1d5db; border-radius: 12px; padding: 16px; margin-bottom: 24px;">
          <p style="margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: #6b7280;">$code_label</p>
          <p style="margin: 0; font-size: 24px; font-weight: 700; letter-spacing: 0.08em;">$code_value</p>
        </div>
        $action_block
        <p style="margin: 0 0 12px; font-size: 14px; line-height: 1.6; color: #374151;">$fallback_text</p>
        <p style="margin: 0; font-size: 13px; line-height: 1.6; color: #6b7280;">$security_note</p>
      </div>
    </div>
  </body>
</html>
